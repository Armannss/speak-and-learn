  // ---------- toast, floating XP, celebration ----------
  function icEl(name, cls){
    var s = el("span", cls || null);
    s.innerHTML = ic(name);
    return s;
  }
  // Toasts are shown at most two at a time; the rest wait their turn.
  var toastQueue = [], toastsShown = 0;
  function toast(icon, title, sub, ms){
    toastQueue.push([icon, title, sub, ms]);
    pumpToasts();
  }
  function pumpToasts(){
    var wrap = document.getElementById("toastWrap");
    if (!wrap) return;
    while (toastsShown < 2 && toastQueue.length){
      (function(a){
        toastsShown++;
        var t = el("div", "toast");
        t.innerHTML = ic(a[0]);
        var b = el("div");
        b.appendChild(el("div", "t-title", a[1]));
        if (a[2]) b.appendChild(el("div", "t-sub", a[2]));
        t.appendChild(b);
        wrap.appendChild(t);
        setTimeout(function(){
          t.classList.add("out");
          setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); toastsShown--; pumpToasts(); }, 280);
        }, Math.min(a[3] || 2600, 2800));
      })(toastQueue.shift());
    }
  }
  function floatXP(text, x, y){
    var f = el("div", "xp-float", text);
    f.style.left = x + "px"; f.style.top = y + "px";
    document.body.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 1100);
  }
  function celebrate(c){
    var m = el("div", "modal center");
    var box = el("div", "celebrate");
    box.appendChild(el("div", "c-kicker", c.kicker || "Level up"));
    box.appendChild(el("div", "c-title", c.title));
    box.appendChild(el("div", "c-sub", c.sub));
    box.appendChild(btn("cbtn known block", c.btn || "Continue", function(){ if (m.parentNode) m.parentNode.removeChild(m); }));
    m.appendChild(box);
    document.body.appendChild(m);
  }

  // ---------- moving progress to another device with a link ----------
  // No server: the progress is packed into the part of the link after "#", which browsers never send anywhere.
  // The learner sends the link to themselves (Telegram, WhatsApp, email) and opens it on the other device.
  function bytesToB64url(bytes){
    var bin = "";
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64urlToBytes(t){
    t = t.replace(/-/g, "+").replace(/_/g, "/");

    var bin = atob(t), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function pipeBytes(bytes, stream){
    return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function(b){ return new Uint8Array(b); });
  }
  function makeMoveLink(){

    return pipeBytes(bytes, new CompressionStream("deflate-raw")).then(function(z){ return base + "z" + bytesToB64url(z); });
  }
  function readMoveCode(code){

    return p.then(function(b){ return JSON.parse(new TextDecoder().decode(b)); });
  }

    // one synonym question, plus one opposite (or word type) question on a different expression
    var rel = [];
    shuffleArray(L.items.slice()).forEach(function(it){

      var q = rel.length === 0 ? synonymFor(it) : (oppositeFor(it) || typeFor(it));
      if (q) rel.push(q);
    });
    quiz = quiz.concat(rel);
    shuffleArray(quiz);
    return study.concat(quiz);
  }

  // ---------- grammar questions ----------
  function grammarQuestion(topic, i){
    var g = topic.qs[i];
    var first = g.gap ? g.gap[0] : g.a;
    var full = g.q.indexOf("______") !== -1 ? g.q.replace("______", first) : first;
    full = full.replace(/^Type the (missing word|verb|past participle): /, "").replace(/\s*\([^)]*\)/g, "").replace(/"/g, "");
    var base = { id: "gr" + topic.id + i, tag: topic.title, prompt: g.q, explain: g.n, speakText: full, review: full, topicId: topic.id };
    if (g.gap){
      base.kind = "gap"; base.accept = g.gap; base.answer = g.gap[0];
    } else {
      var opts = g.o.concat([g.a]);
      shuffleArray(opts);
      base.kind = "mcq"; base.options = opts; base.answer = g.a;
    }
    return base;
  }
  function grammarSet(topicId, n){
    var pool = [];
    GRAMMAR.forEach(function(t){
      if (topicId && t.id !== topicId) return;
      t.qs.forEach(function(q, i){ pool.push([t, i]); });
    });
    shuffleArray(pool);
    return pool.slice(0, n).map(function(p){ return grammarQuestion(p[0], p[1]); });
  }
  function grammarDef(topicId){
    var topic = null;
    GRAMMAR.forEach(function(t){ if (t.id === topicId) topic = t; });
    return {
      title: topic ? topic.title : "Mixed grammar drill",
      grammarId: topicId || null,
      build: function(){ return grammarSet(topicId, topic ? Math.min(10, topic.qs.length) : 10); }
    };
  }

    startSession("grammar", grammarDef(topicId));

  // ---------- views ----------
  var session = null;
  var PRAISE = ["Correct", "That's right", "Exactly", "Well done", "Spot on"];

  // An unfinished lesson or exercise is saved after every step, so closing the app (or the phone
  // dropping it in the background) never sends the learner back to question 1.
  var SESSION_KEY = "speakLearnSession";
  var SESSION_MAX_AGE = 7 * 86400000;
  var sessionLive = false; // true while a question of the current session is on screen
  // paused: the learner left with X; it waits on Home and Practice instead of reopening on screen.
  function saveSession(paused){
    if (!session) return;
    sessionLive = true;
    saveJSON(SESSION_KEY, {
      mode: session.mode, title: session.title, lessonId: session.lessonId || null, grammarId: session.grammarId || null,
      qs: session.qs.map(function(q){ return q.kind === "study" ? { id: q.id, kind: "study", tag: q.tag, itemKey: q.item.key } : q; }),
      i: session.i, answered: session.answered, correct: session.correct, missed: session.missed,
      combo: session.combo, best: session.best, xp: session.xp, lvl0: session.lvl0, at: Date.now(), paused: !!paused
    });
  }
  function forgetSession(){
    sessionLive = false;
    forget(SESSION_KEY);
  }
  function sessionDef(mode, lessonId, grammarId){
    if (mode === "lesson"){
      var L = LESSONS.filter(function(l){ return l.id === lessonId; })[0];
      return L ? lessonDef(L) : null;
    }
    if (mode === "grammar") return grammarDef(grammarId);
    if (mode === "mistakes") return mistakesDef();
    return MODES[mode] || null;
  }
  // Returns "question" or "results" when a saved session was put back on the practice panel, else "".
  function restoreSession(){
    var s = loadObj(SESSION_KEY);
    forgetSession();
    if (!s || !Array.isArray(s.qs) || !s.qs.length || typeof s.i !== "number" || !(Date.now() - (s.at || 0) < SESSION_MAX_AGE)) return "";
    var m = sessionDef(s.mode, s.lessonId, s.grammarId);
    if (!m) return "";
    var byKey = {};
    FLAT.forEach(function(f){ byKey[f.key] = f; });
    var qs = [];
    for (var k = 0; k < s.qs.length; k++){
      var q = s.qs[k];
      if (!q || typeof q !== "object") return "";
      if (q.kind === "study"){
        if (!byKey[q.itemKey]) return ""; // the word was removed since
        q = { id: q.id, kind: "study", tag: q.tag, item: byKey[q.itemKey] };
      }
      qs.push(q);
    }
    var custom = MODES[s.mode] === m ? null : m;
    session = { mode: s.mode, title: s.title || m.title, build: m.build, custom: custom, grammarId: custom ? custom.grammarId : undefined, lessonId: custom ? custom.lessonId : undefined, isGrammar: s.mode === "grammar",
      qs: qs, i: Math.max(0, s.i), answered: typeof s.answered === "number" ? s.answered : -1, correct: s.correct | 0, missed: Array.isArray(s.missed) ? s.missed : [],
      combo: s.combo | 0, best: s.best | 0, xp: s.xp | 0, lvl0: s.lvl0 || levelFor(game.xp) };
    // That answer was already scored, so continue with the next question.
    if (session.answered === session.i) session.i++;
    if (session.i >= session.qs.length){ renderResults(); return "results"; }
    if (s.paused){ saveSession(true); return ""; }
    renderQuestion();
    return "question";
  }

    practiceEl.setAttribute("data-view", "home");
    updateFocus();
    var intro = el("div", "pg-head");
    intro.appendChild(el("h2", null, "Practice"));
    intro.appendChild(el("p", null, "Pick an exercise. Everything here uses the words, phrases and grammar from class."));
    practiceEl.appendChild(intro);
    if (hasPaused()){
      var paused = el("div", "notice");
      var pi = document.createElement("span");
      pi.innerHTML = ic("rotate");
      paused.appendChild(pi.firstChild);
      var pb = el("div", "notice-body");
      pb.appendChild(el("div", "m-title", session.title));
      pb.appendChild(el("div", "m-sub", "Paused at step " + (session.i + 1) + " of " + session.qs.length + "."));
      var pa = el("div", "row-actions left");
      pa.appendChild(btn("cbtn known sm", "Resume", resumeSession));
      pa.appendChild(btn("cbtn ghost sm", "End it", function(){ endSession(); renderHome(); }));
      pb.appendChild(pa);
      paused.appendChild(pb);
      paused.style.marginBottom = "12px";
      practiceEl.appendChild(paused);
    }
    var list = el("div", "pr-modes");
    var miss = missItems().length;
    var defs = [
      { id: "daily", color: catColor(0), icon: "target", title: "Daily 10", time: "5 min", desc: "Sentence completion, collocations and listening, mixed." },
      { id: "grammar", color: catColor(2), icon: "pen", title: "Grammar drill", time: "4 min", desc: "Ten questions across all " + GRAMMAR.length + " grammar points." },
      { id: "cloze", color: catColor(1), icon: "blank", title: "Fill the blank", time: "3 min", desc: "Choose the expression that completes the sentence." },
      { id: "colloc", color: catColor(4), icon: "link", title: "Collocation builder", time: "2 min", desc: "Finish the word partnership." },
      { id: "words", color: "var(--accent-edge)", icon: "swap", title: "Synonyms & opposites", time: "3 min", desc: "Same meaning, opposite meaning, and what type of word it is." },
      { id: "dict", color: catColor(5), icon: "headphones", title: "Listen and type", time: "5 min", desc: "Hear a sentence, type exactly what you heard." },
      { id: "speak", color: catColor(3), icon: "mic", title: "Speaking drill", time: "2 to 5 min", desc: "Timed speaking with expressions you must use." }
    ];
    if (miss > 0) defs.unshift({ id: "mistakes", color: "var(--bad)", icon: "rotate", title: "Review mistakes", time: miss + (miss === 1 ? " item" : " items"), desc: "The expressions you got wrong recently." });
    defs.forEach(function(d){
      list.appendChild(modeRow(d, function(){
        if (d.id === "speak") renderSpeakMenu();
        else if (d.id === "grammar") startGrammar(null);
        else if (d.id === "mistakes") startMistakes();
        else startSession(d.id);
      }));
    });
    practiceEl.appendChild(list);
    practiceEl.appendChild(el("div", "pr-tip", "Ten minutes every day works better than one long session a week."));
    renderHero();
  }

  function startSession(mode, custom){
    var m = custom || MODES[mode];
    session = { mode: mode, title: m.title, build: m.build, custom: custom || null, grammarId: custom ? custom.grammarId : undefined, lessonId: custom ? custom.lessonId : undefined, isGrammar: mode === "grammar",
      qs: m.build(), i: 0, answered: -1, correct: 0, missed: [], combo: 0, best: 0, xp: 0, lvl0: levelFor(game.xp) };
    if (!session.qs.length){ renderHome(); return; }
    renderQuestion();
  }

  function recordAnswer(q, ok, originEl){
    var gained;
    if (ok){
      session.correct++;
      session.combo++;
      session.best = Math.max(session.best, session.combo);
      gained = (q.kind === "mcq" ? 10 : q.kind === "gap" ? 12 : 15) + Math.min(5, Math.max(0, session.combo - 2));
      game.stats.correct++;
      if (q.kind === "dictation") game.stats.dict++;
      sfx("correct");
      buzz(15);
    } else {
      session.missed.push(q);
      session.combo = 0;
      gained = 3;
      sfx("wrong");
      buzz([30, 40, 30]);
    }
    var mk = q.itemKey || (q.id && /^(cl|co)/.test(q.id) ? q.id.slice(2) : null);
    if (mk){
      if (!ok) game.miss[mk] = Math.min(3, (game.miss[mk] || 0) + 1);
      else if (game.miss[mk]){ game.miss[mk]--; if (game.miss[mk] <= 0) delete game.miss[mk]; }
    }
    session.xp += gained;
    session.answered = session.i;
    saveSession();
    noteActivity(1);
    award(gained, originEl);
  }
  function advance(){
    session.i++;
    if (session.i >= session.qs.length) renderResults(); else renderQuestion();
  }
  function normAns(s){ return s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim(); }

  function renderQuestion(){
    clearPractice();
    saveSession();
    var q = session.qs[session.i];
    var last = session.i + 1 >= session.qs.length;
    var top = el("div", "pr-top");
    var x = btn("xbtn", "", pauseSession);
    x.innerHTML = ic("x");
    x.setAttribute("aria-label", "Leave and save for later");
    top.appendChild(x);
    var bar = progressBar(session.i / session.qs.length);
    top.appendChild(bar);
    var comboEl = el("span", "combo");
    function paintCombo(){ comboEl.innerHTML = ic("flame") + "<span>" + session.combo + " in a row</span>"; comboEl.hidden = session.combo < 3; }
    paintCombo();
    top.appendChild(comboEl);
    top.appendChild(el("span", "pr-top-right", (session.i + 1) + " / " + session.qs.length));
    practiceEl.appendChild(top);
    function afterAnswer(){
      bar.firstChild.style.width = ((session.i + 1) / session.qs.length * 100) + "%";
      paintCombo();
    }

    var card = el("div", "pr-card");
    card.appendChild(el("div", "pr-tag", q.tag));
    practiceEl.appendChild(card);

    // The answer button and the feedback sit in a dock pinned to the bottom of the screen, under the thumb.
    var dock = el("div", "pr-dock");
    var fb = el("div", "pr-feedback");
    fb.hidden = true;
    dock.appendChild(fb);
    var nextB = btn("cbtn known block", last ? "See results" : "Continue", advance);
    nextB.hidden = true;
    function showFeedback(ok, headText){
      fb.className = "pr-feedback " + (ok ? "good" : "bad");
      dock.className = "pr-dock " + (ok ? "good" : "bad");
      var fh = el("div", "pr-fb-head " + (ok ? "good" : "bad"));
      fh.appendChild(icEl(ok ? "check" : "x", "fbi"));
      fh.appendChild(el("span", null, headText));
      fb.appendChild(fh);
      if (q.explain) fb.appendChild(el("div", "pr-fb-note", q.explain));
    }
    function addSentence(){
      var full = el("div", "pr-fb-sentence");
      full.appendChild(el("span", null, q.review.replace(/[\[\]]/g, "")));
      full.appendChild(makeSpkBtn(q.speakText, true));
      fb.appendChild(full);
    }

    if (q.kind === "study"){
      var it = q.item;
      card.classList.add("study");
      card.style.setProperty("--cc", catColor(it.ci));
      var st = el("div", "st-term", it.term);
      card.appendChild(st);
      if (it.pos) card.appendChild(el("span", "pos", POS_NAMES[it.pos] || it.pos));
      var sp = makeSpkBtn(it.term, false);
      sp.classList.add("big-inline");
      card.appendChild(sp);
      if (it.meaning) card.appendChild(el("div", "st-meaning fa", it.meaning));
      if (it.example){
        var exr = el("div", "st-example");
        var exs = el("span");
        setMarked(exs, it.example, it.term);
        exr.appendChild(exs);
        exr.appendChild(makeSpkBtn(it.example, true));
        card.appendChild(exr);
      }
      if (it.syn.length || it.ant.length) card.appendChild(wordFacts({ pos: "", syn: it.syn, ant: it.ant }, "study-rel"));
      var goB = btn("cbtn known block", "Got it", function(){ sfx("tap"); bar.firstChild.style.width = ((session.i + 1) / session.qs.length * 100) + "%"; advance(); });
      dock.appendChild(goB);
      setTimeout(function(){ try { autoSpeak(it.term, sp); } catch (e) {} }, 350);
    } else if (q.kind === "mcq"){
      card.appendChild(el("div", "pr-prompt" + (q.audio ? " small" : ""), q.prompt));
      if (q.audio){
        var arow = el("div", "pr-play");
        var ab = makeSpkBtn(q.audio, false);
        ab.classList.add("big-inline");
        arow.appendChild(ab);
        arow.appendChild(btn("cbtn", "Play slowly", function(){ speak(q.audio, null, 0.6); }));
        card.appendChild(arow);
        setTimeout(function(){ try { autoSpeak(q.audio, ab); } catch (e) {} }, 350);
      }
      var opts = el("div", "pr-opts");
      var answered = false;
      var buttons = [];
      q.options.forEach(function(o){
        var b = btn("pr-opt", o, function(){
          if (answered) return;
          answered = true;
          var ok = (o === q.answer);
          buttons.forEach(function(xb){
            xb.disabled = true;
            if (xb.textContent === q.answer) xb.classList.add("right");
          });
          if (!ok) b.classList.add("wrong");
          recordAnswer(q, ok, b);
          afterAnswer();
          showFeedback(ok, ok ? pick(PRAISE) : "Not quite. The answer is: " + q.answer);
          addSentence();
          fb.hidden = false;
          dock.classList.remove("idle");
          nextB.hidden = false;
          nextB.focus();
        });
        buttons.push(b);
        opts.appendChild(b);
      });
      card.appendChild(opts);
    } else if (q.kind === "gap"){
      card.appendChild(el("div", "pr-prompt", q.prompt));
      var ginput = el("input", "pr-input");
      ginput.type = "text";
      ginput.id = "gapInput" + session.i;
      ginput.setAttribute("autocomplete", "off");
      ginput.setAttribute("autocapitalize", "off");
      ginput.setAttribute("spellcheck", "false");
      ginput.setAttribute("aria-label", "Your answer");
      ginput.placeholder = "Type your answer";
      card.appendChild(ginput);
      var gchecked = false;
      var gcheck = btn("cbtn known block", "Check", function(){
        if (gchecked){ advance(); return; }
        if (!ginput.value.trim()){ ginput.focus(); return; }
        gchecked = true;
        ginput.disabled = true;
        var typed = normAns(ginput.value);
        var ok = q.accept.some(function(a){ return normAns(a) === typed; });
        recordAnswer(q, ok, gcheck);
        afterAnswer();
        showFeedback(ok, ok ? pick(PRAISE) : "Not quite. The answer is: " + q.accept.join(" or "));
        addSentence();
        fb.hidden = false;
        gcheck.textContent = last ? "See results" : "Continue";
      });
      ginput.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); gcheck.click(); } });
      dock.appendChild(gcheck);
      setTimeout(function(){ try { ginput.focus(); } catch (e) {} }, 100);
    } else {
      var playRow = el("div", "pr-play");
      var playBtn = makeSpkBtn(q.speakText, false);
      playBtn.classList.add("big-inline");
      playBtn.addEventListener("click", function(){ speak(q.speakText, playBtn, 0.92); });
      var slowBtn = btn("cbtn", "Play slowly", function(){ speak(q.speakText, null, 0.6); });
      playRow.appendChild(playBtn);
      playRow.appendChild(slowBtn);
      card.appendChild(el("div", "pr-prompt small", "Listen, then type exactly what you hear."));
      card.appendChild(playRow);
      var input = el("input", "pr-input");
      input.type = "text";
      input.id = "dictInput" + session.i;
      input.setAttribute("autocomplete", "off");
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("spellcheck", "false");
      input.setAttribute("aria-label", "What you heard");
      input.placeholder = "Type the sentence here";
      card.appendChild(input);
      var checked = false;
      var checkB = btn("cbtn known block", "Check", function(){
        if (checked) { advance(); return; }
        checked = true;
        input.disabled = true;
        var tokens = cleanForCompare(q.answer).split(/\s+/).filter(function(t){ return tokNorm(t) !== ""; });
        var a = tokens.map(tokNorm);
        var b = cleanForCompare(input.value).split(/\s+/).map(tokNorm).filter(Boolean);
        var res = alignWords(a, b);
        var acc = res.lcs / Math.max(a.length, b.length, 1);
        var ok = acc >= 0.9;
        recordAnswer(q, ok, checkB);
        afterAnswer();
        showFeedback(ok, ok ? pick(PRAISE) + ", " + Math.round(acc * 100) + "% accurate" : Math.round(acc * 100) + "% accurate. Compare below.");
        var line = el("div", "pr-diff");
        tokens.forEach(function(tok, idx){
          line.appendChild(el("span", res.matched[idx] ? "w-ok" : "w-miss", tok));
          line.appendChild(document.createTextNode(" "));
        });
        fb.appendChild(line);
        fb.appendChild(el("div", "pr-fb-note", "You typed: " + (input.value.trim() || "(nothing)")));
        fb.hidden = false;
        checkB.textContent = last ? "See results" : "Continue";
      });
      input.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); checkB.click(); } });
      dock.appendChild(checkB);
      setTimeout(function(){ try { autoSpeak(q.speakText, playBtn, 0.92); input.focus(); } catch (e) {} }, 300);
    }
    if (q.kind === "mcq"){
      dock.appendChild(nextB);
      dock.classList.add("idle"); // nothing to show until an option is picked
    }
    practiceEl.appendChild(dock);
    fitDock(dock);
  }

  function renderResults(){
    clearPractice();
    forgetSession();
    askPersistence();
    game.stats.sessions++;
    var n = Math.max(1, session.qs.filter(function(x){ return x.kind !== "study"; }).length), score = session.correct;
    var perfect = (score === n && n >= 5);
    var r = dayRec();
    var firstDaily = false;
    if (session.mode === "daily"){ r.daily++; if (!r.step1){ r.step1 = 1; firstDaily = true; } }
    if (session.lessonId){
      var wasDone = (game.lessons[session.lessonId] || 0) >= LESSON_PASS;
      game.lessons[session.lessonId] = Math.max(game.lessons[session.lessonId] || 0, score / n);
      var passed = score / n >= LESSON_PASS;
      var firstTime = passed && !wasDone;
      session.qs.forEach(function(x){
        if (x.kind === "study" && !srs[x.item.key]) srs[x.item.key] = { b: 0, d: dayStr(0) };
      });
      saveSrs();
      if (firstTime){ session.xp += 15; award(15); }
      if (passed && !r.step1){ r.step1 = 1; firstDaily = true; }
    }
    if (session.isGrammar){
      game.stats.grammar++;
      if (session.grammarId){
        var prev = game.grammar[session.grammarId] || 0;
        game.grammar[session.grammarId] = Math.max(prev, score / n);
      }
    }
    saveGame();
    if (perfect){ game.stats.perfect++; session.xp += 20; award(20); }
    else checkBadges();

    addTopBar(session.title, "Results");
    var card = el("div", "pr-card center");
    var frac = score / n, C = 2 * Math.PI * 18;
    var rw = el("div");
    rw.innerHTML = '<svg class="res-ring ' + (frac >= 0.7 ? "" : frac >= 0.4 ? "mid" : "low") + '" viewBox="0 0 44 44" role="img" aria-label="' + score + ' out of ' + n + ' correct">' +
      '<circle class="bg" cx="22" cy="22" r="18"/>' +
      '<circle class="fg" cx="22" cy="22" r="18" transform="rotate(-90 22 22)" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(1) + '"/>' +
      '<text x="22" y="25.500" text-anchor="middle" font-size="10">' + Math.round(frac * 100) + '%</text></svg>';
    card.appendChild(rw.firstChild);
    var failedLesson = session.lessonId && frac < LESSON_PASS;
    card.appendChild(el("div", "res-title", score === n ? "A perfect round" : frac >= 0.7 ? "Good work" : failedLesson ? "Not there yet" : "Keep going"));
    var msg = failedLesson ? "You need 60% to complete this lesson. Go through it once more." : score === n ? (perfect ? "You earned a perfect-score bonus." : "Every answer correct.")
            : frac >= 0.7 ? "Review the ones you missed below."
            : "Repetition is how these stick. Try the same set again.";
    card.appendChild(el("div", "pr-fb-note", msg));
    var stats = el("div", "res-stats");
    [[score + " / " + n, "correct", ""], ["+" + session.xp, "XP earned", " xp"], [session.best, "in a row", ""]].forEach(function(s3){
      var cell = el("div", "res-stat" + s3[2]);
      cell.appendChild(el("b", null, String(s3[0])));
      cell.appendChild(el("small", null, s3[1]));
      stats.appendChild(cell);
    });
    card.appendChild(stats);
    practiceEl.appendChild(card);

    if (score >= n * 0.7){ sfx("goal"); bigConfetti(); }

    if (session.missed.length){
      var box = el("div", "pr-card");
      box.appendChild(el("div", "pr-tag", "Review these"));
      session.missed.forEach(function(q){
        var row = el("div", "phrase-row");
        var tx = el("div", "txt", q.review.replace(/[\[\]]/g, ""));
        if (q.explain && session.isGrammar) tx.appendChild(el("div", "phrase-fa", q.explain)).style.textAlign = "left";
        row.appendChild(tx);
        row.appendChild(makeSpkBtn(q.speakText, true));
        box.appendChild(row);
      });
      practiceEl.appendChild(box);
    }
    var ctr = el("div", "row-actions");
    if (session.lessonId){
      var nx = nextLesson();
      if (score / n < LESSON_PASS) ctr.appendChild(btn("cbtn known", "Try the lesson again", function(){ startSession(session.mode, session.custom); }));
      else if (nx) ctr.appendChild(btn("cbtn known", "Next lesson", function(){ startLesson(nx); }));
      ctr.appendChild(btn("cbtn", "Back to path", function(){ renderHome(); openView("learn"); }));
      if (score / n >= LESSON_PASS) ctr.appendChild(btn("cbtn ghost", "Repeat", function(){ startSession(session.mode, session.custom); }));
    } else {
      ctr.appendChild(btn("cbtn known", "Another round", function(){ startSession(session.mode, session.custom); }));
      if (session.isGrammar) ctr.appendChild(btn("cbtn", "Read the rules", function(){ renderHome(); openView("grammar"); }));
      if (session.mode === "daily") ctr.appendChild(btn("cbtn", "Add a speaking drill", renderSpeakMenu));
      ctr.appendChild(btn("cbtn ghost", "Done", function(){ renderHome(); openView("home"); }));
    }
    practiceEl.appendChild(ctr);

    if (firstDaily) setTimeout(function(){ completeMission("lesson"); }, 600);
  }

  // ---------- speaking ----------
  function speakDone(originEl){
    noteActivity(5);
    game.stats.speak++;
    var r = dayRec();
    r.speak++;
    saveGame();
    sfx("goal");
    award(25, originEl);
    if (r.speak === 1) completeMission("speak");
  }

  function renderSpeakMenu(){
    clearPractice();
    addTopBar("Speaking drill", null);
    var wrap = el("div", "pr-modes");
    wrap.appendChild(modeRow({ color: catColor(3), icon: "mic", title: "Argue a topic", time: "60 s + 90 s", desc: "A debate topic and three expressions you must use, as in class.", primary: true }, topicDrill));
    wrap.appendChild(modeRow({ color: catColor(0), icon: "chat", title: "Solve a case", time: "60 s + 2 min", desc: "A real dilemma from class. The app interrupts you twice with a challenge." }, caseDrill));

  function topicDrill(){
    clearPractice();
    addTopBar("Argue a topic", null);
    var topic = pick(DEBATE_TOPICS);
    var targets = sample(TARGET_EXPR, 3);
    var opener = pick(OPENERS);
    var card = el("div", "pr-card");
    card.appendChild(el("div", "pr-tag", "Topic"));
    card.appendChild(el("div", "pr-topic", topic));
    card.appendChild(el("div", "pr-tag", "Use these expressions"));
    var list = el("div", "pr-targets");
    targets.forEach(function(t){
      var r = el("div", "pr-target");
      r.appendChild(el("span", null, t));
      r.appendChild(makeSpkBtn(t.replace(/\b[XY]\b/g, "something"), true));
      list.appendChild(r);
    });
    card.appendChild(list);
    card.appendChild(el("div", "pr-tag", "Try opening with"));
    var op = el("div", "pr-target");
    op.appendChild(el("span", null, opener));
    op.appendChild(makeSpkBtn(opener.replace(/…/g, "..."), true));
    card.appendChild(op);
    var phase = el("div", "pr-phase", "You get 60 seconds to prepare, then speak for about 90 seconds.");
    var clock = el("div", "pr-clock", "01:00");
    card.appendChild(phase);
    card.appendChild(clock);
    var ctr = el("div", "row-actions");
    var startB = btn("cbtn known", "Start the timer", startPrep);
    var skipB = btn("cbtn", "Skip preparation", startSpeak);
    var stopB = btn("cbtn", "Finish early", finish);
    var newB = btn("cbtn ghost", "Different topic", topicDrill);
    skipB.hidden = true; stopB.hidden = true;
    ctr.appendChild(startB); ctr.appendChild(skipB); ctr.appendChild(stopB); ctr.appendChild(newB);
    card.appendChild(ctr);
    practiceEl.appendChild(card);

    function startPrep(){
      startB.hidden = true; newB.hidden = true; skipB.hidden = false;
      phase.textContent = "Prepare your argument. Plan where each expression fits.";
      clock.classList.remove("speaking");
      runTimer(60, function(t){ clock.textContent = fmt(t); }, startSpeak);
    }
    function startSpeak(){
      skipB.hidden = true; startB.hidden = true; newB.hidden = true; stopB.hidden = false;
      phase.textContent = "Speak now, out loud.";
      clock.classList.add("speaking");
      runTimer(90, function(t){ clock.textContent = fmt(t); }, finish);
    }
    function finish(){
      clearTimer();
      clock.classList.remove("speaking");
      skipB.hidden = true; stopB.hidden = true; startB.hidden = true; newB.hidden = true;
      phase.textContent = "Time. Which of these did you actually use?";
      var checks = el("div", "pr-checks");
      var items = targets.concat([opener]);
      items.forEach(function(t, i){
        var lab = el("label", "pr-check");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = "usedChk" + i;
        lab.appendChild(cb);
        lab.appendChild(el("span", null, t));
        checks.appendChild(lab);
      });
      card.appendChild(checks);
      var ctr2 = el("div", "row-actions");
      ctr2.appendChild(btn("cbtn known", "Finish", function(e){ speakDone(e.currentTarget); setTimeout(renderHome, 600); }));
      ctr2.appendChild(btn("cbtn", "Another topic", function(e){ speakDone(e.currentTarget); topicDrill(); }));
      card.appendChild(ctr2);
    }
  }

  // ---------- complete the argument: case discussions from session 8 ----------
  var CASES = [
    { title: "The future of education", text: "A university is considering replacing traditional examinations with project-based assessment.",
      facts: ["Some lecturers support the change; others oppose it.", "One group argues that projects measure practical ability. The other argues that examinations are fairer.", "The university can afford only one assessment system."],
      task: "Recommend a system, acknowledge the strongest objection, and explain why your proposal is preferable to the alternatives." },
    { title: "The workplace dilemma", text: "A company offers employees a choice between higher salaries, shorter working hours, and greater flexibility. It cannot improve all three.",
      facts: [],
      task: "Decide which benefit should receive priority. Explain how different employees might choose differently and propose a compromise." },
    { title: "AI and human judgement", text: "Some professionals believe AI should make routine decisions; others argue that humans should remain responsible for every important decision.",
      facts: [],
      task: "Draw a distinction between low-risk and high-risk decisions. Decide where AI should be used, where human oversight is necessary, and why." }
  ];
  // The interruption rule: while one student speaks, the other interrupts twice with a challenge.
  var CHALLENGES = ["Would that apply to everyone?", "What about the other possibility?", "Is that true of all the people involved?", "Could you distinguish between the two situations?", "What evidence would support that conclusion?"];
  var CASE_TOOLS = ["Some…; others…", "One group… The other…", "Not only does…, but it also…", "Those who… may disagree with those who…", "The more…, the more…"];
  var lastCase = -1;
  function caseDrill(){
    clearPractice();
    addTopBar("Solve a case", null);
    var ci = rand(CASES.length);
    if (ci === lastCase) ci = (ci + 1) % CASES.length;
    lastCase = ci;
    var c = CASES[ci];
    var card = el("div", "pr-card");
    card.appendChild(el("div", "pr-tag", "Case " + (ci + 1) + ": " + c.title));
    card.appendChild(el("div", "pr-topic", c.text));
    if (c.facts.length){
      var fl = el("ul", "g-notes case-facts");
      c.facts.forEach(function(f){ fl.appendChild(el("li", null, f)); });
      card.appendChild(fl);
    }
    card.appendChild(el("div", "pr-tag", "Your task"));
    card.appendChild(el("div", "case-task", c.task));
    card.appendChild(el("div", "pr-tag", "Structures to use"));
    var tools = el("div", "pr-targets");
    CASE_TOOLS.forEach(function(t){ tools.appendChild(el("div", "pr-target", t)); });
    card.appendChild(tools);
    var intLab = el("label", "pr-check");
    intLab.style.marginTop = "14px";
    var intCb = document.createElement("input");
    intCb.type = "checkbox"; intCb.checked = true; intCb.id = "caseInterrupt";
    intLab.appendChild(intCb);
    intLab.appendChild(el("span", null, "Interrupt me twice with a challenge (the interruption rule)"));
    card.appendChild(intLab);
    var phase = el("div", "pr-phase", "You get 60 seconds to prepare, then speak for about 2 minutes.");
    var clock = el("div", "pr-clock", "01:00");
    var challenge = el("div", "pr-challenge");
    challenge.hidden = true;
    challenge.setAttribute("role", "status");
    card.appendChild(phase);
    card.appendChild(challenge);
    card.appendChild(clock);
    var ctr = el("div", "row-actions");
    var startB = btn("cbtn known", "Start the timer", startPrep);
    var skipB = btn("cbtn", "Skip preparation", startSpeak);
    var stopB = btn("cbtn", "Finish early", finish);
    var newB = btn("cbtn ghost", "Different case", caseDrill);
    skipB.hidden = true; stopB.hidden = true;
    ctr.appendChild(startB); ctr.appendChild(skipB); ctr.appendChild(stopB); ctr.appendChild(newB);
    card.appendChild(ctr);
    practiceEl.appendChild(card);
    var asked = sample(CHALLENGES, 2), answered = 0;

    function startPrep(){
      startB.hidden = true; newB.hidden = true; skipB.hidden = false;
      phase.textContent = "Prepare: choose your recommendation and the strongest objection to it.";
      clock.classList.remove("speaking");
      runTimer(60, function(t){ clock.textContent = fmt(t); }, startSpeak);
    }
    function interrupt(n){
      if (!intCb.checked) return;
      answered = n + 1;
      challenge.textContent = asked[n];
      challenge.hidden = false;
      challenge.classList.remove("pop"); void challenge.offsetWidth; challenge.classList.add("pop");
      sfx("tap"); buzz([20, 60, 20]);
      try { speak(asked[n], null); } catch (e) {}
    }
    function startSpeak(){
      skipB.hidden = true; startB.hidden = true; newB.hidden = true; stopB.hidden = false;
      intCb.disabled = true;
      phase.textContent = "Speak now, out loud. Answer each challenge, then continue your argument.";
      clock.classList.add("speaking");
      runTimer(120, function(t){
        clock.textContent = fmt(t);
        if (t === 85 && answered === 0) interrupt(0);
        if (t === 40 && answered === 1) interrupt(1);
      }, finish);
    }
    function finish(){
      clearTimer();
      clock.classList.remove("speaking");
      skipB.hidden = true; stopB.hidden = true; startB.hidden = true; newB.hidden = true;
      challenge.hidden = true;
      phase.textContent = "Time. Check what you did:";
      var checks = el("div", "pr-checks");
      ["I answered the task", "I acknowledged an objection or another point of view", "I used another, other, others or the other correctly", "I used one of the structures above"]
        .concat(intCb.checked ? ["I answered both challenges and kept going"] : [])
        .forEach(function(t, i){
          var lab = el("label", "pr-check");
          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.id = "caseChk" + i;
          lab.appendChild(cb);
          lab.appendChild(el("span", null, t));
          checks.appendChild(lab);
        });
      card.appendChild(checks);
      var ctr2 = el("div", "row-actions");
      ctr2.appendChild(btn("cbtn known", "Finish", function(e){ speakDone(e.currentTarget); setTimeout(renderHome, 600); }));
      ctr2.appendChild(btn("cbtn", "Another case", function(e){ speakDone(e.currentTarget); caseDrill(); }));
      card.appendChild(ctr2);
    }
  }

  function quickFire(){
    clearPractice();
    addTopBar("Quick-fire starters", null);
    var items = sample(DRILL_STARTERS, 5), idx = 0;
    var card = el("div", "pr-card center");
    var tag = el("div", "pr-tag", "");
    var starter = el("div", "pr-topic", "");
    var phase = el("div", "pr-phase", "");
    var clock = el("div", "pr-clock", "");
    var ctr = el("div", "row-actions");
    var skipB = btn("cbtn", "Next starter", function(){ idx++; next(); });
    ctr.appendChild(skipB);
    card.appendChild(tag); card.appendChild(starter); card.appendChild(phase); card.appendChild(clock); card.appendChild(ctr);
    practiceEl.appendChild(card);
    next();

    function next(){
      clearTimer();
      if (idx >= items.length){
        tag.textContent = "Finished";
        starter.textContent = "Five starters done.";
        phase.textContent = "";
        clock.textContent = "";
        clock.classList.remove("speaking");
        ctr.removeChild(skipB);
        speakDone(null);
        ctr.appendChild(btn("cbtn known", "Go again", quickFire));
        ctr.appendChild(btn("cbtn ghost", "Done", renderHome));
        return;
      }
      tag.textContent = "Starter " + (idx + 1) + " of " + items.length;
      starter.textContent = items[idx];
      phase.textContent = "Get ready";
      clock.classList.remove("speaking");
      runTimer(5, function(t){ clock.textContent = fmt(t); }, function(){
        phase.textContent = "Finish the sentence out loud and keep talking";
        clock.classList.add("speaking");
        runTimer(25, function(t){ clock.textContent = fmt(t); }, function(){ idx++; next(); });
      });
    }
  }

  function onPracticeTab(){
    if (practiceEl.getAttribute("data-view") !== "other") renderHome();
  }

  renderHero();
  renderGrammar();
  // Reopen exactly where the learner was: an unfinished exercise, then the tab and scroll position.
  var resumed = restoreSession();
  if (!resumed) renderHome();
  var startView = resumed === "results" ? "practice" : (VIEWS.indexOf(ui.view) !== -1 ? ui.view : "home");
  openView(startView, true);
  uiReady = true;
  saveUI();
  var moving = checkMoveLink();
  window.addEventListener("hashchange", checkMoveLink); // a link opened while the app is already open in this tab
  try {
    if (sessionStorage.getItem("slMoved")){
      sessionStorage.removeItem("slMoved");
      toast("check", "Progress moved to this device", profile.name ? "Welcome back, " + profile.name : "Everything is where you left it", 4000);
    }
  } catch (e) {}
  if (!profile.since && !moving){
    if (game.xp > 0 || lessonsDone() > 0 || knownCount() > 0 || customWords.length){ profile.since = dayStr(0); saveProfile(); }
    else if (storageOk) openWelcome();
  }
  try {
    var fl = sessionStorage.getItem("slFlash");
    if (fl){
      sessionStorage.removeItem("slFlash");
      var cut = fl.indexOf(":");
      toast("check", fl.slice(0, cut) === "added" ? "Saved to My words" : "Removed from My words", fl.slice(cut + 1), 3000);
      openView("vocab");
      var myBand = document.getElementById("vcat-" + CUSTOM_CI);
      if (myBand) myBand.scrollIntoView({ block: "start" });
    }
  } catch (e) {}
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
