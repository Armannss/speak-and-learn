<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E9594">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speak & Learn">
<title>Speak & Learn</title>
<meta name="description" content="Interactive English vocabulary and collocations glossary with click-to-hear pronunciation and Persian meanings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F4; --surface:#FFFFFF; --surface-alt:#ECF1EF;
    --ink:#16233A; --ink-soft:#4B5768;
    --accent:#0E9594; --accent-ink:#FFFFFF;
    --accent-2:#C98A2E; --border:#DCE3E0;
    --shadow: 0 1px 2px rgba(22,35,58,.06), 0 6px 20px rgba(22,35,58,.06);
    --good:#1E8E5A; --bad:#C0443A;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1720; --surface:#17212C; --surface-alt:#1C2833;
      --ink:#EDF2F4; --ink-soft:#A9B6C2;
      --accent:#33D6CF; --accent-ink:#06231F;
      --accent-2:#E7B75B; --border:#2A3644;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --good:#4CCB8D; --bad:#F0786C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1720; --surface:#17212C; --surface-alt:#1C2833;
    --ink:#EDF2F4; --ink-soft:#A9B6C2;
    --accent:#33D6CF; --accent-ink:#06231F;
    --accent-2:#E7B75B; --border:#2A3644;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --good:#4CCB8D; --bad:#F0786C;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Inter",-apple-system,sans-serif;
    padding-inline:16px;
  }
  .wrap{ max-width:900px; margin:0 auto; }
  .fa{ font-family:"Vazirmatn","Inter",sans-serif; direction:rtl; unicode-bidi:isolate; }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px);
    background:var(--bg);
    padding-block:14px 10px;
    z-index:20;
    border-bottom:1px solid var(--border);
  }
  .title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1{
    font-family:"Fraunces",serif; font-weight:600; font-size:clamp(22px,4.5vw,30px);
    margin:0; letter-spacing:-0.01em;
  }
  .sub{ color:var(--ink-soft); font-size:13.5px; margin:4px 0 0 0; }
  .controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .search{
    flex:1 1 220px; min-width:0;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:9px 12px; font-size:14px; color:var(--ink);
    font-family:inherit;
  }
  .search:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .seg{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .seg button{
    border:none; background:transparent; color:var(--ink-soft); font:inherit; font-weight:600;
    font-size:13px; padding:9px 14px; cursor:pointer;
  }
  .seg button.active{ background:var(--accent); color:var(--accent-ink); }
  .accent-toggle{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .accent-toggle:hover{ border-color:var(--accent); color:var(--accent); }

  /* ---------- Category chip nav ---------- */
  .chipnav{
    display:flex; gap:6px; overflow-x:auto; padding:10px 0 2px 0; margin-bottom:2px;
    scrollbar-width:thin;
  }
  .chipnav::-webkit-scrollbar{ height:5px; }
  .chip{
    flex:none; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .chip:hover{ border-color:var(--accent); color:var(--accent); }

  main{ padding-bottom:60px; }

  /* ---------- Section band ---------- */
  .band{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    background:var(--ink); color:var(--bg);
    border-radius:10px; padding:10px 14px; margin:26px 0 12px 0;
    scroll-margin-top:150px;
  }
  :root[data-theme="dark"] .band, @media (prefers-color-scheme:dark){ }
  .band .en{ font-family:"Fraunces",serif; font-weight:600; font-size:16px; }
  .band .fa{ color:var(--accent-2); font-size:13.5px; }

  /* ---------- Vocab cards ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:6px;
  }
  .card.hide{ display:none; }
  .term-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .term{ font-weight:700; font-size:15px; color:var(--ink); }
  .meaning{ color:var(--ink-soft); font-size:14px; }
  .example{ font-style:italic; color:var(--ink-soft); font-size:13px; line-height:1.45; display:flex; gap:6px; align-items:flex-start; }
  .example .ex-text{ flex:1; }

  .spk{
    flex:none; width:30px; height:30px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface-alt); color:var(--accent); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease;
  }
  .spk:hover{ border-color:var(--accent); }
  .spk:active{ transform:scale(0.92); }
  .spk.small{ width:22px; height:22px; }
  .spk.playing{ background:var(--accent); color:var(--accent-ink); }
  .spk svg{ width:14px; height:14px; }
  .spk.small svg{ width:11px; height:11px; }

  /* ---------- Phrase list (Part 2) ---------- */
  .phrase-box{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .phrase-box.hide{ display:none; }
  .phrase-row{
    display:flex; align-items:flex-start; gap:8px; padding:7px 0;
    border-bottom:1px solid var(--border);
  }
  .phrase-row:last-child{ border-bottom:none; }
  .phrase-row .txt{ flex:1; font-size:13.6px; color:var(--ink); line-height:1.45; }

  .tabpanel{ display:none; }
  .tabpanel.active{ display:block; }

  .empty{ color:var(--ink-soft); font-size:14px; padding:30px 4px; text-align:center; }

  /* ---------- Flashcards ---------- */
  #chipnav.mode-cards .chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .phrase-fa{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .cards-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:16px 0 4px; flex-wrap:wrap; font-size:13px; color:var(--ink-soft);
  }
  .toggles{ display:flex; gap:16px; flex-wrap:wrap; }
  .unlearned-toggle{ display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .unlearned-toggle input{ accent-color:var(--accent); width:15px; height:15px; }
  .cards-stats{ font-variant-numeric:tabular-nums; }

  .stage{ perspective:1400px; display:flex; justify-content:center; padding:14px 0 8px; }
  .flashcard{
    width:100%; max-width:420px; min-height:250px; position:relative;
    cursor:pointer; outline:none;
  }
  .flashcard .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:18px; border:1px solid var(--border); background:var(--surface);
    box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; padding:26px 22px; text-align:center;
    transition:transform .5s cubic-bezier(.4,.2,.2,1); transform:rotateY(0deg);
  }
  .flashcard .back{ transform:rotateY(180deg); }
  .flashcard.flipped .front{ transform:rotateY(-180deg); }
  .flashcard.flipped .back{ transform:rotateY(0deg); }
  .flashcard.is-known .face{ border-color:var(--accent); }
  .fc-cat{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
  .fc-term{ font-family:"Fraunces",serif; font-weight:600; font-size:clamp(20px,5vw,28px); }
  .fc-hint{ font-size:12px; color:var(--ink-soft); opacity:.75; position:absolute; bottom:14px; }
  .fc-meaning{ font-size:19px; font-weight:600; }
  .fc-example{
    font-style:italic; color:var(--ink-soft); font-size:13.5px; line-height:1.5;
    display:flex; align-items:flex-start; gap:8px;
  }
  .spk.big{ position:absolute; top:14px; right:14px; width:36px; height:36px; }
  .spk.big svg{ width:16px; height:16px; }

  .cards-progress{
    text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:10px;
    font-variant-numeric:tabular-nums;
  }
  .cards-controls{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .cbtn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font:inherit; font-weight:600; font-size:13px; padding:9px 16px; border-radius:999px; cursor:pointer;
  }
  .cbtn.ghost{ padding:9px 14px; color:var(--ink-soft); }
  .cbtn.ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .cbtn.learning{ border-color:var(--accent-2); color:var(--accent-2); }
  .cbtn.learning:hover{ background:var(--accent-2); color:var(--accent-ink); }
  .cbtn.known{ border-color:var(--accent); color:var(--accent); }
  .cbtn.known:hover{ background:var(--accent); color:var(--accent-ink); }
  .cards-footer-row{ display:flex; justify-content:center; gap:18px; margin-top:12px; }
  .linklike{ border:none; background:none; color:var(--ink-soft); font:inherit; font-size:12.5px; text-decoration:underline; cursor:pointer; padding:4px; }
  .linklike:hover{ color:var(--accent); }


  /* ---------- Practice ---------- */
  .pr-hero{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; margin-top:16px; box-shadow:var(--shadow);
  }
  .pr-streak{ font-family:"Fraunces",serif; font-weight:600; font-size:22px; }
  .pr-goal-text{ color:var(--ink-soft); font-size:13px; margin:4px 0 10px; font-variant-numeric:tabular-nums; }
  .pbar{ height:8px; background:var(--surface-alt); border-radius:999px; overflow:hidden; border:1px solid var(--border); }
  .pbar-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; }
  .pr-due{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    margin-top:10px; padding:10px 14px; font-size:13px; color:var(--ink-soft);
    background:var(--surface-alt); border-radius:12px;
  }
  .pr-modes{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin-top:14px; }
  .pr-mode{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px; display:flex; flex-direction:column; gap:8px; align-items:flex-start;
  }
  .pr-mode.primary{ border-color:var(--accent); box-shadow:var(--shadow); }
  .pr-mode-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; width:100%; flex-wrap:wrap; }
  .pr-mode-title{ font-weight:700; font-size:15px; }
  .pr-mode-time{ font-size:12px; color:var(--ink-soft); }
  .pr-mode-desc{ font-size:13px; color:var(--ink-soft); line-height:1.45; flex:1; }
  .pr-tip{ margin-top:16px; font-size:12.5px; color:var(--ink-soft); text-align:center; }

  .pr-top{ display:flex; align-items:center; gap:12px; margin:14px 0 10px; }
  .pr-top-title{ font-weight:700; font-size:14px; flex:1; }
  .pr-top-right{ font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .pr-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px; margin-top:12px; box-shadow:var(--shadow);
  }
  .pr-card.center{ text-align:center; }
  .pr-tag{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin:12px 0 6px; }
  .pr-tag:first-child{ margin-top:0; }
  .pr-prompt{ font-size:18px; line-height:1.5; font-weight:600; margin-bottom:14px; }
  .pr-prompt.small{ font-size:14px; font-weight:500; color:var(--ink-soft); }
  .pr-opts{ display:grid; gap:8px; }
  .pr-opt{
    text-align:left; font:inherit; font-size:14.5px; padding:12px 14px; border-radius:10px; cursor:pointer;
    background:var(--surface); color:var(--ink); border:1px solid var(--border);
  }
  .pr-opt:hover:not(:disabled){ border-color:var(--accent); }
  .pr-opt:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .pr-opt.right{ border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--surface)); }
  .pr-opt.wrong{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface)); }
  .pr-opt:disabled{ cursor:default; }
  .pr-feedback{
    margin-top:12px; padding:14px; border-radius:12px; background:var(--surface-alt);
    border:1px solid var(--border);
  }
  .pr-fb-head{ font-weight:700; font-size:14.5px; }
  .pr-fb-head.good{ color:var(--good); }
  .pr-fb-head.bad{ color:var(--bad); }
  .pr-fb-note{ font-size:13px; color:var(--ink-soft); margin-top:6px; line-height:1.45; }
  .pr-fb-sentence{ display:flex; align-items:flex-start; gap:8px; margin-top:8px; font-style:italic; font-size:13.5px; }
  .pr-fb-sentence span{ flex:1; }
  .pr-play{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .spk.big-inline{ width:44px; height:44px; }
  .spk.big-inline svg{ width:20px; height:20px; }
  .pr-input{
    width:100%; font:inherit; font-size:15px; padding:12px 14px; border-radius:10px;
    background:var(--surface); color:var(--ink); border:1px solid var(--border);
  }
  .pr-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .pr-diff{ margin-top:8px; font-size:15px; line-height:1.7; }
  .w-ok{ color:var(--good); }
  .w-miss{ color:var(--bad); text-decoration:underline; }
  .pr-score{ font-family:"Fraunces",serif; font-weight:600; font-size:44px; }
  .pr-topic{ font-size:17px; line-height:1.5; font-weight:600; }
  .pr-targets{ display:grid; gap:6px; }
  .pr-target{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px; padding:6px 0; border-bottom:1px solid var(--border); }
  .pr-target:last-child{ border-bottom:none; }
  .pr-phase{ margin-top:14px; font-size:13.5px; color:var(--ink-soft); text-align:center; }
  .pr-clock{ font-family:"Fraunces",serif; font-weight:600; font-size:48px; text-align:center; font-variant-numeric:tabular-nums; }
  .pr-clock.speaking{ color:var(--accent); }
  .pr-checks{ display:grid; gap:8px; margin-top:12px; }
  .pr-check{ display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; }
  .pr-check input{ accent-color:var(--accent); width:16px; height:16px; }

  footer{
    text-align:center; color:var(--ink-soft); font-size:12px; padding:18px 0 30px 0;
  }
  a.credit{ color:var(--accent); text-decoration:none; }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="title-row">
      <div>
        <h1>Speak &amp; Learn</h1>
        <p class="sub">Vocabulary &amp; collocations from your 12 sessions — click <span style="color:var(--accent)">▶</span> to hear it spoken</p>
      </div>
    </div>
    <div class="controls">
      <input class="search" id="search" type="text" placeholder="Search a word, meaning, or phrase… / جستجو…" />
      <div class="seg" id="tabSeg">
        <button data-tab="vocab" class="active">Vocabulary</button>
        <button data-tab="phrases">Conversation Toolkit</button>
        <button data-tab="cards">Flashcards</button>
        <button data-tab="practice">Practice</button>
      </div>
      <button class="accent-toggle" id="accentToggle" title="Toggle pronunciation accent">🔊 US English</button>
    </div>
    <div class="chipnav" id="chipnav"></div>
  </header>

  <main>
    <div class="tabpanel active" id="panel-vocab"></div>
    <div class="tabpanel" id="panel-phrases"></div>
    <div class="tabpanel" id="panel-cards">
      <div class="cards-toolbar">
        <div class="toggles">
          <label class="unlearned-toggle">
            <input type="checkbox" id="dueOnly" />
            <span>Due today</span>
          </label>
          <label class="unlearned-toggle">
            <input type="checkbox" id="unlearnedOnly" />
            <span>Unlearned only</span>
          </label>
        </div>
        <span class="cards-stats" id="cardsStats"></span>
      </div>

      <div class="stage" id="cardStage">
        <div class="flashcard" id="flashcard">
          <div class="face front">
            <button class="spk big" id="cardSpkFront" type="button" aria-label="Play pronunciation"></button>
            <div class="fc-cat" id="fcCatFront"></div>
            <div class="fc-term" id="fcTerm"></div>
            <div class="fc-hint">Tap to flip / لمس کن</div>
          </div>
          <div class="face back">
            <div class="fc-meaning fa" id="fcMeaning"></div>
            <div class="fc-example" id="fcExampleRow">
              <span id="fcExampleText"></span>
              <button class="spk small" id="cardSpkBack" type="button" aria-label="Play example"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="cards-progress" id="cardsProgress"></div>

      <div class="cards-controls">
        <button class="cbtn ghost" id="prevCard" aria-label="Previous card">◀ Prev</button>
        <button class="cbtn learning" id="markLearning">Still learning</button>
        <button class="cbtn known" id="markKnown">Got it ✓</button>
        <button class="cbtn ghost" id="nextCard" aria-label="Next card">Next ▶</button>
      </div>
      <div class="cards-footer-row">
        <button class="linklike" id="shuffleDeck">🔀 Shuffle deck</button>
        <button class="linklike" id="resetProgress">Reset progress</button>
      </div>

      <div class="empty" id="cardsEmpty" style="display:none;"></div>
    </div>
    <div class="tabpanel" id="panel-practice"></div>
    <div class="empty" id="emptyMsg" style="display:none;">No matches found. / موردی پیدا نشد.</div>
  </main>

  <footer>
    Tap the speaker icon on any word, sentence or phrase to hear it. Uses your browser's built-in voice — works offline, no audio files.
  </footer>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  // DATA
  // ============================================================
  var VOCAB = [
    ["1. Persuasion & Argumentation", "متقاعدسازی و استدلال", [
      ["persuasive", "متقاعدکننده، قانع‌کننده", "Her speech was so persuasive that even the skeptics changed their minds."],
      ["compelling", "بسیار قانع‌کننده، تأثیرگذار", "He gave a compelling argument for reducing working hours."],
      ["flawed", "دارای ایراد یا نقص منطقی", "The plan looked good on paper, but the logic behind it was flawed."],
      ["valid", "معتبر، منطقاً درست", "That's a valid point — we hadn't considered the cost at all."],
      ["credible", "قابل‌اعتماد، باورپذیر", "You need a credible source before you can substantiate that claim."],
      ["substantiated", "مستند، اثبات‌شده با دلیل", "The claim wasn't substantiated by any real evidence."],
      ["plausible", "قابل‌قبول، محتمل", "It's a plausible explanation, but probably not the only one."],
      ["counterargument", "استدلال مخالف، پاد-استدلال", "Before giving your counterargument, acknowledge the original point first."],
      ["premise", "مقدمه یا فرض پایه‌ی یک استدلال", "The whole argument rests on a premise that may not even be true."]
    ]],
    ["2. Society & Social Structures", "جامعه و ساختارهای اجتماعی", [
      ["social cohesion", "انسجام اجتماعی", "Diverse neighborhoods can either strengthen or weaken social cohesion."],
      ["social inequality", "نابرابری اجتماعی", "Social inequality has widened significantly over the past decade."],
      ["social mobility", "تحرک اجتماعی (جابه‌جایی طبقاتی)", "Free education is often seen as a key driver of social mobility."],
      ["social welfare", "رفاه اجتماعی", "The government increased spending on social welfare programs."],

  function dayStr(offsetDays){
    var d = new Date();
    d.setDate(d.getDate() + (offsetDays || 0));
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  function isDue(item){

  function buildCardsDeck(){
    var q = searchInput.value.trim().toLowerCase();
    var idxs = [];
    FLAT.forEach(function(item, i){
      if (cardsCatFilter !== "all" && item.ci !== cardsCatFilter) return;
      if (cardsUnlearnedOnly && knownSet[cardKey(item)]) return;
      if (cardsDueOnly && !isDue(item)) return;
      if (q && item.term.toLowerCase().indexOf(q) === -1 &&
          item.meaning.indexOf(q) === -1 &&
          item.example.toLowerCase().indexOf(q) === -1) return;
      idxs.push(i);
    });
    return idxs;
  }

  function shuffleArray(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function refreshCardsStats(){

  try {

  function noteActivity(n){
    var t = dayStr(0);

      progress.streak = (progress.lastDay === dayStr(-1)) ? progress.streak + 1 : 1;

    { q: "If I explain the difference between two ideas that people often confuse, I ______.", a: "draw a distinction between them", o: ["win them over", "raise an objection", "appeal to emotions"], n: "Draw a distinction between X and Y = clearly explain how X and Y differ." },
    { q: "Advertisers often ______ rather than logic, hoping to influence what people buy.", a: "appeal to emotions", o: ["draw a distinction", "address a concern", "justify a decision"], n: "Appeal to emotions vs. appeal to reason: feelings versus logic." },
    { q: "The article quoted only the data that supported its view, which is a clear example of ______.", a: "selective use of evidence", o: ["a balanced presentation", "a valid point", "an appeal to reason"], n: "Selective use of evidence = choosing only the facts that help your side." },
    { q: "He repeated her sentence without the surrounding explanation, so he took it ______.", a: "out of context", o: ["into consideration", "for granted", "at face value"], n: "Take something out of context = remove the surrounding information so the meaning changes." },
    { q: "I'm not ______ that the evidence supports that conclusion.", a: "convinced", o: ["convincing", "convince", "convinces"], n: "\"I'm not convinced that…\" is a polite, academic alternative to \"That's wrong.\"" },
    { q: "I accept the premise of your argument, but I'm not sure the conclusion necessarily ______.", a: "follows", o: ["follow up", "followed", "following"], n: "A conclusion \"follows\" when it logically comes from the premise." },
    { q: "I don't think that argument holds ______ when we consider the long-term costs.", a: "up", o: ["out", "over", "off"], n: "An argument that \"holds up\" stays valid when it is tested." },
    { q: "The politician accused the media of ______ framing designed to mislead voters.", a: "deliberate", o: ["deliberately", "deliberation", "deliberated"], n: "An adjective is needed before the noun \"framing\": deliberate framing." }
  ];

  var CLOZE_POOL = FLAT.filter(function(item){
    return item.example.toLowerCase().indexOf(item.term.toLowerCase()) !== -1;
  });
  var COLLOC_POOL = FLAT.filter(function(item){
    return wordCount(item.term) >= 2 && !hasPlaceholder(item.term);
  });
  var TARGET_EXPR = [];
  FLAT.forEach(function(item){ if (item.ci >= 10 && wordCount(item.term) >= 2) TARGET_EXPR.push(item.term); });
  var OPENERS = [
    "I'd argue that…", "The way I see it…", "To some extent, I agree that…",
    "It could be argued that…", "On balance, I'd say…", "I'd question the assumption that…"
  ];
  var DEBATE_TOPICS = [
    "Universities should teach students how to use AI rather than prohibit it.",
    "Working from home should become the default option whenever a job can be done remotely.",
    "Social media companies should be legally responsible for harmful content published on their platforms.",
    "People should work fewer hours, even if this means earning less money.",
    "Governments should spend more money on public transport than on building new roads."
  ];
  var DRILL_STARTERS = [
    "One assumption about modern society that I would challenge is…",
    "I would make a compelling case for…",
    "One argument that I find difficult to counter is…",
    "I strongly believe that…, although…",
    "One distinction that people often fail to make is the distinction between…",
    "If society suddenly stopped using social media, I think…",
    "If I had to make a difficult decision tomorrow, I would…",
    "One decision I have made that I would still defend is…",
    "People often appeal to emotions when…",
    "One issue where I have a vested interest is…"
  ];

  function genCurated(used){
    for (var t = 0; t < 30; t++){
      var idx = rand(CURATED.length), c = CURATED[idx], id = "cur" + idx;
      if (used[id]) continue;
      used[id] = true;
      var opts = c.o.concat([c.a]);
      shuffleArray(opts);
      return { id: id, kind: "mcq", tag: "Complete the sentence", prompt: c.q, options: opts, answer: c.a, explain: c.n, speakText: c.q.replace("______", c.a), review: c.q.replace("______", "[" + c.a + "]") };
    }
    return null;
  }
  function genCloze(used){
    for (var t = 0; t < 40; t++){
      var item = pick(CLOZE_POOL), id = "cl" + item.key;
      if (used[id]) continue;
      used[id] = true;
      var re = new RegExp(escRe(item.term), "i");
      var shown = item.example.replace(re, "_____");
      var wc = wordCount(item.term);
      var others = FLAT.filter(function(o){
        return o.ci !== item.ci && o.term.toLowerCase() !== item.term.toLowerCase() && wordCount(o.term) === wc && !hasPlaceholder(o.term);
      });
      var seen = {}, dist = [];
      shuffleArray(others);
      others.forEach(function(o){ if (dist.length < 3 && !seen[o.term]) { seen[o.term] = true; dist.push(o.term); } });
      var opts = dist.concat([item.term]);
      shuffleArray(opts);
      return { id: id, kind: "mcq", tag: "Fill the blank", prompt: shown, options: opts, answer: item.term, explain: "", speakText: item.example, review: item.example.replace(re, "[" + item.term + "]") };
    }
    return null;
  }
  function genColloc(used){
    for (var t = 0; t < 40; t++){
      var item = pick(COLLOC_POOL), id = "co" + item.key;
      if (used[id]) continue;
      used[id] = true;
      var words = item.term.split(/\s+/);
      var last = words[words.length - 1];
      var lasts = {}, dist = [];
      var others = COLLOC_POOL.filter(function(o){ return o.ci !== item.ci; });
      shuffleArray(others);
      others.forEach(function(o){
        var w = o.term.split(/\s+/);
        var l = w[w.length - 1];
        if (dist.length < 3 && l.toLowerCase() !== last.toLowerCase() && !lasts[l]) { lasts[l] = true; dist.push(l); }
      });
      var opts = dist.concat([last]);
      shuffleArray(opts);
      var shown = words.slice(0, -1).join(" ") + " _____";
      return { id: id, kind: "mcq", tag: "Complete the collocation", prompt: shown, options: opts, answer: last, explain: "Example: " + item.example, speakText: item.term, review: item.term };
    }
    return null;
  }
  function genDictation(used){
    for (var t = 0; t < 40; t++){
      var text;
      if (Math.random() < 0.5){
        var pr = pick(PHRASES), pair = pick(pr[2]);
        text = pair[0];
      } else {
        text = pick(FLAT).example;
      }
      var id = "di" + text;
      if (used[id]) continue;
      var cleaned = text.replace(/…/g, " ").replace(/\s+/g, " ").trim();
      if (wordCount(cleaned) < 3) continue;
      used[id] = true;
      return { id: id, kind: "dictation", tag: "Listen and type", prompt: "", answer: cleaned, speakText: text.replace(/…/g, ","), review: cleaned };
    }
    return null;
  }
  function genMany(gen, n, used){
    var out = [];
    for (var i = 0; i < n; i++){ var q = gen(used); if (q) out.push(q); }
    return out;
  }
  var MODES = {
    daily: { title: "Daily 10", build: function(){
      var used = {};
      var qs = genMany(genCurated, 3, used).concat(genMany(genCloze, 3, used), genMany(genColloc, 2, used), genMany(genDictation, 2, used));
      shuffleArray(qs);
      return qs;
    } },
    cloze: { title: "Fill the blank", build: function(){
      var used = {};
      var qs = genMany(genCurated, 4, used).concat(genMany(genCloze, 6, used));
      shuffleArray(qs);
      return qs;
    } },
    colloc: { title: "Collocation builder", build: function(){ return genMany(genColloc, 10, {}); } },
    dict: { title: "Listen & type", build: function(){ return genMany(genDictation, 8, {}); } }
  };

  // ---------- dictation checking ----------
  function cleanForCompare(t){
    return t.replace(/[’‘]/g, "'").replace(/…/g, " ").replace(/-/g, " ");
  }
  function tokNorm(tok){ return tok.toLowerCase().replace(/[^a-z0-9']/g, ""); }
  function alignWords(a, b){
    var n = a.length, m = b.length, dp = [], i, j;
    for (i = 0; i <= n; i++){ var row = []; for (j = 0; j <= m; j++) row.push(0); dp.push(row); }
    for (i = n - 1; i >= 0; i--){
      for (j = m - 1; j >= 0; j--){
        dp[i][j] = (a[i] === b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var matched = []; for (i = 0; i < n; i++) matched.push(false);
    i = 0; j = 0;
    while (i < n && j < m){
      if (a[i] === b[j]){ matched[i] = true; i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    return { matched: matched, lcs: dp[0][0] };
  }

  // ---------- views ----------
  var session = null;

  function renderHome(){
    clearPractice();
    practiceEl.setAttribute("data-view", "home");
    var done = todayCount();
    var hero = el("div", "pr-hero");
    hero.appendChild(el("div", "pr-streak", currentStreak() + "-day streak"));
    hero.appendChild(el("div", "pr-goal-text", Math.min(done, DAILY_GOAL) + " / " + DAILY_GOAL + " done today" + (done >= DAILY_GOAL ? " — goal reached" : "")));
    hero.appendChild(progressBar(done / DAILY_GOAL));
    practiceEl.appendChild(hero);

    var due = countDue();
    var dueRow = el("div", "pr-due");
    dueRow.appendChild(el("span", null, due + " flashcards due for review today"));
    dueRow.appendChild(btn("cbtn known", "Review flashcards", openDueCards));
    practiceEl.appendChild(dueRow);

    var list = el("div", "pr-modes");
    var defs = [
      { id: "daily", title: "Daily 10", time: "about 5 min", desc: "A mixed set: sentence completion, collocations and listen-and-type. Do this one every day.", primary: true },
      { id: "cloze", title: "Fill the blank", time: "about 3 min", desc: "Choose the expression that completes a sentence. Includes the sentences from your class slides." },
      { id: "colloc", title: "Collocation builder", time: "about 2 min", desc: "Finish the collocation. This trains the word partnerships that make you sound natural." },
      { id: "dict", title: "Listen & type", time: "about 5 min", desc: "Listen to a sentence and type it. Trains listening, spelling and chunk memory." },
      { id: "speak", title: "Speaking drill", time: "2 to 5 min", desc: "Timed speaking with must-use expressions. Say it out loud, not in your head." }
    ];
    defs.forEach(function(d){
      var card = el("div", "pr-mode" + (d.primary ? " primary" : ""));
      var head = el("div", "pr-mode-head");
      head.appendChild(el("span", "pr-mode-title", d.title));
      head.appendChild(el("span", "pr-mode-time", d.time));
      card.appendChild(head);
      card.appendChild(el("div", "pr-mode-desc", d.desc));
      card.appendChild(btn(d.primary ? "cbtn known" : "cbtn", d.id === "speak" ? "Open" : "Start", function(){
        if (d.id === "speak") renderSpeakMenu(); else startSession(d.id);
      }));
      list.appendChild(card);
    });
    practiceEl.appendChild(list);
    practiceEl.appendChild(el("div", "pr-tip", "Tip: short daily practice beats one long session. Ten minutes a day, every day."));
  }

  function startSession(mode){
    var m = MODES[mode];
    session = { mode: mode, title: m.title, qs: m.build(), i: 0, correct: 0, missed: [] };
    if (!session.qs.length){ renderHome(); return; }
    renderQuestion();
  }

  function recordAnswer(q, ok){
    if (ok) session.correct++; else session.missed.push(q);
    noteActivity(1);
  }
  function advance(){
    session.i++;
    if (session.i >= session.qs.length) renderResults(); else renderQuestion();
  }

  function renderQuestion(){
    clearPractice();
    var q = session.qs[session.i];
    addTopBar(session.title, (session.i + 1) + " / " + session.qs.length);
    practiceEl.appendChild(progressBar(session.i / session.qs.length));
    var card = el("div", "pr-card");
    card.appendChild(el("div", "pr-tag", q.tag));
    practiceEl.appendChild(card);

    var fb = el("div", "pr-feedback");
    fb.hidden = true;
    var nextB = btn("cbtn known", session.i + 1 >= session.qs.length ? "See results" : "Next", advance);
    nextB.hidden = true;

    if (q.kind === "mcq"){
      card.appendChild(el("div", "pr-prompt", q.prompt));
      var opts = el("div", "pr-opts");
      var answered = false;
      var buttons = [];
      q.options.forEach(function(o){
        var b = btn("pr-opt", o, function(){
          if (answered) return;
          answered = true;
          var ok = (o === q.answer);
          buttons.forEach(function(x){
            x.disabled = true;
            if (x.textContent === q.answer) x.classList.add("right");
          });
          if (!ok) b.classList.add("wrong");
          recordAnswer(q, ok);
          fb.appendChild(el("div", "pr-fb-head " + (ok ? "good" : "bad"), ok ? "Correct" : "Not quite. Answer: " + q.answer));
          if (q.explain) fb.appendChild(el("div", "pr-fb-note", q.explain));
          var full = el("div", "pr-fb-sentence");
          full.appendChild(el("span", null, q.review.replace(/[\[\]]/g, "")));
          full.appendChild(makeSpkBtn(q.speakText, true));
          fb.appendChild(full);
          fb.hidden = false;
          nextB.hidden = false;
          nextB.focus();
        });
        buttons.push(b);
        opts.appendChild(b);
      });
      card.appendChild(opts);
    } else {
      var playRow = el("div", "pr-play");
      var playBtn = makeSpkBtn(q.speakText, false);
      playBtn.classList.add("big-inline");
      playBtn.addEventListener("click", function(){ speak(q.speakText, playBtn, 0.92); });
      var slowBtn = btn("cbtn ghost", "Play slowly", function(){ speak(q.speakText, null, 0.6); });
      playRow.appendChild(playBtn);
      playRow.appendChild(slowBtn);
      card.appendChild(el("div", "pr-prompt small", "Listen, then type exactly what you hear."));
      card.appendChild(playRow);
      var input = el("input", "pr-input");
      input.type = "text";
      input.id = "dictInput" + session.i;
      input.setAttribute("autocomplete", "off");
      input.setAttribute("autocapitalize", "off");
      input.setAttribute("spellcheck", "false");
      input.placeholder = "Type the sentence here";
      card.appendChild(input);
      var checked = false;
      var checkB = btn("cbtn known", "Check", function(){
        if (checked) { advance(); return; }
        checked = true;
        input.disabled = true;
        var tokens = cleanForCompare(q.answer).split(/\s+/).filter(function(t){ return tokNorm(t) !== ""; });
        var a = tokens.map(tokNorm);
        var b = cleanForCompare(input.value).split(/\s+/).map(tokNorm).filter(Boolean);
        var res = alignWords(a, b);
        var acc = res.lcs / Math.max(a.length, b.length, 1);
        var ok = acc >= 0.9;
        recordAnswer(q, ok);
        fb.appendChild(el("div", "pr-fb-head " + (ok ? "good" : "bad"), ok ? "Correct (" + Math.round(acc * 100) + "%)" : "Accuracy " + Math.round(acc * 100) + "%. Compare below."));
        var line = el("div", "pr-diff");
        tokens.forEach(function(tok, idx){
          line.appendChild(el("span", res.matched[idx] ? "w-ok" : "w-miss", tok));
          line.appendChild(document.createTextNode(" "));
        });
        fb.appendChild(line);
        fb.appendChild(el("div", "pr-fb-note", "You typed: " + (input.value.trim() || "(nothing)")));
        fb.hidden = false;
        checkB.textContent = session.i + 1 >= session.qs.length ? "See results" : "Next";
      });
      input.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); checkB.click(); } });
      var ctr = el("div", "cards-controls");
      ctr.appendChild(checkB);
      card.appendChild(ctr);
      setTimeout(function(){ try { speak(q.speakText, playBtn, 0.92); input.focus(); } catch (e) {} }, 300);
    }
    practiceEl.appendChild(fb);
    if (q.kind === "mcq"){
      var c2 = el("div", "cards-controls");
      c2.appendChild(nextB);
      practiceEl.appendChild(c2);
    }
  }

  function renderResults(){
    clearPractice();
    addTopBar(session.title, "Results");
    var n = session.qs.length, score = session.correct;
    var card = el("div", "pr-card center");
    card.appendChild(el("div", "pr-score", score + " / " + n));
    var msg = score === n ? "Perfect. Come back tomorrow to keep the streak alive."
            : score >= n * 0.7 ? "Good work. Review the ones you missed below."
            : "Keep going. Repetition is how these expressions stick.";
    card.appendChild(el("div", "pr-fb-note", msg));
    var done = todayCount();
    card.appendChild(el("div", "pr-goal-text", Math.min(done, DAILY_GOAL) + " / " + DAILY_GOAL + " done today · " + currentStreak() + "-day streak"));
    practiceEl.appendChild(card);

    if (session.missed.length){
      var box = el("div", "pr-card");
      box.appendChild(el("div", "pr-tag", "Review these"));
      session.missed.forEach(function(q){
        var row = el("div", "phrase-row");
        row.appendChild(el("div", "txt", q.review.replace(/[\[\]]/g, "")));
        row.appendChild(makeSpkBtn(q.speakText, true));
        box.appendChild(row);
      });
      practiceEl.appendChild(box);
    }
    var ctr = el("div", "cards-controls");
    ctr.appendChild(btn("cbtn known", "Another round", function(){ startSession(session.mode); }));
    if (session.mode === "daily") ctr.appendChild(btn("cbtn", "Bonus: speaking drill", renderSpeakMenu));
    ctr.appendChild(btn("cbtn ghost", "Back", renderHome));
    practiceEl.appendChild(ctr);
  }

  // ---------- speaking ----------
  function renderSpeakMenu(){
    clearPractice();
    addTopBar("Speaking drill", null);
    var wrap = el("div", "pr-modes");
    var a = el("div", "pr-mode primary");
    var ah = el("div", "pr-mode-head");
    ah.appendChild(el("span", "pr-mode-title", "Argue a topic"));
    ah.appendChild(el("span", "pr-mode-time", "60 s prep + 90 s speak"));
    a.appendChild(ah);
    a.appendChild(el("div", "pr-mode-desc", "A debate topic plus three expressions you must use. Same format as your Putting It All Together class."));
    a.appendChild(btn("cbtn known", "Start", topicDrill));
    wrap.appendChild(a);
    var b = el("div", "pr-mode");
    var bh = el("div", "pr-mode-head");
    bh.appendChild(el("span", "pr-mode-title", "Quick-fire starters"));
    bh.appendChild(el("span", "pr-mode-time", "5 x 30 s"));
    b.appendChild(bh);
    b.appendChild(el("div", "pr-mode-desc", "Five sentence starters from class. Finish each one out loud and keep talking until the timer ends."));
    b.appendChild(btn("cbtn", "Start", quickFire));
    wrap.appendChild(b);
    practiceEl.appendChild(wrap);
  }

  function topicDrill(){
    clearPractice();
    addTopBar("Argue a topic", null);
    var topic = pick(DEBATE_TOPICS);
    var targets = sample(TARGET_EXPR, 3);
    var opener = pick(OPENERS);
    var card = el("div", "pr-card");
    card.appendChild(el("div", "pr-tag", "Topic"));
    card.appendChild(el("div", "pr-topic", topic));
    card.appendChild(el("div", "pr-tag", "Use these expressions"));
    var list = el("div", "pr-targets");
    targets.forEach(function(t){
      var r = el("div", "pr-target");
      r.appendChild(el("span", null, t));
      r.appendChild(makeSpkBtn(t.replace(/\b[XY]\b/g, "something"), true));
      list.appendChild(r);
    });
    card.appendChild(list);
    card.appendChild(el("div", "pr-tag", "Try opening with"));
    var op = el("div", "pr-target");
    op.appendChild(el("span", null, opener));
    op.appendChild(makeSpkBtn(opener.replace(/…/g, "..."), true));
    card.appendChild(op);
    var phase = el("div", "pr-phase", "You get 60 seconds to prepare, then speak for about 90 seconds.");
    var clock = el("div", "pr-clock", "01:00");
    card.appendChild(phase);
    card.appendChild(clock);
    var ctr = el("div", "cards-controls");
    var startB = btn("cbtn known", "Start", startPrep);
    var skipB = btn("cbtn", "Skip prep", startSpeak);
    var stopB = btn("cbtn", "Finish early", finish);
    var newB = btn("cbtn ghost", "New topic", topicDrill);
    skipB.hidden = true; stopB.hidden = true;
    ctr.appendChild(startB); ctr.appendChild(skipB); ctr.appendChild(stopB); ctr.appendChild(newB);
    card.appendChild(ctr);
    practiceEl.appendChild(card);

    function startPrep(){
      startB.hidden = true; newB.hidden = true; skipB.hidden = false;
      phase.textContent = "Prepare your argument. Plan where each expression fits.";
      clock.classList.remove("speaking");
      runTimer(60, function(t){ clock.textContent = fmt(t); }, startSpeak);
    }
    function startSpeak(){
      skipB.hidden = true; startB.hidden = true; newB.hidden = true; stopB.hidden = false;
      phase.textContent = "Speak now. Out loud!";
      clock.classList.add("speaking");
      runTimer(90, function(t){ clock.textContent = fmt(t); }, finish);
    }
    function finish(){
      clearTimer();
      clock.classList.remove("speaking");
      skipB.hidden = true; stopB.hidden = true; startB.hidden = true; newB.hidden = true;
      phase.textContent = "Time. Be honest: which did you use?";
      var checks = el("div", "pr-checks");
      var items = targets.concat([opener]);
      items.forEach(function(t, i){
        var lab = el("label", "pr-check");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = "usedChk" + i;
        lab.appendChild(cb);
        lab.appendChild(el("span", null, t));
        checks.appendChild(lab);
      });
      card.appendChild(checks);
      var ctr2 = el("div", "cards-controls");
      ctr2.appendChild(btn("cbtn known", "Done", function(){ noteActivity(5); renderHome(); }));
      ctr2.appendChild(btn("cbtn", "Another topic", function(){ noteActivity(5); topicDrill(); }));
      card.appendChild(ctr2);
    }
  }

  function quickFire(){
    clearPractice();
    addTopBar("Quick-fire starters", null);
    var items = sample(DRILL_STARTERS, 5), idx = 0;
    var card = el("div", "pr-card center");
    var tag = el("div", "pr-tag", "");
    var starter = el("div", "pr-topic", "");
    var phase = el("div", "pr-phase", "");
    var clock = el("div", "pr-clock", "");
    var ctr = el("div", "cards-controls");
    var skipB = btn("cbtn", "Next starter", function(){ idx++; next(); });
    ctr.appendChild(skipB);
    card.appendChild(tag); card.appendChild(starter); card.appendChild(phase); card.appendChild(clock); card.appendChild(ctr);
    practiceEl.appendChild(card);
    next();

    function next(){
      clearTimer();
      if (idx >= items.length){
        tag.textContent = "Finished";
        starter.textContent = "Nice work. Five starters done.";
        phase.textContent = "";
        clock.textContent = "";
        clock.classList.remove("speaking");
        ctr.removeChild(skipB);
        noteActivity(5);
        ctr.appendChild(btn("cbtn known", "Again", quickFire));
        ctr.appendChild(btn("cbtn ghost", "Back", renderHome));
        return;
      }
      tag.textContent = "Starter " + (idx + 1) + " / " + items.length;
      starter.textContent = items[idx];
      phase.textContent = "Get ready";
      clock.classList.remove("speaking");
      runTimer(5, function(t){ clock.textContent = fmt(t); }, function(){
        phase.textContent = "Finish the sentence out loud and keep talking";
        clock.classList.add("speaking");
        runTimer(25, function(t){ clock.textContent = fmt(t); }, function(){ idx++; next(); });
      });
    }
  }

  function onPracticeTab(){
    if (practiceEl.getAttribute("data-view") !== "other") renderHome();
  }

  renderHome();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
