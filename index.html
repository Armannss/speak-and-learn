<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3B5BFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Armanly">
<title>Armanly</title>
<meta name="description" content="Vocabulary, phrases, grammar and daily practice from our English speaking class, with pronunciation and Persian meanings.">
<script>
  // Apply the saved theme before the first paint, so dark mode never flashes light.
  (function(){ try { var t = localStorage.getItem("speakLearnTheme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a friendly study app. White surfaces on a cool ground, 2px outlines, pressable buttons with a
     small ledge, one hue per category, and a yellow highlighter marking the target expression. */
  :root{
    --bg:#F3F5FB; --surface:#FFFFFF; --surface-2:#EBEEF7;
    --ink:#1B2033; --ink-2:#565D75; --ink-3:#8B92A8; --line:#DFE4F0;
    --accent:#3B5BFF; --accent-edge:#2740C4; --accent-ink:#FFFFFF; --accent-soft:#E7EBFF;
    --sun:#F5A800; --sun-soft:#FFF3CF; --flame:#FF7A1A;
    --mark:#FFE566; --mark-ink:#1B2033;
    --good:#159A66; --good-edge:#0F7A50; --good-soft:#DFF5EA;
    --bad:#E0434A; --bad-edge:#B62F36; --bad-soft:#FDE9EA;
    --cc:#3B5BFF;
    /* Category palette: one hue per topic, also used for practice modes. Set as --cc on a container. */
    /* Highlighter on coloured fills: the same yellow in both themes. */
    --hl:#FFE566; --hl-ink:#1B2033;
    --cat-1:#3B5BFF; --cat-2:#0E9AA0; --cat-3:#8B5CF6; --cat-4:#E8590C; --cat-5:#D48A00; --cat-6:#D6457F;
    --f-display:"Bricolage Grotesque", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --f-body:"Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --f-fa:"Vazirmatn", -apple-system, "Segoe UI", Tahoma, sans-serif;
    --r:16px;
    padding-top:env(safe-area-inset-top,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10131D; --surface:#191E2C; --surface-2:#232A3C;
      --ink:#EEF0F7; --ink-2:#A9B0C6; --ink-3:#727A93; --line:#2C3348;
      --accent:#6C83FF; --accent-edge:#4558D8; --accent-ink:#FFFFFF; --accent-soft:#222A52;
      --sun:#FFC83D; --sun-soft:#3A3011; --flame:#FF9447;
      --mark:#5A4D08; --mark-ink:#FFF2AE;
      --good:#3CCB8E; --good-edge:#279A69; --good-soft:#143525;
      --bad:#FF6B70; --bad-edge:#C9474C; --bad-soft:#3E1C1F;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10131D; --surface:#191E2C; --surface-2:#232A3C;
    --ink:#EEF0F7; --ink-2:#A9B0C6; --ink-3:#727A93; --line:#2C3348;
    --accent:#6C83FF; --accent-edge:#4558D8; --accent-ink:#FFFFFF; --accent-soft:#222A52;
    --sun:#FFC83D; --sun-soft:#3A3011; --flame:#FF9447;
    --mark:#5A4D08; --mark-ink:#FFF2AE;
    --good:#3CCB8E; --good-edge:#279A69; --good-soft:#143525;
    --bad:#FF6B70; --bad-edge:#C9474C; --bad-soft:#3E1C1F;
    color-scheme:dark;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--f-body); font-size:15px; line-height:1.5; font-weight:500;
    padding-inline:16px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{ display:none !important; }
  .wrap{ max-width:880px; margin:0 auto; }
  .fa{ font-family:var(--f-fa); direction:rtl; unicode-bidi:isolate; }
  button{ font-family:inherit; color:inherit; }
  :focus-visible{ outline:3px solid var(--sun); outline-offset:2px; }
  .ic{ width:1.2em; height:1.2em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; display:block; }
  mark{ background:var(--mark); color:var(--mark-ink); padding:0 .2em; border-radius:4px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .label{ font-size:13px; font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums; }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    margin-inline:-16px; padding:12px 16px 0;
  }
  .title-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:10px; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .logo{
    width:36px; height:36px; border-radius:11px; flex:none; background:var(--accent); color:var(--accent-ink);
    box-shadow:0 3px 0 var(--accent-edge);
    font-family:Georgia, "Times New Roman", serif; font-weight:700; font-size:44px; line-height:57px; text-align:center; overflow:hidden;
  }
  h1{ font-family:var(--f-display); font-weight:800; font-size:23px; margin:0; letter-spacing:-.02em; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  h1 em{ font-style:normal; }
  .tools{ display:flex; gap:5px; align-items:center; flex:none; }
  .tool-btn{
    border:2px solid var(--line); background:var(--surface); color:var(--ink-2); border-radius:12px; height:38px; min-width:38px; padding:0 8px;
    font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .tool-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .controls{ padding-bottom:10px; position:relative; }
  .controls .ic{ position:absolute; left:14px; top:13px; color:var(--ink-3); width:19px; height:19px; }
  .search{
    width:100%; background:var(--surface); border:2px solid var(--line); border-radius:14px;
    padding:10px 14px 10px 42px; font-size:15.5px; font-weight:500; color:var(--ink); font-family:inherit;
  }
  .search::placeholder{ color:var(--ink-3); }
  .search:focus{ outline:none; border-color:var(--accent); }

  .chipnav{ display:flex; gap:7px; overflow-x:auto; padding:0 0 12px; scrollbar-width:none; }
  .chipnav::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none; font-size:13.5px; font-weight:700; color:var(--ink-2); background:var(--surface);
    border:2px solid var(--line); border-radius:999px; padding:5px 13px; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:7px;
  }
  .chip[style*="--cc"]::before{ content:""; width:9px; height:9px; border-radius:50%; background:var(--cc); }
  .chip:hover{ border-color:var(--cc); color:var(--ink); }
  .chip.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  main{ padding-bottom:112px; }

  /* ---------- Header pills: streak and today's goal ---------- */
  .pill{
    height:38px; border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:0 11px 0 8px;
    display:flex; align-items:center; gap:5px; cursor:pointer; font-family:var(--f-display); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums;
  }
  .pill:hover{ border-color:var(--accent); }
  .pill .ic{ width:19px; height:19px; color:var(--ink-3); }
  .pill.on .ic{ color:var(--flame); fill:var(--flame); }
  .pill .ring{ width:22px; height:22px; }
  .pill .ring circle{ stroke-width:6; }
  .pill .ring text{ display:none; }
  .pill small{ font-size:12px; color:var(--ink-3); font-weight:700; }
  .ring{ width:36px; height:36px; flex:none; display:block; }
  .ring circle{ fill:none; stroke-width:4.5; }
  .ring .bg{ stroke:var(--surface-2); }
  .ring .fg{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
  .ring.good .fg{ stroke:var(--good); }
  .ring.sun .fg{ stroke:var(--sun); }
  .ring.bad .fg{ stroke:var(--bad); }
  .ring text{ font-family:var(--f-display); font-weight:800; font-size:14px; fill:var(--ink); }

  /* ---------- Section heading ---------- */
  .band{ display:flex; justify-content:space-between; align-items:center; gap:6px 12px; flex-wrap:wrap; margin:34px 0 12px; scroll-margin-top:190px; }
  .band .en{ font-family:var(--f-display); font-weight:800; font-size:21px; line-height:1.15; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; min-width:0; }
  .band .en::before{ content:""; width:6px; align-self:stretch; min-height:22px; border-radius:3px; background:var(--cc); flex:none; }
  .band .count{ font-family:var(--f-body); font-size:12.5px; font-weight:800; color:var(--cc); background:color-mix(in srgb, var(--cc) 13%, var(--surface)); border-radius:999px; padding:2px 9px; flex:none; }
  .band .fa{ color:var(--ink-2); font-size:13.5px; font-weight:500; text-align:right; margin-left:auto; min-width:0; }
  .band-add{ border:none; background:var(--accent); color:var(--accent-ink); box-shadow:0 3px 0 var(--accent-edge); border-radius:12px; padding:7px 14px 7px 10px; font-size:13.5px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:5px; flex:none; }
  .band-add:active{ transform:translateY(3px); box-shadow:none; }

  /* ---------- Word of the day ---------- */
  .wotd{ padding:16px 18px; border-radius:var(--r); position:relative; background:var(--surface); border:2px solid var(--line); }
  .wotd-term{ font-family:var(--f-display); font-weight:800; font-size:24px; line-height:1.15; letter-spacing:-.02em; padding-right:48px; }
  .wotd-fa{ font-size:15px; color:var(--ink-2); margin-top:2px; text-align:left; direction:rtl; }
  .wotd-ex{ margin-top:10px; font-size:14.5px; line-height:1.45; display:flex; gap:10px; align-items:flex-start; background:var(--bg); border-radius:11px; padding:9px 10px 9px 12px; }
  .wotd-ex span{ flex:1; }
  .wotd .spk.big{ position:absolute; top:14px; right:14px; width:38px; height:38px; }

  /* ---------- Vocabulary entries ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px; }
  .card{
    background:var(--surface); border:2px solid var(--line); border-radius:var(--r);
    padding:14px 15px 13px; cursor:pointer; display:flex; flex-direction:column; gap:6px; position:relative;
    transition:border-color .15s, transform .12s;
  }
  .card:hover{ border-color:var(--cc); }
  .card:active{ transform:scale(.985); }
  .card.bump{ animation:pop .3s ease; }
  .card.hide{ display:none; }
  .term-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .term{ font-family:var(--f-display); font-weight:700; font-size:19.5px; line-height:1.2; letter-spacing:-.01em; color:var(--ink); padding-top:3px; }
  .meaning{ color:var(--ink-2); font-size:14.5px; text-align:right; }
  .example{ color:var(--ink); font-size:14px; line-height:1.5; display:flex; gap:8px; align-items:flex-start; background:var(--bg); border-radius:11px; padding:9px 10px 9px 12px; margin-top:3px; }
  .example .ex-text{ flex:1; }
  /* Word type, synonyms and opposites */
  .pos{ align-self:flex-start; font-size:12px; font-weight:800; color:var(--cc); background:color-mix(in srgb, var(--cc) 12%, var(--surface)); border-radius:6px; padding:1px 8px; font-style:italic; }
  .facts{ display:grid; gap:4px; justify-items:start; }
  .rel{ font-size:13.5px; line-height:1.4; color:var(--ink); }
  .rel-k{ font-size:12px; font-weight:800; color:var(--ink-3); margin-right:7px; }
  .facts.on-color .rel, .facts.on-color .rel-k{ color:#fff; }
  .facts.on-color .rel-k{ opacity:.75; }
  .facts.study-rel{ width:100%; text-align:left; padding:2px 2px 0; }
  .fc-pos{ font-size:13px; font-weight:800; font-style:italic; color:var(--cc); margin-top:-4px; }
  .fc-rel{ width:100%; text-align:left; margin-top:2px; }
  .flashcard .back{ gap:9px; }
  .card-del{ align-self:flex-end; border:none; background:transparent; color:var(--ink-3); font-size:12.5px; font-weight:700; cursor:pointer; padding:2px 4px; border-radius:6px; }
  .card-del:hover{ color:var(--bad); }
  .card.empty-add{ align-items:center; justify-content:center; text-align:center; color:var(--ink-2); border-style:dashed; min-height:120px; gap:4px; }
  .card.empty-add b{ color:var(--accent); font-weight:800; }

  .spk{
    flex:none; width:34px; height:34px; border-radius:50%; border:2px solid transparent;
    background:color-mix(in srgb, var(--cc) 12%, var(--surface)); color:var(--cc); cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; transition:background .15s, color .15s, transform .1s;
  }
  .spk:hover{ border-color:var(--cc); }
  .spk:active{ transform:scale(.9); }
  .spk.small{ width:27px; height:27px; }
  .spk.playing{ background:var(--cc); color:#fff; }
  .spk svg{ width:16px; height:16px; }
  .spk.small svg{ width:13px; height:13px; }

  /* ---------- Phrase list ---------- */
  .phrase-box{ margin-bottom:6px; }
  .phrase-box.hide{ display:none; }
  /* Phrases are things you say, so each one is a chat bubble. */
  .phrase-list{ display:grid; gap:8px; justify-items:start; }
  .phrase-row{ display:flex; align-items:flex-start; gap:12px; padding:11px 12px 11px 15px; width:min(100%, 520px); background:var(--surface); border:2px solid var(--line); border-radius:20px 20px 20px 6px; }
  .phrase-row .txt{ flex:1; font-size:15.5px; color:var(--ink); line-height:1.4; font-weight:700; }
  .phrase-fa{ font-size:13px; color:var(--ink-2); margin-top:3px; font-weight:500; text-align:right; }

  .tabpanel{ display:none; }
  .tabpanel.active{ display:block; animation:rise .24s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  .empty{ color:var(--ink-2); font-size:15px; padding:36px 4px; text-align:center; line-height:1.6; }

  /* ---------- Buttons ---------- */
  .cbtn{
    border:2px solid var(--line); border-bottom-width:4px; background:var(--surface); color:var(--ink);
    font-weight:800; font-size:14.5px; padding:9px 18px; border-radius:14px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:transform .08s, filter .15s;
  }
  .cbtn:hover{ filter:brightness(.98); }
  .cbtn:active{ transform:translateY(2px); border-bottom-width:2px; margin-bottom:2px; }
  .cbtn:disabled{ opacity:.5; cursor:default; }
  .cbtn.ghost{ background:transparent; border-color:transparent; color:var(--ink-2); }
  .cbtn.ghost:hover{ color:var(--ink); }
  .cbtn.known{ background:var(--accent); border:none; color:var(--accent-ink); box-shadow:0 4px 0 var(--accent-edge); padding:11px 20px; margin-bottom:4px; }
  .cbtn.known:hover{ filter:brightness(1.06); }
  .cbtn.known:active{ transform:translateY(4px); box-shadow:none; }
  .cbtn.block{ width:100%; padding:14px 18px; font-size:16px; }
  .cbtn.sm{ padding:6px 13px; font-size:13.5px; border-radius:12px; }
  .linklike{ border:none; background:none; color:var(--ink-2); font-size:13.5px; font-weight:700; cursor:pointer; padding:6px; display:inline-flex; align-items:center; gap:6px; }
  .linklike:hover{ color:var(--accent); }
  .xbtn{
    width:38px; height:38px; flex:none; border-radius:12px; border:2px solid var(--line);
    background:var(--surface); color:var(--ink-2); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .xbtn:hover{ color:var(--ink); border-color:var(--ink-3); }

  /* ---------- Flashcards ---------- */
  .cards-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0 0; flex-wrap:wrap; font-size:13px; color:var(--ink-2); }
  .toggles{ display:flex; gap:7px; flex-wrap:wrap; }
  .unlearned-toggle{
    display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none; font-size:13.5px; font-weight:700; color:var(--ink-2);
    background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:5px 13px 5px 10px;
  }
  .unlearned-toggle:has(input:checked){ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .unlearned-toggle input{ accent-color:var(--accent); width:15px; height:15px; margin:0; }
  .cards-stats{ font-size:12.5px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }

  .stage{ display:flex; justify-content:center; padding:20px 0 6px; }
  .deck{ position:relative; width:100%; max-width:400px; height:clamp(240px, 38vh, 310px); }
  .deck::before, .deck::after{ content:""; position:absolute; inset:0; border-radius:24px; background:var(--surface); border:2px solid var(--line); }
  .deck::before{ transform:translateY(14px) scale(.9); opacity:.55; }
  .deck::after{ transform:translateY(7px) scale(.95); opacity:.85; }
  .flashcard{ position:absolute; inset:0; z-index:2; perspective:1400px; cursor:grab; outline:none; touch-action:pan-y; user-select:none; -webkit-user-select:none; will-change:transform; }
  .flashcard.dragging{ cursor:grabbing; }
  .flashcard.fly{ transition:transform .28s cubic-bezier(.5,0,.8,.4), opacity .28s ease; opacity:0; }
  .flashcard.spring{ transition:transform .3s cubic-bezier(.3,1.5,.5,1); }
  .flashcard.enter{ animation:cardIn .32s cubic-bezier(.3,1.3,.5,1) backwards; }
  @keyframes cardIn{ from{ transform:translateY(16px) scale(.94); opacity:0;} to{ transform:none; opacity:1;} }
  .flashcard:focus-visible .face{ outline:3px solid var(--sun); outline-offset:3px; }
  .fc-inner{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.3,1.1,.4,1); }
  .flashcard.flipped .fc-inner{ transform:rotateY(180deg); }
  .flashcard .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:24px; border:2px solid var(--line); border-bottom-width:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:48px 24px 40px; text-align:center;
  }
  .flashcard .front{ background:var(--surface); color:var(--ink); border-top:8px solid var(--cc); }
  .flashcard .back{ transform:rotateY(180deg); background:var(--cc); color:#fff; border-color:color-mix(in srgb, var(--cc) 72%, #000); }
  .fc-cat{ position:absolute; top:14px; left:16px; max-width:calc(100% - 76px); text-align:left; font-size:12.5px; font-weight:800; color:var(--cc); background:color-mix(in srgb, var(--cc) 12%, var(--surface)); padding:3px 10px; border-radius:999px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .flashcard.is-known .fc-cat::after{ content:" (known)"; }
  .fc-term{ font-family:var(--f-display); font-weight:800; font-size:clamp(27px,8vw,38px); line-height:1.1; letter-spacing:-.02em; text-wrap:balance; }
  .fc-hint{ position:absolute; bottom:13px; left:0; right:0; font-size:12.5px; font-weight:600; color:var(--ink-3); }
  .fc-meaning{ font-size:23px; font-weight:700; line-height:1.5; }
  .fc-example{ font-size:15.5px; line-height:1.45; display:flex; align-items:flex-start; gap:8px; opacity:.96; }
  .flashcard .back .spk{ background:rgba(255,255,255,.2); color:#fff; }
  .flashcard .spk.big{ position:absolute; top:10px; right:12px; width:40px; height:40px; }
  .flashcard .spk.big svg{ width:18px; height:18px; }
  .swipe-label{
    position:absolute; top:52px; z-index:6; padding:5px 12px; border:3px solid; border-radius:10px;
    font-family:var(--f-display); font-weight:800; font-size:16px; background:var(--surface); opacity:0; pointer-events:none;
  }
  .swipe-label.yes{ left:16px; color:var(--good); border-color:var(--good); transform:rotate(-9deg); }
  .swipe-label.no{ right:16px; color:var(--bad); border-color:var(--bad); transform:rotate(9deg); }

  .cards-bar{ max-width:400px; margin:18px auto 0; }
  .cards-progress{ text-align:center; font-size:12.5px; font-weight:600; color:var(--ink-3); margin-top:7px; font-variant-numeric:tabular-nums; }
  .cards-controls{ display:flex; align-items:flex-start; justify-content:center; gap:24px; margin-top:12px; flex-wrap:wrap; }
  .rbtn{ display:flex; flex-direction:column; align-items:center; gap:9px; border:none; background:none; cursor:pointer; color:var(--ink-2); font-size:12.5px; font-weight:700; padding:0; }

  .rbtn.no .ri{ background:var(--bad); box-shadow:0 4px 0 var(--bad-edge); }
  .rbtn.yes .ri{ background:var(--good); box-shadow:0 4px 0 var(--good-edge); }
  .rbtn.flip .ri{ background:var(--surface); color:var(--ink-2); border:2px solid var(--line); box-shadow:0 3px 0 var(--line); width:48px; height:48px; margin-top:6px; }
  .rbtn.flip .ri .ic{ width:20px; height:20px; stroke-width:2.2; }
  .rbtn:active .ri{ transform:translateY(4px); box-shadow:none; }
  .cards-nav{ display:flex; align-items:center; justify-content:center; gap:4px; margin-top:6px; }
  .cards-footer-row{ display:flex; justify-content:center; gap:14px; }
  .swipe-tip{ text-align:center; font-size:12.5px; color:var(--ink-3); margin-top:8px; }
  .pbar{ height:12px; background:var(--surface-2); border-radius:6px; overflow:hidden; }
  .pbar-fill{ height:100%; background:var(--accent); border-radius:6px; transition:width .45s cubic-bezier(.2,.9,.3,1); position:relative; min-width:12px; }
  .pbar-fill::after{ content:""; position:absolute; left:7px; right:7px; top:3px; height:3px; border-radius:2px; background:rgba(255,255,255,.3); }
  .pbar.gold .pbar-fill{ background:var(--good); }

  /* ---------- Bottom tab bar ---------- */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; justify-content:center; gap:2px;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));

    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:2px solid var(--line);
  }
  .bottombar button{
    flex:1 1 0; max-width:128px; border:none; background:transparent; color:var(--ink-3);
    padding:6px 2px 5px; cursor:pointer; position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:11.5px; font-weight:700; border-radius:14px; transition:background .15s, color .15s;
  }
  .bottombar .ic{ width:23px; height:23px; }
  .bottombar button:hover{ color:var(--ink-2); }
  .bottombar button.active{ color:var(--accent); background:var(--accent-soft); }
  .bottombar button.active .ic{ fill:color-mix(in srgb, var(--accent) 22%, transparent); animation:pop .3s ease; }
  .tbadge{ position:absolute; top:2px; left:calc(50% + 7px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--bad); color:#fff; font-size:10.5px; font-weight:800; line-height:17px; text-align:center; }

  /* ---------- Grammar ---------- */
  .g-intro{ margin:14px 0 4px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .g-intro h2{ font-family:var(--f-display); font-weight:800; font-size:24px; line-height:1.1; letter-spacing:-.02em; margin:0; }
  .g-intro p{ margin:4px 0 0; color:var(--ink-2); font-size:14.5px; max-width:52ch; }
  .g-list{ margin-top:14px; display:grid; gap:10px; }
  .g-item{ background:var(--surface); border:2px solid var(--line); border-radius:var(--r); overflow:hidden; scroll-margin-top:84px; }
  .g-item.open{ border-color:var(--cc); }
  .g-head{ width:100%; border:none; background:transparent; cursor:pointer; text-align:left; padding:13px 14px; display:flex; align-items:center; gap:12px; }
  .g-tile .ic{ width:21px; height:21px; }
  .g-tile{ width:42px; height:42px; border-radius:13px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--cc); color:#fff; font-family:var(--f-display); font-weight:800; font-size:17px; box-shadow:0 3px 0 color-mix(in srgb, var(--cc) 70%, #000); }
  .g-main{ flex:1; min-width:0; }
  .g-title{ font-family:var(--f-display); font-weight:800; font-size:17.5px; line-height:1.2; display:block; letter-spacing:-.01em; }
  .g-sub{ display:block; margin-top:2px; }
  .g-sub .fa{ font-size:12.5px; color:var(--ink-2); }
  .g-score{ font-size:12.5px; font-weight:800; color:var(--ink-3); flex:none; text-align:right; padding:3px 9px; border-radius:999px; background:var(--surface-2); }
  .g-score.ok{ color:var(--good); background:var(--good-soft); }
  .g-head > .ic{ color:var(--ink-3); transition:transform .2s; }
  .g-item.open .g-head > .ic{ transform:rotate(180deg); }
  .g-body{ padding:0 14px 16px; display:none; }
  .g-item.open .g-body{ display:block; }
  .g-lead{ color:var(--ink-2); font-size:15px; max-width:65ch; margin:0 0 14px; }
  .g-table{ width:100%; border-collapse:collapse; border:2px solid var(--line); border-radius:14px; overflow:hidden; display:block; }
  .g-table tbody{ display:block; }
  .g-table tr{ display:grid; grid-template-columns:minmax(120px, 34%) 1fr; border-bottom:2px solid var(--line); }
  .g-table tr:last-child{ border-bottom:none; }
  .g-table td{ padding:10px 13px; vertical-align:top; font-size:14.5px; min-width:0; }
  .g-table td:first-child{ font-weight:800; background:color-mix(in srgb, var(--cc) 8%, var(--surface)); }
  .g-table td small{ display:block; font-weight:500; color:var(--ink-2); font-size:13px; margin-top:2px; }
  .g-table .ex{ font-size:15px; line-height:1.4; display:block; padding-left:11px; border-left:3px solid var(--cc); }
  .g-table .ex + .ex{ margin-top:8px; }
  .g-h{ margin:18px 0 8px; }
  .g-notes{ margin:0; padding:0; list-style:none; display:grid; gap:7px; }
  .g-notes li{ padding-left:18px; position:relative; font-size:14.5px; color:var(--ink); max-width:68ch; }
  .g-notes li::before{ content:""; position:absolute; left:2px; top:.5em; width:7px; height:7px; border-radius:50%; background:var(--cc); }
  .g-fix{ display:grid; gap:6px; }
  .g-fix-row{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .g-fix-row > div{ padding:9px 12px; border-radius:11px; font-size:14.5px; min-width:0; }
  .g-wrong{ background:var(--bad-soft); color:var(--bad); text-decoration:line-through; text-decoration-thickness:1.5px; }
  .g-right{ background:var(--good-soft); color:var(--good); font-weight:700; }
  .g-actions{ margin-top:16px; }
  @media (max-width:520px){
    .g-table tr{ grid-template-columns:1fr; }
    .g-fix-row{ grid-template-columns:1fr; }
  }

  /* ---------- Practice ---------- */
  .pr-hero{ background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:4px 16px; }
  .pr-hero-head{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .pr-hero-head .ring{ width:64px; height:64px; }
  .pr-hero-head .ring circle{ stroke-width:4; }
  .pr-hero-head .ring text{ font-size:12px; }
  .pr-streak{ font-family:var(--f-display); font-weight:800; font-size:22px; line-height:1.1; letter-spacing:-.02em; }
  .pr-goal-text{ color:var(--ink-2); font-size:13.5px; margin-top:3px; font-variant-numeric:tabular-nums; }
  .missions{ margin:0; }
  .mission{ display:flex; align-items:center; gap:12px; padding:11px 0; position:relative; }
  .mission + .mission::before{ content:""; position:absolute; left:15px; top:-12px; height:24px; width:2px; background:var(--line); }
  .mission.done + .mission::before{ background:var(--good); }
  .m-ico{ width:32px; height:32px; border-radius:50%; flex:none; border:2px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-3); font-family:var(--f-display); font-weight:800; font-size:14px; position:relative; z-index:1; }
  .m-ico .ic{ width:16px; height:16px; stroke-width:3; }

  .m-body{ flex:1; min-width:0; }
  .m-title{ font-weight:800; font-size:15px; }
  .mission.done .m-title{ color:var(--ink-3); }
  .m-sub{ font-size:12.5px; color:var(--ink-2); }
  .pr-sect{ margin:22px 0 8px; }
  .pr-modes{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:10px; }
  .pr-mode{ display:flex; align-items:center; gap:13px; padding:12px 13px; border:2px solid var(--line); border-bottom-width:4px; border-radius:var(--r); cursor:pointer; background:var(--surface); width:100%; text-align:left; transition:transform .08s, border-color .15s; }
  .pr-mode:hover{ border-color:var(--cc); }
  .pr-mode:active{ transform:translateY(2px); border-bottom-width:2px; margin-bottom:2px; }
  .pr-mode-ico{ width:44px; height:44px; border-radius:14px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--cc); color:#fff; box-shadow:0 3px 0 color-mix(in srgb, var(--cc) 70%, #000); }
  .pr-mode-ico .ic{ width:22px; height:22px; }
  .pr-mode-text{ flex:1; min-width:0; }
  .pr-mode-title{ font-family:var(--f-display); font-weight:800; font-size:16px; display:block; letter-spacing:-.01em; }
  .pr-mode-desc{ font-size:13px; color:var(--ink-2); line-height:1.35; display:block; }
  .pr-mode-time{ font-size:12px; font-weight:700; color:var(--ink-3); flex:none; white-space:nowrap; }
  .pr-tip{ margin-top:16px; font-size:13px; color:var(--ink-3); text-align:center; }

  .pr-top{ display:flex; align-items:center; gap:12px; margin:10px 0 12px; }
  .pr-top .pbar{ flex:1; height:14px; border-radius:7px; }
  .pr-top .pbar-fill{ border-radius:7px; background:var(--good); }
  .pr-top-title{ font-family:var(--f-display); font-weight:800; font-size:17px; flex:1; }
  .pr-top-right{ font-size:13px; font-weight:800; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .combo{ font-size:12.5px; font-weight:800; color:var(--flame); background:color-mix(in srgb, var(--flame) 14%, var(--surface)); padding:3px 9px 3px 6px; border-radius:999px; display:flex; align-items:center; gap:3px; animation:pop .3s ease; }
  .combo .ic{ width:14px; height:14px; fill:var(--flame); }
  @keyframes pop{ 0%{ transform:scale(.7);} 60%{ transform:scale(1.12);} 100%{ transform:scale(1);} }
  .pr-card{ background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:18px 16px; margin-top:10px; }
  .pr-card.center{ text-align:center; }
  .pr-tag{ font-size:13px; font-weight:800; color:var(--accent); margin:16px 0 8px; }
  .pr-tag:first-child{ margin-top:0; }
  .pr-prompt{ font-family:var(--f-display); font-weight:700; font-size:21px; line-height:1.35; letter-spacing:-.01em; margin-bottom:16px; text-wrap:pretty; }
  .pr-prompt.small{ font-family:var(--f-body); font-weight:500; font-size:15px; color:var(--ink-2); }
  .pr-opts{ display:grid; gap:9px; counter-reset:o; }
  .pr-opt{
    text-align:left; font-size:15.5px; font-weight:700; padding:11px 13px; border-radius:14px; cursor:pointer;
    background:var(--surface); color:var(--ink); border:2px solid var(--line); border-bottom-width:4px; display:flex; align-items:center; gap:12px;
    transition:transform .08s, border-color .15s, background .15s;
  }
  .pr-opt::before{
    counter-increment:o; content:counter(o, upper-alpha); flex:none; width:27px; height:27px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800;
    border:2px solid var(--line); color:var(--ink-3);
  }
  .pr-opt:hover:not(:disabled){ border-color:var(--accent); background:var(--accent-soft); }
  .pr-opt:active:not(:disabled){ transform:translateY(2px); border-bottom-width:2px; margin-bottom:2px; }
  .pr-opt.right{ border-color:var(--good); background:var(--good-soft); color:var(--good-edge); animation:pop .3s ease; }
  .pr-opt.right::before{ background:var(--good); border-color:var(--good); color:#fff; }
  .pr-opt.wrong{ border-color:var(--bad); background:var(--bad-soft); animation:shake .35s ease; }
  .pr-opt.wrong::before{ background:var(--bad); border-color:var(--bad); color:#fff; }
  :root[data-theme="dark"] .pr-opt.right{ color:var(--good); }
  .pr-opt:disabled{ cursor:default; opacity:1; }
  .pr-opt:disabled:not(.right):not(.wrong){ opacity:.5; color:var(--ink); }
  @keyframes shake{ 25%{ transform:translateX(-6px);} 50%{ transform:translateX(6px);} 75%{ transform:translateX(-3px);} }
  .pr-feedback{ margin-top:10px; padding:14px 15px; border-radius:18px; border:2px solid var(--line); background:var(--surface); animation:fbIn .25s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes fbIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
  .pr-feedback.good{ background:var(--good-soft); border-color:transparent; }
  .pr-feedback.bad{ background:var(--bad-soft); border-color:transparent; }
  .pr-fb-head{ font-family:var(--f-display); font-weight:800; font-size:18px; display:flex; align-items:center; gap:9px; }
  .pr-fb-head .fbi{ width:28px; height:28px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; }
  .pr-fb-head .fbi .ic{ width:16px; height:16px; stroke-width:3; }
  .pr-fb-head.good{ color:var(--good); }
  .pr-fb-head.good .fbi{ background:var(--good); }
  .pr-fb-head.bad{ color:var(--bad); }
  .pr-fb-head.bad .fbi{ background:var(--bad); }
  .pr-fb-note{ font-size:14px; color:var(--ink-2); margin-top:7px; line-height:1.5; }
  .pr-fb-sentence{ display:flex; align-items:flex-start; gap:8px; margin-top:8px; font-size:15px; font-weight:700; line-height:1.4; }
  .pr-fb-sentence span{ flex:1; }
  .pr-play{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .spk.big-inline{ width:58px; height:58px; background:var(--accent); color:#fff; box-shadow:0 4px 0 var(--accent-edge); }
  .spk.big-inline:active{ transform:translateY(4px); box-shadow:none; }
  .spk.big-inline svg{ width:25px; height:25px; }
  .pr-input{
    width:100%; font-size:16px; font-weight:600; padding:12px 14px; border-radius:14px; font-family:inherit;
    background:var(--surface); color:var(--ink); border:2px solid var(--line);
  }
  .pr-input:focus{ outline:none; border-color:var(--accent); }
  .pr-diff{ margin-top:8px; font-size:16px; line-height:1.8; font-weight:600; }
  .w-ok{ color:var(--good); }
  .w-miss{ color:var(--bad); text-decoration:underline wavy; }
  .res-ring{ width:150px; height:150px; margin:4px auto 2px; display:block; }
  .res-ring circle{ fill:none; stroke-width:4; }
  .res-ring .bg{ stroke:var(--surface-2); }
  .res-ring .fg{ stroke:var(--good); stroke-linecap:round; animation:ringIn 1s cubic-bezier(.2,.8,.2,1) both; }
  .res-ring.mid .fg{ stroke:var(--sun); }
  .res-ring.low .fg{ stroke:var(--bad); }
  @keyframes ringIn{ from{ stroke-dashoffset:113.1; } }
  .res-ring text{ font-family:var(--f-display); font-weight:800; fill:var(--ink); }
  .res-title{ font-family:var(--f-display); font-weight:800; font-size:23px; letter-spacing:-.02em; margin-top:6px; }
  .res-stats{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:14px; }
  .res-stat{ border:2px solid var(--line); border-radius:14px; padding:9px 6px; }
  .res-stat b{ display:block; font-family:var(--f-display); font-weight:800; font-size:19px; font-variant-numeric:tabular-nums; }
  .res-stat small{ color:var(--ink-2); font-size:12px; font-weight:600; }
  .res-stat.xp{ border-color:var(--sun); background:var(--sun-soft); }
  .pr-topic{ font-family:var(--f-display); font-weight:700; font-size:20px; line-height:1.35; letter-spacing:-.01em; }
  .pr-targets{ display:grid; }
  .pr-target{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:15px; font-weight:700; padding:9px 0; border-bottom:2px solid var(--surface-2); }
  .pr-target:last-child{ border-bottom:none; }
  .pr-phase{ margin-top:16px; font-size:14px; font-weight:600; color:var(--ink-2); text-align:center; }
  .pr-clock{ font-family:var(--f-display); font-weight:800; font-size:60px; text-align:center; font-variant-numeric:tabular-nums; line-height:1.25; letter-spacing:-.03em; }
  .pr-clock.speaking{ color:var(--bad); }
  .pr-challenge{ margin-top:14px; padding:12px 14px; border-radius:16px; background:var(--sun-soft); border:2px solid var(--sun); font-family:var(--f-display); font-weight:800; font-size:18px; line-height:1.3; text-align:center; }

  .case-facts{ margin:12px 0 4px; }
  .case-task{ font-size:15.5px; font-weight:700; line-height:1.45; }

  .row-actions.left{ justify-content:flex-start; margin-top:10px; }

  /* ---------- Toast, XP float, sheets ---------- */
  #fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:300; }
  .toast-wrap{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:0; right:0; z-index:250; display:grid; justify-items:center; gap:6px; pointer-events:none; padding:0 14px; }
  .toast{ display:flex; align-items:center; gap:11px; background:var(--ink); color:var(--bg); border-radius:16px; padding:10px 16px 10px 12px; box-shadow:0 10px 30px rgba(0,0,0,.25); max-width:420px; animation:toastIn .35s cubic-bezier(.3,1.4,.5,1) both; }
  .toast.out{ animation:toastOut .25s ease forwards; }
  .toast .ic{ width:30px; height:30px; padding:6px; border-radius:50%; background:var(--sun); color:#3A2A00; }
  .toast .t-title{ font-weight:800; font-size:14.5px; }
  .toast .t-sub{ font-size:12.5px; opacity:.75; }
  @keyframes toastIn{ from{ transform:translateY(-24px) scale(.95); opacity:0;} to{ transform:none; opacity:1;} }
  @keyframes toastOut{ to{ transform:translateY(-14px); opacity:0;} }
  .xp-float{ position:fixed; z-index:260; pointer-events:none; font-family:var(--f-display); font-weight:800; font-size:15px; color:#3A2A00; background:var(--sun); padding:2px 10px; border-radius:999px; animation:floatUp 1s ease-out forwards; transform:translate(-50%,-50%); }
  @keyframes floatUp{ 0%{ opacity:0; transform:translate(-50%,-20%) scale(.8);} 15%{ opacity:1; transform:translate(-50%,-60%) scale(1.05);} 100%{ opacity:0; transform:translate(-50%,-260%);} }
  .modal{ position:fixed; inset:0; z-index:200; background:rgba(12,15,28,.55); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease both; }
  .modal.center{ align-items:center; padding:20px; }
  @keyframes fade{ from{ opacity:0;} to{ opacity:1;} }
  .sheet{
    background:var(--bg); width:100%; max-width:540px; max-height:88vh; overflow:auto; border-radius:24px 24px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px)); animation:sheetUp .3s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes sheetUp{ from{ transform:translateY(40px); opacity:0;} to{ transform:none; opacity:1;} }
  @media (min-width:640px){ .modal{ align-items:center; } .sheet{ border-radius:24px; } }
  .sheet-title{ font-family:var(--f-display); font-weight:800; font-size:26px; line-height:1.1; letter-spacing:-.02em; }
  .sheet-sub{ color:var(--ink-2); font-size:13.5px; margin-top:4px; font-variant-numeric:tabular-nums; }
  .sheet .pbar{ margin:12px 0 4px; }
  .sheet h3{ margin:22px 0 10px; font-size:13.5px; color:var(--ink-2); font-weight:800; }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .stat-cell{ padding:11px 10px; background:var(--surface); border:2px solid var(--line); border-radius:14px; }
  .stat-cell b{ display:block; font-family:var(--f-display); font-weight:800; font-size:21px; line-height:1.15; font-variant-numeric:tabular-nums; }
  .stat-cell small{ color:var(--ink-2); font-size:12px; font-weight:600; }
  .badge-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .badge{ display:flex; align-items:center; gap:10px; padding:10px; background:var(--surface); border:2px solid var(--line); border-radius:14px; }
  .badge .b-ico{ width:36px; height:36px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--ink-3); }
  .badge .b-ico .ic{ width:18px; height:18px; }
  .badge.got{ border-color:var(--sun); background:var(--sun-soft); }
  .badge.got .b-ico{ background:var(--sun); color:#3A2A00; }
  .badge .b-t{ font-weight:800; font-size:13.5px; line-height:1.2; }
  .badge .b-d{ font-size:12px; color:var(--ink-2); line-height:1.3; margin-top:1px; }
  .badge.locked .b-t{ color:var(--ink-2); }
  .celebrate{ background:var(--surface); border-radius:24px; padding:28px 24px 20px; text-align:center; max-width:340px; width:100%; margin:auto; animation:pop .35s cubic-bezier(.3,1.4,.5,1) both; }
  .celebrate .c-kicker{ display:inline-block; font-size:13px; font-weight:800; color:#3A2A00; background:var(--sun); padding:3px 12px; border-radius:999px; }
  .celebrate .c-title{ font-family:var(--f-display); font-weight:800; font-size:34px; line-height:1.05; letter-spacing:-.02em; margin:12px 0 6px; }
  .celebrate .c-sub{ color:var(--ink-2); font-size:14.5px; margin-bottom:18px; }
  .field{ display:grid; gap:5px; margin-top:14px; }
  .field label{ font-size:13.5px; font-weight:800; }
  .field label small{ font-weight:500; color:var(--ink-3); }
  .field input, .field textarea, .field select{ width:100%; font:inherit; font-size:16px; padding:11px 13px; border-radius:14px; border:2px solid var(--line); background:var(--surface); color:var(--ink); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .field-err{ color:var(--bad); font-size:13.5px; font-weight:600; margin-top:10px; }
  .sheet-actions{ display:flex; gap:8px; margin-top:18px; align-items:flex-start; }
  .sheet-actions .cbtn{ flex:1; }
  .sheet-note{ font-size:13px; color:var(--ink-2); line-height:1.5; }

  /* ---------- Library switch ---------- */
  .lib-seg{ display:flex; background:var(--surface-2); border-radius:14px; padding:4px; gap:2px; margin-bottom:10px; }
  .lib-seg button{ flex:1; border:none; background:transparent; color:var(--ink-2); font-weight:800; font-size:14px; padding:8px 6px; border-radius:11px; cursor:pointer; }
  .lib-seg button.active{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(20,24,40,.12); }

  /* ---------- Page heading ---------- */
  .pg-head{ margin:14px 0 12px; }
  .pg-head h2{ font-family:var(--f-display); font-weight:800; font-size:25px; line-height:1.1; letter-spacing:-.02em; margin:0; }
  .pg-head p{ margin:5px 0 0; color:var(--ink-2); font-size:14.5px; max-width:56ch; }

  /* ---------- Home ---------- */
  .hello{ margin:16px 0 0; }
  .hello h2{ font-family:var(--f-display); font-weight:800; font-size:25px; line-height:1.1; letter-spacing:-.02em; margin:0; overflow-wrap:anywhere; }
  .hello p{ margin:4px 0 0; color:var(--ink-2); font-size:13.5px; display:flex; align-items:center; gap:6px; }
  .hello p .ic{ width:15px; height:15px; color:var(--good); }
  .notice{ margin-top:14px; padding:13px 14px; border-radius:var(--r); border:2px solid var(--line); background:var(--surface); display:flex; gap:12px; align-items:flex-start; }
  .notice > .ic{ width:22px; height:22px; color:var(--accent); margin-top:1px; }
  .notice.warn{ background:var(--bad-soft); border-color:transparent; }
  .notice.warn > .ic{ color:var(--bad); }
  .notice-body{ flex:1; min-width:0; }
  .notice-body .m-sub{ margin-top:2px; line-height:1.45; }
  .notice-body .cbtn{ margin-top:10px; }
  .continue .pbar{ background:rgba(255,255,255,.22); margin:12px 0 14px; }
  .continue .pbar-fill{ background:#fff; }
  .continue .pbar-fill::after{ display:none; }
  .data-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:2px solid var(--surface-2); font-size:14px; }
  .data-row:last-of-type{ border-bottom:none; }
  .data-row span:first-child{ color:var(--ink-2); font-weight:600; }
  .data-row span:last-child{ font-weight:800; text-align:right; }
  .data-row .ok{ color:var(--good); }
  .data-row .warn{ color:var(--bad); }
  .move-note{ margin-top:7px; }
  .move-link{ width:100%; margin-top:10px; min-height:84px; font:inherit; font-size:12.5px; padding:10px 12px; border-radius:14px; border:2px solid var(--accent); background:var(--surface); color:var(--ink); resize:none; word-break:break-all; }
  /* The next lesson is said in a speech bubble: Armanly is a speaking class. */
  .continue{ margin:14px 0 22px; padding:18px 18px 16px; border-radius:24px 24px 24px 8px; background:var(--accent); color:#fff; position:relative; }
  .continue::after{ content:""; position:absolute; left:0; bottom:-17px; width:34px; height:18px; background:var(--accent); clip-path:polygon(0 0, 100% 0, 0 100%); }
  .continue .label{ color:rgba(255,255,255,.8); }
  .continue-title{ font-family:var(--f-display); font-weight:800; font-size:25px; line-height:1.12; letter-spacing:-.02em; margin-top:3px; text-wrap:balance; }
  .continue-sub{ font-size:14px; opacity:.9; margin-top:4px; }
  .continue-words{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 14px; }
  .continue-words mark{ font-size:14.5px; font-weight:800; background:var(--hl); color:var(--hl-ink); padding:2px 8px; border-radius:3px 7px 4px 6px; transform:rotate(-1deg); }
  .continue-words mark:nth-child(even){ transform:rotate(.8deg); }
  .cbtn.light{ background:#fff; color:var(--accent-edge); border:none; box-shadow:0 4px 0 rgba(0,0,0,.2); margin-bottom:4px; }
  .cbtn.light:active{ transform:translateY(4px); box-shadow:none; }
  .week{ display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:12px 10px; }
  .day{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  .day-dot{ width:34px; height:34px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .day.some .day-dot{ background:var(--accent-soft); color:var(--accent); }
  .day.full .day-dot{ background:var(--good); color:#fff; }
  .day-dot .ic{ width:17px; height:17px; stroke-width:3; }
  .day-name{ font-size:12px; font-weight:700; color:var(--ink-3); }
  .day.today .day-name{ color:var(--ink); }
  .day.today .day-dot{ box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .week-note{ font-size:12.5px; color:var(--ink-3); margin-top:7px; }
  .revisit{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding:12px 14px; background:var(--bad-soft); border-radius:var(--r); }

  /* ---------- Learning path ---------- */
  .unit{ margin-top:14px; background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:14px 15px 13px; border-top:6px solid var(--cc); }
  .unit-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .unit-title{ font-family:var(--f-display); font-weight:800; font-size:18px; line-height:1.2; letter-spacing:-.01em; }
  .unit-count{ font-size:12.5px; font-weight:800; color:var(--cc); background:color-mix(in srgb, var(--cc) 13%, var(--surface)); border-radius:999px; padding:2px 10px; flex:none; font-variant-numeric:tabular-nums; }
  .unit.complete .unit-count{ color:#fff; background:var(--good); }
  .unit-fa{ font-size:13px; color:var(--ink-2); margin-top:1px; text-align:left; direction:rtl; }
  .nodes{ display:flex; flex-wrap:wrap; gap:10px 0; margin:14px 0 10px; }
  .node{
    width:48px; height:48px; border-radius:50%; border:2px solid var(--line); background:var(--surface); color:var(--ink-2);
    font-family:var(--f-display); font-weight:800; font-size:16px; cursor:pointer; padding:0; position:relative; margin-right:22px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 var(--line); transition:transform .08s, box-shadow .08s;
  }
  .node:not(:last-child)::after{ content:""; position:absolute; left:calc(100% + 2px); top:50%; width:22px; height:3px; margin-top:-1px; background:var(--line); border-radius:2px; }
  .node.done{ background:var(--cc); border-color:var(--cc); color:#fff; box-shadow:0 3px 0 color-mix(in srgb, var(--cc) 68%, #000); }
  .node.done:not(:last-child)::after{ background:var(--cc); }
  .node .ic{ width:21px; height:21px; stroke-width:3; }
  .node.next{ border-color:var(--cc); color:var(--cc); box-shadow:0 3px 0 var(--cc), 0 0 0 5px color-mix(in srgb, var(--cc) 18%, transparent); animation:nudge 2.2s ease-in-out infinite; }
  .node:active{ transform:translateY(3px); box-shadow:none; }
  @keyframes nudge{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-3px);} }
  .unit-next{ font-size:13px; color:var(--ink-2); line-height:1.45; }
  .unit-next b{ color:var(--ink); font-weight:800; }
  .g-chips{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 10px; }
  .g-chip{ display:flex; align-items:center; gap:7px; border:2px solid var(--line); border-bottom-width:4px; background:var(--surface); border-radius:13px; padding:7px 12px 7px 9px; font-weight:800; font-size:13.5px; cursor:pointer; color:var(--ink); }
  .g-chip .ic{ width:17px; height:17px; color:var(--cc); }
  .g-chip.done{ border-color:var(--good); }
  .g-chip.done .ic{ color:var(--good); stroke-width:3; }
  .g-chip:active{ transform:translateY(2px); border-bottom-width:2px; margin-bottom:2px; }

  /* ---------- Lesson study card ---------- */
  .pr-card.study{ text-align:center; border-top:8px solid var(--cc); padding:22px 18px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .pr-card.study .pr-tag{ color:var(--cc); margin:0; }
  .st-term{ font-family:var(--f-display); font-weight:800; font-size:clamp(27px, 8vw, 36px); line-height:1.12; letter-spacing:-.02em; text-wrap:balance; }
  .pr-card.study .spk.big-inline{ background:var(--cc); box-shadow:0 4px 0 color-mix(in srgb, var(--cc) 68%, #000); }
  .st-meaning{ font-size:20px; font-weight:700; color:var(--ink); }
  .st-example{ width:100%; text-align:left; font-size:15px; line-height:1.5; display:flex; gap:10px; align-items:flex-start; background:var(--bg); border-radius:12px; padding:11px 12px 11px 14px; }
  .st-example span{ flex:1; }

  /* ---------- Home: greeting, level, sections ---------- */
  h3.sect{ font-family:var(--f-display); font-weight:800; font-size:19px; letter-spacing:-.01em; line-height:1.2; margin:28px 0 10px; color:var(--ink); }
  .lvl{ width:100%; margin-top:14px; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer; background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:10px 14px 10px 10px; color:var(--ink); font:inherit; }
  .lvl:hover{ border-color:var(--accent); }
  .lvl-num{ width:40px; height:40px; flex:none; border-radius:13px; background:var(--accent); color:#fff; box-shadow:0 3px 0 var(--accent-edge); display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:800; font-size:19px; }
  .lvl-main{ flex:1; min-width:0; display:grid; gap:7px; }
  .lvl-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .lvl-name{ font-family:var(--f-display); font-weight:800; font-size:16.5px; }
  .lvl-xp{ font-size:12.5px; font-weight:700; color:var(--ink-3); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .lvl .pbar{ height:9px; }
  .lvl .pbar-fill{ min-width:9px; }
  .lvl .pbar-fill::after{ display:none; }

  /* ---------- Settings ---------- */
  .set-row{ margin-top:18px; }
  .set-label{ font-size:13.5px; font-weight:800; margin-bottom:7px; }
  .seg{ display:flex; background:var(--surface-2); border-radius:14px; padding:4px; gap:2px; }
  .seg button{ flex:1; border:none; background:transparent; color:var(--ink-2); font-weight:800; font-size:14px; padding:9px 6px; border-radius:11px; cursor:pointer; }
  .seg button.active{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(20,24,40,.12); }

  /* ---------- Focus mode: an exercise takes the whole screen ---------- */
  body.focus header.top, body.focus .bottombar{ display:none; }
  body.focus main{ padding-bottom:24px; }
  body.focus #panel-practice{ max-width:600px; margin:0 auto; animation:none; } /* a transform here would unpin the dock */
  body.focus .pr-top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; margin:0 -16px; padding:12px 16px; background:var(--bg); }
  .pr-dock{
    position:fixed; left:0; right:0; bottom:0; z-index:45; background:var(--bg); border-top:2px solid var(--line);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
  }
  .pr-dock.good, .pr-dock.bad{ animation:dockUp .22s cubic-bezier(.2,.9,.3,1) both; }
  .pr-dock > *{ max-width:568px; margin-left:auto; margin-right:auto; }
  .pr-dock .cbtn.block{ display:flex; }
  .pr-dock.idle{ display:none; }
  .pr-dock.good{ background:var(--good-soft); border-top-color:color-mix(in srgb, var(--good) 35%, transparent); }
  .pr-dock.bad{ background:var(--bad-soft); border-top-color:color-mix(in srgb, var(--bad) 35%, transparent); }
  .pr-dock .pr-feedback{ margin:2px auto 12px; padding:0; border:none; background:none; animation:none; }
  .pr-dock.good .cbtn.known{ background:var(--good); box-shadow:0 4px 0 var(--good-edge); }
  .pr-dock.bad .cbtn.known{ background:var(--bad); box-shadow:0 4px 0 var(--bad-edge); }
  @keyframes dockUp{ from{ transform:translateY(100%);} to{ transform:none; } }

  footer{ text-align:center; color:var(--ink-3); font-size:12px; padding:20px 0 10px; }

  @media (max-width:380px){
    .pill small{ display:none; }
    h1{ font-size:21px; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="title-row">
      <div class="brand">
        <div class="logo" aria-hidden="true">&ldquo;</div>
        <h1>Armanly</h1>
      </div>

        <button class="pill" id="streakPill" type="button"></button>

      </div>
    </div>
    <div class="controls" style="display:none;">
      <i data-ic="search"></i>

    </div>

      <button type="button" data-lib="vocab" class="active">Words</button>
      <button type="button" data-lib="phrases">Phrases</button>
      <button type="button" data-lib="grammar">Grammar</button>

  <main>
    <div class="tabpanel active" id="panel-home"></div>

    <div class="tabpanel" id="panel-vocab"></div>
    <div class="tabpanel" id="panel-phrases"></div>
    <div class="tabpanel" id="panel-grammar"></div>

      <div class="cards-toolbar">
        <div class="toggles">
          <label class="unlearned-toggle"><input type="checkbox" id="dueOnly" /><span>Due today</span></label>
          <label class="unlearned-toggle"><input type="checkbox" id="unlearnedOnly" /><span>Unlearned only</span></label>

            <div class="swipe-label yes">Got it</div>

              <div class="face front">
                <button class="spk big" id="cardSpkFront" type="button" aria-label="Play pronunciation"></button>
                <div class="fc-cat" id="fcCatFront"></div>
                <div class="fc-term" id="fcTerm"></div>
                <div class="fc-pos" id="fcPos"></div>

              </div>

                <div class="fc-meaning fa" id="fcMeaning"></div>
                <div class="fc-example" id="fcExampleRow">
                  <span id="fcExampleText"></span>
                  <button class="spk small" id="cardSpkBack" type="button" aria-label="Play example"></button>
                </div>
                <div class="fc-rel" id="fcRel"></div>
              </div>
            </div>
          </div>

        <button class="rbtn yes" id="markKnown" type="button" aria-label="Got it (swipe right)"><span class="ri"><i data-ic="check"></i></span><span>Got it</span></button>
      </div>
      <div class="cards-nav" id="cardsNav">
        <button class="cbtn ghost sm" id="prevCard" type="button">Previous</button>
        <button class="cbtn ghost sm" id="nextCard" type="button">Skip</button>
      </div>
      <div class="cards-footer-row">
        <button class="linklike" id="shuffleDeck" type="button"><i data-ic="shuffle"></i>Shuffle</button>
        <button class="linklike" id="resetProgress" type="button">Reset card progress</button>
      </div>
      <div class="swipe-tip">Swipe right if you know it, left if you don't. On a keyboard, use the arrow keys.</div>

      <div class="empty" id="cardsEmpty" style="display:none;"></div>
    </div>
    <div class="tabpanel" id="panel-practice"></div>
    <div class="empty" id="emptyMsg" style="display:none;">No matches found. / موردی پیدا نشد.</div>
  </main>

  <footer>Uses your device's built-in voice, so it works offline. Your progress is saved on this device.</footer>
</div>

<nav class="bottombar" id="tabSeg" aria-label="Sections">
  <button data-tab="home" class="active" type="button"><i data-ic="home"></i><span class="tl">Home</span></button>

    var low = text.toLowerCase(), t = (term || "").toLowerCase();

    if (i < 0 && t && t.indexOf(" ") === -1 && t.length >= 5){

    if (i < 0){ node.textContent = text; return; }
    node.appendChild(document.createTextNode(text.slice(0, i)));
    var mk = document.createElement("mark");
    mk.textContent = text.slice(i, i + len);
    node.appendChild(mk);
    node.appendChild(document.createTextNode(text.slice(i + len)));
  }

      card.addEventListener("click", function(){

      grid.appendChild(card);
      allCards.push({ el: card, term: term.toLowerCase(), meaning: meaning, example: (example + " " + info.syn.join(" ") + " " + info.ant.join(" ")).toLowerCase() });
    });

    if (isCustom && rows.length === 0){
      var emptyCard = document.createElement("div");
      emptyCard.className = "card empty-add";
      emptyCard.innerHTML = "<div>Words you add yourself appear here and join your flashcards.</div><b>Add your first word</b>";
      emptyCard.addEventListener("click", function(){ openAddWord(); });
      grid.appendChild(emptyCard);
      allCards.push({ el: emptyCard, term: "", meaning: "", example: "" });
    }
    allSections.push({ el: grid, band: band });

    var chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = titleEn.replace(/^\d+\.\s*/, "");
    chip.style.setProperty("--cc", catColor(ci));
    chip.addEventListener("click", function(){
      if (currentMode === "cards"){
        cardsCatFilter = ci;

  });

  // ============================================================
  // BUILD PHRASES PANEL

  var panelPhrases = document.getElementById("panel-phrases");

  // ============================================================
  // TABS
  // ============================================================
  var VIEWS = ["home", "learn", "cards", "practice", "vocab", "phrases", "grammar"];
  var LIB = { vocab: 1, phrases: 1, grammar: 1 };
  var lastLib = LIB[ui.lib] ? ui.lib : "vocab";
  var tabButtons = document.querySelectorAll("#tabSeg button");
  var libButtons = document.querySelectorAll("#libSeg button");
  // restoring: true when reopening the app, so the saved scroll position is used even for the same view
  function openView(view, restoring){
    if (view === "lib") view = lastLib;
    var prev = currentMode;
    if (uiReady && prev !== view) ui.scroll[prev] = Math.round(window.scrollY);
    currentMode = view;
    if (LIB[view]) lastLib = view;
    VIEWS.forEach(function(v){ document.getElementById("panel-" + v).classList.toggle("active", v === view); });
    var navKey = LIB[view] ? "lib" : view;
    Array.prototype.forEach.call(tabButtons, function(b){ b.classList.toggle("active", b.getAttribute("data-tab") === navKey); });
    Array.prototype.forEach.call(libButtons, function(b){ b.classList.toggle("active", b.getAttribute("data-lib") === view); });
    document.getElementById("libSeg").style.display = LIB[view] ? "" : "none";
    document.querySelector(".controls").style.display = (view === "vocab" || view === "phrases") ? "" : "none";
    chipnav.style.display = (view === "vocab" || view === "cards") ? "flex" : "none";
    chipnav.classList.toggle("mode-cards", view === "cards");
    if (view === "practice") onPracticeTab();
    if (view === "grammar") renderGrammar();
    if (view === "home") renderHomeView();
    if (view === "learn") renderLearn();
    applyFilter();
    updateFocus();
    document.querySelector("footer").hidden = !LIB[view];
    // Each tab keeps its own scroll position; tapping the tab you are on goes back to the top.
    var keepsPlace = view !== "practice" && view !== "cards" && (restoring || view !== prev);
    window.scrollTo(0, keepsPlace ? (ui.scroll[view] || 0) : 0);
    saveUI();
  }

  function saveUI(){
    if (!uiReady) return;
    ui.view = currentMode;
    ui.lib = lastLib;
    ui.grammarOpen = grammarOpen;
    ui.cards = {
      cat: cardsCatFilter, due: cardsDueOnly, unl: cardsUnlearnedOnly, pos: cardsPos,
      order: cardsOrder.map(function(i){ return FLAT[i].key; })
    };
    saveJSON(UI_KEY, ui);
  }
  var scrollSaveT = 0;
  window.addEventListener("scroll", function(){
    if (!uiReady) return;
    clearTimeout(scrollSaveT);
    scrollSaveT = setTimeout(function(){ ui.scroll[currentMode] = Math.round(window.scrollY); saveUI(); }, 300);
  }, { passive: true });
  function saveNow(){ if (uiReady){ ui.scroll[currentMode] = Math.round(window.scrollY); saveUI(); } }
  window.addEventListener("pagehide", saveNow);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") saveNow(); });
  Array.prototype.forEach.call(tabButtons, function(btn){
    btn.addEventListener("click", function(){ sfx("tap"); openView(btn.getAttribute("data-tab")); });
  });
  Array.prototype.forEach.call(libButtons, function(btn){
    btn.addEventListener("click", function(){ sfx("tap"); openView(btn.getAttribute("data-lib")); });
  });

  // ============================================================
  // SEARCH / FILTER
  // ============================================================
  var searchInput = document.getElementById("search");
  var emptyMsg = document.getElementById("emptyMsg");

  function applyFilter(){
    var q = searchInput.value.trim().toLowerCase();
    var activeTab = currentMode;

    if (activeTab !== "vocab" && activeTab !== "phrases" && activeTab !== "cards"){
      emptyMsg.style.display = "none";
      return;
    }
    if (activeTab === "cards"){
      emptyMsg.style.display = "none";
      rebuildDeck(true);
      return;
    }

    var anyVisible = false;

    if (activeTab === "vocab") {
      allSections.forEach(function(sec){ sec.band.style.display = ""; sec.el.style.display = ""; });
      allCards.forEach(function(c){
        var match = !q || c.term.indexOf(q) !== -1 || c.meaning.indexOf(q) !== -1 || c.example.indexOf(q) !== -1;
        c.el.classList.toggle("hide", !match);
        if (match) anyVisible = true;
      });
      // hide empty category sections
      allSections.forEach(function(sec){
        var visibleCount = 0;
        Array.prototype.forEach.call(sec.el.children, function(card){
          if (!card.classList.contains("hide")) visibleCount++;
        });
        var show = visibleCount > 0;
        sec.band.style.display = show ? "" : "none";
        sec.el.style.display = show ? "" : "none";
      });
    } else {
      allPhraseBoxes.forEach(function(pb){
        var match = !q || pb.texts.some(function(t){ return t.indexOf(q) !== -1; });
        pb.el.classList.toggle("hide", !match);
        if (match) anyVisible = true;
      });
    }
    emptyMsg.style.display = anyVisible ? "none" : "block";
  }

  searchInput.addEventListener("input", applyFilter);

  // ============================================================
  // FLASHCARDS
  // ============================================================
  var FLAT = [];
  VOCAB.forEach(function(cat, ci){
    var titleEn = cat[0], titleFa = cat[1], rows = cat[2];
    rows.forEach(function(row){
      FLAT.push({
        ci: ci,
        catEn: titleEn.replace(/^\d+\.\s*/, ""),
        term: row[0], meaning: row[1], example: row[2],
        key: (ci === CUSTOM_CI ? "my" : ci) + "::" + row[0]
      });
      var info = wordInfo(row), f = FLAT[FLAT.length - 1];
      f.pos = info.pos; f.syn = info.syn; f.ant = info.ant;
    });
  });

  var wotdNode = null;
  (function buildWotd(){
    var base = FLAT.filter(function(f){ return f.ci !== CUSTOM_CI; });
    var it = base[Math.floor(Date.now() / 86400000) % base.length];
    var w = document.createElement("div");
    w.className = "wotd"; w.id = "wotd";
    var t = document.createElement("div"); t.className = "wotd-term"; t.textContent = it.term;
    var fa = document.createElement("div"); fa.className = "wotd-fa fa"; fa.textContent = it.meaning;
    var ex = document.createElement("div"); ex.className = "wotd-ex";
    var exs = document.createElement("span"); setMarked(exs, it.example, it.term);
    ex.appendChild(exs); ex.appendChild(makeSpkBtn(it.example, true));
    var big = makeSpkBtn(it.term, false); big.classList.add("big");
    w.appendChild(t); w.appendChild(fa); w.appendChild(ex); w.appendChild(big);
    wotdNode = w;
  })();

  var KNOWN_KEY = "speakLearnKnown";
  var knownSet = {};
  try {
    var savedKnown = JSON.parse(localStorage.getItem(KNOWN_KEY) || "{}");
    if (savedKnown && typeof savedKnown === "object") knownSet = savedKnown;
  } catch (e) {}
  function cardKey(item){ return item.key; }
  function saveKnown(){ try { localStorage.setItem(KNOWN_KEY, JSON.stringify(knownSet)); } catch(e) {} }

  // Spaced repetition (Leitner boxes): each card gets a box and a due date.
  var SRS_KEY = "speakLearnSRS";
  var INTERVALS = [0, 1, 3, 7, 14, 30, 60]; // days per box
  var srs = {};
  try {
    var savedSrs = JSON.parse(localStorage.getItem(SRS_KEY) || "{}");
    if (savedSrs && typeof savedSrs === "object") srs = savedSrs;
  } catch (e) {}
  function saveSrs(){ try { localStorage.setItem(SRS_KEY, JSON.stringify(srs)); } catch(e) {} }
  function dayStr(offsetDays){
    var d = new Date();
    d.setDate(d.getDate() + (offsetDays || 0));
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  function isDue(item){
    var rec = srs[item.key];
    return !rec || rec.d <= dayStr(0);
  }
  function countDue(){
    var n = 0;
    FLAT.forEach(function(item){ if (isDue(item)) n++; });
    return n;
  }

  var cardsCatFilter = "all";
  var cardsUnlearnedOnly = false;
  var cardsDueOnly = false;
  var cardsOrder = [];
  var cardsPos = 0;
  var curTermText = "", curExampleText = "";

  var flashcardEl = document.getElementById("flashcard");
  var fcTerm = document.getElementById("fcTerm");
  var fcCatFront = document.getElementById("fcCatFront");
  var fcMeaning = document.getElementById("fcMeaning");
  var fcExampleText = document.getElementById("fcExampleText");
  var cardsProgress = document.getElementById("cardsProgress");
  var cardsStats = document.getElementById("cardsStats");
  var cardsEmpty = document.getElementById("cardsEmpty");
  var cardStage = document.getElementById("cardStage");
  var cardsControlsEl = document.querySelector(".cards-controls");
  var cardsFooterRowEl = document.querySelector(".cards-footer-row");

  function buildCardsDeck(){
    var q = "";
    var idxs = [];
    FLAT.forEach(function(item, i){
      if (cardsCatFilter !== "all" && item.ci !== cardsCatFilter) return;
      if (cardsUnlearnedOnly && knownSet[cardKey(item)]) return;
      if (cardsDueOnly && !isDue(item)) return;
      if (q && item.term.toLowerCase().indexOf(q) === -1 &&
          item.meaning.indexOf(q) === -1 &&
          item.example.toLowerCase().indexOf(q) === -1) return;
      idxs.push(i);
    });
    return idxs;
  }

  function shuffleArray(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function refreshCardsStats(){
    var knownCount = Object.keys(knownSet).filter(function(k){ return knownSet[k]; }).length;
    cardsStats.textContent = FLAT.length + " cards, " + knownCount + " known, " + countDue() + " due";
  }

  // keepPlace: refresh which cards belong in the deck but stay on the same card, in the same
  // (possibly shuffled) order. Without it the deck starts again from card 1, as after a filter change.
  function rebuildDeck(keepPlace){
    var fresh = buildCardsDeck();
    if (keepPlace && cardsOrder.length){
      var cur = cardsOrder[Math.min(cardsPos, cardsOrder.length - 1)];
      var inFresh = {}, kept = {};
      fresh.forEach(function(i){ inFresh[i] = true; });
      var ordered = cardsOrder.filter(function(i){
        if (!inFresh[i] || kept[i]) return false;
        kept[i] = true;
        return true;
      });
      fresh.forEach(function(i){ if (!kept[i]) ordered.push(i); });
      var at = ordered.indexOf(cur);
      cardsPos = at >= 0 ? at : Math.max(0, Math.min(cardsPos, ordered.length - 1));
      cardsOrder = ordered;
    } else {
      cardsOrder = fresh;
      cardsPos = 0;
    }
    refreshCardsStats();
    showCard();
  }

  var cardsNavEl = document.getElementById("cardsNav");
  var cardsBarEl = document.getElementById("cardsBar");
  var cardsBarFill = document.getElementById("cardsBarFill");
  var swipeYes = flashcardEl.querySelector(".swipe-label.yes");
  var swipeNo = flashcardEl.querySelector(".swipe-label.no");
  var swipeTipEl = document.querySelector(".swipe-tip");
  var flying = false;
  var THRESH = 90;

  function setCardsVisible(v){
    cardStage.style.display = v ? "flex" : "none";
    cardsControlsEl.style.display = v ? "flex" : "none";
    cardsNavEl.style.display = v ? "flex" : "none";
    cardsFooterRowEl.style.display = v ? "flex" : "none";
    cardsBarEl.style.display = v ? "" : "none";
    swipeTipEl.style.display = v ? "" : "none";
  }

  function showCard(){
    flashcardEl.classList.remove("flipped", "fly", "spring", "dragging");
    flashcardEl.style.transform = "";
    flashcardEl.style.opacity = "";
    swipeYes.style.opacity = 0;
    swipeNo.style.opacity = 0;
    flying = false;
    if (cardsOrder.length === 0){
      setCardsVisible(false);
      cardsProgress.textContent = "";
      cardsEmpty.style.display = "block";
      cardsEmpty.textContent = cardsDueOnly
        ? "Nothing is due right now, so you are done for today. Turn off \"Due today\" to keep practising."
        : cardsUnlearnedOnly
        ? "Every word here is marked as known. Turn off \"Unlearned only\" to review them again."
        : "No cards in this category yet.";
      saveUI();
      return;
    }
    setCardsVisible(true);
    cardsEmpty.style.display = "none";

    var item = FLAT[cardsOrder[cardsPos]];
    curTermText = item.term;
    curExampleText = item.example;
    flashcardEl.style.setProperty("--cc", catColor(item.ci));
    fcTerm.textContent = item.term;
    fcCatFront.textContent = item.catEn;
    fcMeaning.textContent = item.meaning;
    fcExampleText.textContent = item.example;
    var fcPos = document.getElementById("fcPos"), fcRel = document.getElementById("fcRel");
    fcPos.textContent = POS_NAMES[item.pos] || "";
    fcPos.hidden = !item.pos;
    fcRel.textContent = "";
    if (item.syn.length || item.ant.length) fcRel.appendChild(wordFacts({ pos: "", syn: item.syn, ant: item.ant }, "on-color"));
    fcRel.hidden = !(item.syn.length || item.ant.length);

    var known = !!knownSet[cardKey(item)];
    flashcardEl.classList.toggle("is-known", known);
    cardsProgress.textContent = "Card " + (cardsPos + 1) + " of " + cardsOrder.length + (known ? ", known" : "");
    cardsBarFill.style.width = ((cardsPos + 1) / cardsOrder.length * 100) + "%";

    flashcardEl.classList.remove("enter");
    void flashcardEl.offsetWidth;
    flashcardEl.classList.add("enter");
    setTimeout(function(){ flashcardEl.classList.remove("enter"); }, 450);
    saveUI();
  }

  function flipCardNow(){
    flashcardEl.classList.toggle("flipped");
    sfx("flip");
  }

  // ---- drag / swipe ----
  var drag = null;
  flashcardEl.setAttribute("tabindex", "0");
  flashcardEl.setAttribute("role", "button");
  flashcardEl.setAttribute("aria-label", "Flashcard. Press Enter to flip, left arrow if still learning, right arrow if you got it.");
  flashcardEl.addEventListener("pointerdown", function(e){
    if (flying || (e.target.closest && e.target.closest(".spk"))) return;
    drag = { x: e.clientX, y: e.clientY, dx: 0, moved: false, id: e.pointerId };
    flashcardEl.classList.remove("spring");
    flashcardEl.classList.add("dragging");
    try { flashcardEl.setPointerCapture(e.pointerId); } catch (_) {}
  });
  flashcardEl.addEventListener("pointermove", function(e){
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x;
    var dy = e.clientY - drag.y;
    if (Math.abs(drag.dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
    if (!drag.moved) return;
    flashcardEl.style.transform = "translate(" + drag.dx + "px," + (dy * 0.25) + "px) rotate(" + (drag.dx * 0.06) + "deg)";
    var p = Math.min(1, Math.abs(drag.dx) / THRESH);
    swipeYes.style.opacity = drag.dx > 0 ? p : 0;
    swipeNo.style.opacity = drag.dx < 0 ? p : 0;
  });
  function endDrag(e, cancelled){
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var d = drag;
    drag = null;
    flashcardEl.classList.remove("dragging");
    if (!d.moved){
      if (!cancelled) flipCardNow();
      return;
    }
    if (!cancelled && Math.abs(d.dx) > THRESH){
      flyOut(d.dx > 0);
    } else {
      flashcardEl.classList.add("spring");
      flashcardEl.style.transform = "";
      swipeYes.style.opacity = 0;
      swipeNo.style.opacity = 0;
    }
  }
  flashcardEl.addEventListener("pointerup", function(e){ endDrag(e, false); });
  flashcardEl.addEventListener("pointercancel", function(e){ endDrag(e, true); });
  flashcardEl.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){
      e.preventDefault();
      flipCardNow();
    }
  });
  document.addEventListener("keydown", function(e){
    if (!document.getElementById("panel-cards").classList.contains("active")) return;
    var tg = e.target && e.target.tagName;
    if (tg === "INPUT" || tg === "TEXTAREA") return;
    if (e.key === "ArrowRight"){ e.preventDefault(); flyOut(true); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); flyOut(false); }
  });

  document.getElementById("cardSpkFront").innerHTML = SPK_ICON;
  document.getElementById("cardSpkBack").innerHTML = SPK_ICON;
  document.getElementById("cardSpkFront").addEventListener("click", function(e){
    e.stopPropagation(); speak(curTermText, this);
  });
  document.getElementById("cardSpkBack").addEventListener("click", function(e){
    e.stopPropagation(); speak(curExampleText, this);
  });
  document.getElementById("flipCard").addEventListener("click", flipCardNow);

  // ---- answering ----
  function commitCard(known){
    var item = FLAT[cardsOrder[cardsPos]], key = cardKey(item);
    var r = dayRec();
    if (known){
      knownSet[key] = true;
      saveKnown();
      var rec = srs[key] || { b: 0, d: dayStr(0) };
      rec.b = Math.min(rec.b + 1, INTERVALS.length - 1);
      rec.d = dayStr(INTERVALS[rec.b]);
      srs[key] = rec;
    } else {
      if (knownSet[key]){ delete knownSet[key]; saveKnown(); }
      srs[key] = { b: 0, d: dayStr(0) };
    }
    saveSrs();
    game.stats.cards++;
    r.cards++;
    noteActivity(1);
    award(known ? 5 : 2, flashcardEl);
    if (r.cards === 10) completeMission("cards");
    refreshCardsStats();
    renderHero();
  }
  function flyOut(known){
    if (flying || cardsOrder.length === 0) return;
    flying = true;
    var w = Math.max(window.innerWidth, 500);
    var rect = flashcardEl.getBoundingClientRect();
    flashcardEl.classList.remove("dragging", "spring", "enter");
    flashcardEl.classList.add("fly");
    flashcardEl.style.transform = "translate(" + (known ? w : -w) + "px,-30px) rotate(" + (known ? 28 : -28) + "deg)";
    (known ? swipeYes : swipeNo).style.opacity = 1;
    sfx(known ? "yes" : "no");
    buzz(known ? 12 : [10, 30, 10]);
    commitCard(known);
    setTimeout(function(){

  var audioCtx = null;
  function tone(f, s, d, type, v){
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(v, s + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, s + d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(s); o.stop(s + d + 0.03);
  }
  function sfx(name){
    if (!soundOn) return;
    try {
      if (!audioCtx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      var t = audioCtx.currentTime;
      if (name === "correct"){ tone(660, t, 0.12, "triangle", 0.2); tone(990, t + 0.1, 0.2, "triangle", 0.2); }
      else if (name === "wrong"){ tone(230, t, 0.18, "sawtooth", 0.09); tone(170, t + 0.14, 0.28, "sawtooth", 0.09); }
      else if (name === "flip"){ tone(540, t, 0.06, "square", 0.05); tone(720, t + 0.05, 0.06, "square", 0.04); }
      else if (name === "yes"){ tone(520, t, 0.08, "triangle", 0.18); tone(780, t + 0.07, 0.14, "triangle", 0.18); }
      else if (name === "no"){ tone(320, t, 0.1, "triangle", 0.14); tone(250, t + 0.08, 0.14, "triangle", 0.14); }
      else if (name === "tap"){ tone(820, t, 0.04, "sine", 0.07); }
      else if (name === "goal" || name === "badge" || name === "level"){
        [523, 659, 784, 1047, 1319].forEach(function(f, i){ tone(f, t + i * 0.09, 0.22, "triangle", 0.17); });
      }
    } catch (e) {}
  }

  var fxCanvas = null, fxCtx = null, parts = [], fxRaf = 0;
  var CONF_COLORS = ["#3B5BFF", "#FFE566", "#0E9AA0", "#8B5CF6", "#F5A800", "#D6457F"]; // canvas needs literal colours: --cat-1, --mark, --cat-2, --cat-3, --sun, --cat-6
  function fxResize(){
    var dpr = window.devicePixelRatio || 1;
    fxCanvas.width = window.innerWidth * dpr;
    fxCanvas.height = window.innerHeight * dpr;
    fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function confetti(x, y, n, spread){
    if (reduceMotion) return;
    try {
      if (!fxCanvas){
        fxCanvas = document.createElement("canvas");
        fxCanvas.id = "fx";
        document.body.appendChild(fxCanvas);
        fxCtx = fxCanvas.getContext("2d");
      }
      fxResize();
      n = n || 60;
      for (var i = 0; i < n; i++){
        var a = -Math.PI / 2 + (Math.random() - 0.5) * (spread || 2.4);
        var sp = 5 + Math.random() * 9;
        parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.28 + Math.random() * 0.12,
          r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
          c: CONF_COLORS[i % CONF_COLORS.length], life: 90 + Math.random() * 50 });
      }
      if (!fxRaf) fxRaf = requestAnimationFrame(fxStep);
    } catch (e) {}
  }
  function fxStep(){
    fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    parts = parts.filter(function(p){ return p.life > 0 && p.y < window.innerHeight + 30; });
    parts.forEach(function(p){
      p.vy += p.g; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      fxCtx.save();
      fxCtx.translate(p.x, p.y); fxCtx.rotate(p.r);
      fxCtx.globalAlpha = Math.min(1, p.life / 30);
      fxCtx.fillStyle = p.c;
      fxCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      fxCtx.restore();
    });
    if (parts.length) fxRaf = requestAnimationFrame(fxStep);
    else { fxRaf = 0; fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }
  function bigConfetti(){ confetti(window.innerWidth / 2, window.innerHeight * 0.62, 90, 3.0); }
