      setTimeout(function(){ try { speak(q.speakText, playBtn, 0.92); input.focus(); } catch (e) {} }, 300);
    }
    practiceEl.appendChild(fb);
    if (q.kind === "mcq"){
      var c2 = el("div", "cards-controls");
      c2.style.marginTop = "14px";
      c2.appendChild(nextB);
      practiceEl.appendChild(c2);
    }
  }

  function renderResults(){
    clearPractice();
    game.stats.sessions++;
    var n = session.qs.length, score = session.correct;
    var perfect = (score === n && n >= 5);
    var r = dayRec();
    var firstDaily = false;
    if (session.mode === "daily"){ r.daily++; firstDaily = (r.daily === 1); }
    saveGame();
    if (perfect){ game.stats.perfect++; session.xp += 20; award(20); }

    var top = el("div", "pr-top");
    var x = btn("xbtn", "✕", renderHome);
    x.setAttribute("aria-label", "Back to practice");
    top.appendChild(x);
    top.appendChild(el("span", "pr-top-title", session.title + " · Results"));
    practiceEl.appendChild(top);

    var card = el("div", "pr-card center");
    card.appendChild(el("div", "mascot", score === n ? "🏆" : score >= n * 0.7 ? "🎉" : "💪"));
    card.appendChild(el("div", "pr-score", score + " / " + n));
    card.appendChild(el("div", "pr-xp", "+" + session.xp + " XP" + (perfect ? " (perfect bonus!)" : "")));
    var msg = score === n ? "Perfect. Come back tomorrow to keep the streak alive."
            : score >= n * 0.7 ? "Good work. Review the ones you missed below."
            : "Keep going. Repetition is how these expressions stick.";
    var mm = el("div", "pr-fb-note", msg);
    mm.style.marginTop = "12px";
    card.appendChild(mm);
    var done = todayCount();
    card.appendChild(el("div", "pr-goal-text", Math.min(done, DAILY_GOAL) + " / " + DAILY_GOAL + " done today · " + currentStreak() + "-day streak"));
    practiceEl.appendChild(card);

    if (score >= n * 0.7){ sfx("goal"); bigConfetti(); }

    if (session.missed.length){
      var box = el("div", "pr-card");
      box.appendChild(el("div", "pr-tag", "Review these"));
      session.missed.forEach(function(q){
        var row = el("div", "phrase-row");
        row.appendChild(el("div", "txt", q.review.replace(/[\[\]]/g, "")));
        row.appendChild(makeSpkBtn(q.speakText, true));
        box.appendChild(row);
      });
      practiceEl.appendChild(box);
    }
    var ctr = el("div", "cards-controls");
    ctr.style.marginTop = "16px";
    ctr.style.gap = "10px";
    ctr.appendChild(btn("cbtn known", "Another round", function(){ startSession(session.mode); }));
    if (session.mode === "daily") ctr.appendChild(btn("cbtn sun", "Bonus: speaking drill", renderSpeakMenu));
    ctr.appendChild(btn("cbtn ghost", "Back", renderHome));
    practiceEl.appendChild(ctr);

    if (firstDaily) setTimeout(function(){ completeMission("daily"); }, 600);
    var lvNow = levelFor(game.xp);
    if (lvNow > session.lvl0){
      setTimeout(function(){
        celebrate({ emoji: "🚀", title: "Level " + lvNow + "!", sub: "You're now a " + levelName(lvNow) + ". Great work today!", btn: "Awesome" });
      }, firstDaily ? 1800 : 900);
    }
  }

  // ---------- speaking ----------
  function speakDone(originEl){
    noteActivity(5);
    game.stats.speak++;
    var r = dayRec();
    r.speak++;
    saveGame();
    sfx("goal");
    confetti(window.innerWidth / 2, window.innerHeight * 0.55, 70, 2.8);
    award(25, originEl);
    if (r.speak === 1) completeMission("speak");
  }

  function addTopBar(title, right){
    var bar = el("div", "pr-top");
    var back = btn("xbtn", "←", renderHome);
    back.setAttribute("aria-label", "Back to practice");
    bar.appendChild(back);
    bar.appendChild(el("span", "pr-top-title", title));
    if (right) bar.appendChild(el("span", "pr-top-right", right));
    practiceEl.appendChild(bar);
  }

  function renderSpeakMenu(){
    clearPractice();
    addTopBar("Speaking drill", null);
    var wrap = el("div", "pr-modes");
    function modeCard(icon, color, title, time, desc, label, primary, fn){
      var c = el("div", "pr-mode" + (primary ? " primary" : ""));
      c.style.setProperty("--cc", color);
      var h = el("div", "pr-mode-head");
      h.appendChild(el("div", "pr-mode-ico", icon));
      var tx = el("div", "pr-mode-text");
      tx.appendChild(el("span", "pr-mode-title", title));
      tx.appendChild(el("span", "pr-mode-time", time));
      h.appendChild(tx);
      c.appendChild(h);
      c.appendChild(el("div", "pr-mode-desc", desc));
      c.appendChild(btn(primary ? "cbtn known" : "cbtn", label, function(e){ e.stopPropagation(); fn(); }));
      c.addEventListener("click", fn);
      return c;
    }
    wrap.appendChild(modeCard("🗣️", "#F0584A", "Argue a topic", "60 s prep + 90 s speak", "A debate topic plus three expressions you must use. Same format as your Putting It All Together class.", "Start", true, topicDrill));
    wrap.appendChild(modeCard("⚡", "#F5A300", "Quick-fire starters", "5 x 30 s", "Five sentence starters from class. Finish each one out loud and keep talking until the timer ends.", "Start", false, quickFire));
    practiceEl.appendChild(wrap);
  }

  function topicDrill(){
    clearPractice();
    addTopBar("Argue a topic", null);
    var topic = pick(DEBATE_TOPICS);
    var targets = sample(TARGET_EXPR, 3);
    var opener = pick(OPENERS);
    var card = el("div", "pr-card");
    card.appendChild(el("div", "pr-tag", "Topic"));
    card.appendChild(el("div", "pr-topic", topic));
    card.appendChild(el("div", "pr-tag", "Use these expressions"));
    var list = el("div", "pr-targets");
    targets.forEach(function(t){
      var r = el("div", "pr-target");
      r.appendChild(el("span", null, t));
      r.appendChild(makeSpkBtn(t.replace(/\b[XY]\b/g, "something"), true));
      list.appendChild(r);
    });
    card.appendChild(list);
    card.appendChild(el("div", "pr-tag", "Try opening with"));
    var op = el("div", "pr-target");
    op.appendChild(el("span", null, opener));
    op.appendChild(makeSpkBtn(opener.replace(/…/g, "..."), true));
    card.appendChild(op);
    var phase = el("div", "pr-phase", "You get 60 seconds to prepare, then speak for about 90 seconds.");
    var clock = el("div", "pr-clock", "01:00");
    card.appendChild(phase);
    card.appendChild(clock);
    var ctr = el("div", "cards-controls");
    ctr.style.gap = "10px"; ctr.style.marginTop = "14px";
    var startB = btn("cbtn known", "Start", startPrep);
    var skipB = btn("cbtn", "Skip prep", startSpeak);
    var stopB = btn("cbtn", "Finish early", finish);
    var newB = btn("cbtn ghost", "New topic", topicDrill);
    skipB.hidden = true; stopB.hidden = true;
    ctr.appendChild(startB); ctr.appendChild(skipB); ctr.appendChild(stopB); ctr.appendChild(newB);
    card.appendChild(ctr);
    practiceEl.appendChild(card);

    function startPrep(){
      startB.hidden = true; newB.hidden = true; skipB.hidden = false;
      phase.textContent = "Prepare your argument. Plan where each expression fits.";
      clock.classList.remove("speaking");
      runTimer(60, function(t){ clock.textContent = fmt(t); }, startSpeak);
    }
    function startSpeak(){
      skipB.hidden = true; startB.hidden = true; newB.hidden = true; stopB.hidden = false;
      phase.textContent = "Speak now. Out loud!";
      clock.classList.add("speaking");
      runTimer(90, function(t){ clock.textContent = fmt(t); }, finish);
    }
    function finish(){
      clearTimer();
      clock.classList.remove("speaking");
      skipB.hidden = true; stopB.hidden = true; startB.hidden = true; newB.hidden = true;
      phase.textContent = "Time. Be honest: which did you use?";
      var checks = el("div", "pr-checks");
      var items = targets.concat([opener]);
      items.forEach(function(t, i){
        var lab = el("label", "pr-check");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = "usedChk" + i;
        lab.appendChild(cb);
        lab.appendChild(el("span", null, t));
        checks.appendChild(lab);
      });
      card.appendChild(checks);
      var ctr2 = el("div", "cards-controls");
      ctr2.style.gap = "10px"; ctr2.style.marginTop = "14px";
      ctr2.appendChild(btn("cbtn known", "Done", function(e){ speakDone(e.currentTarget); setTimeout(renderHome, 700); }));
      ctr2.appendChild(btn("cbtn", "Another topic", function(e){ speakDone(e.currentTarget); topicDrill(); }));
      card.appendChild(ctr2);
    }
  }

  function quickFire(){
    clearPractice();
    addTopBar("Quick-fire starters", null);
    var items = sample(DRILL_STARTERS, 5), idx = 0;
    var card = el("div", "pr-card center");
    var tag = el("div", "pr-tag", "");
    var starter = el("div", "pr-topic", "");
    var phase = el("div", "pr-phase", "");
    var clock = el("div", "pr-clock", "");
    var ctr = el("div", "cards-controls");
    ctr.style.gap = "10px"; ctr.style.marginTop = "14px";
    var skipB = btn("cbtn", "Next starter", function(){ idx++; next(); });
    ctr.appendChild(skipB);
    card.appendChild(tag); card.appendChild(starter); card.appendChild(phase); card.appendChild(clock); card.appendChild(ctr);
    practiceEl.appendChild(card);
    next();

    function next(){
      clearTimer();
      if (idx >= items.length){
        tag.textContent = "Finished";
        starter.textContent = "Nice work. Five starters done.";
        phase.textContent = "";
        clock.textContent = "🎉";
        clock.classList.remove("speaking");
        ctr.removeChild(skipB);
        speakDone(null);
        ctr.appendChild(btn("cbtn known", "Again", quickFire));
        ctr.appendChild(btn("cbtn ghost", "Back", renderHome));
        return;
      }
      tag.textContent = "Starter " + (idx + 1) + " / " + items.length;
      starter.textContent = items[idx];
      phase.textContent = "Get ready";
      clock.classList.remove("speaking");
      runTimer(5, function(t){ clock.textContent = fmt(t); }, function(){
        phase.textContent = "Finish the sentence out loud and keep talking";
        clock.classList.add("speaking");
        runTimer(25, function(t){ clock.textContent = fmt(t); }, function(){ idx++; next(); });
      });
    }
  }

  function onPracticeTab(){
    if (practiceEl.getAttribute("data-view") !== "other") renderHome();
  }

  renderHero();
  renderHome();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
