<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E9E90">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speak & Learn">
<title>Speak & Learn</title>
<meta name="description" content="Interactive English vocabulary and collocations glossary with click-to-hear pronunciation and Persian meanings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EE; --surface:#FFFFFF; --surface-alt:#FFF0D9;
    --ink:#2B2340; --ink-soft:#6B6385;
    --accent:#0E9E90; --accent-dark:#097A6F; --accent-ink:#FFFFFF;
    --accent-2:#F5A300; --accent-2-dark:#C98200;
    --coral:#F0584A; --coral-dark:#C23F33;
    --violet:#7C5CFF; --sky:#2584E8; --pink:#DB3F8F;
    --border:#EADFCB; --edge:#E2D3B6;
    --shadow: 0 2px 0 rgba(43,35,64,.04), 0 10px 24px rgba(43,35,64,.07);
    --good:#1F9D63; --bad:#E5484D;
    --cc:#0E9E90;
    padding-top:env(safe-area-inset-top,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17132A; --surface:#231D3D; --surface-alt:#2D2650;
      --ink:#F4F0FF; --ink-soft:#B3A9D1;
      --accent:#2DD4BF; --accent-dark:#14958A; --accent-ink:#062B27;
      --accent-2:#FFC53D; --accent-2-dark:#C99410;
      --coral:#FF7A6B; --coral-dark:#C2493D;
      --violet:#9B84FF; --sky:#5BB0FF; --pink:#FF74B4;
      --border:#3A3166; --edge:#120F22;
      --shadow: 0 2px 0 rgba(0,0,0,.2), 0 10px 24px rgba(0,0,0,.4);
      --good:#4CCB8D; --bad:#FF7A80;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17132A; --surface:#231D3D; --surface-alt:#2D2650;
    --ink:#F4F0FF; --ink-soft:#B3A9D1;
    --accent:#2DD4BF; --accent-dark:#14958A; --accent-ink:#062B27;
    --accent-2:#FFC53D; --accent-2-dark:#C99410;
    --coral:#FF7A6B; --coral-dark:#C2493D;
    --violet:#9B84FF; --sky:#5BB0FF; --pink:#FF74B4;
    --border:#3A3166; --edge:#120F22;
    --shadow: 0 2px 0 rgba(0,0,0,.2), 0 10px 24px rgba(0,0,0,.4);
    --good:#4CCB8D; --bad:#FF7A80;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Nunito","Inter",-apple-system,sans-serif; font-weight:600;
    padding-inline:16px;
    background-image:
      radial-gradient(circle at 12% -10%, color-mix(in srgb, var(--accent) 16%, transparent) 0, transparent 38%),
      radial-gradient(circle at 98% 4%, color-mix(in srgb, var(--accent-2) 18%, transparent) 0, transparent 34%);
    background-repeat:no-repeat;
  }
  .wrap{ max-width:900px; margin:0 auto; }
  .fa{ font-family:"Vazirmatn","Nunito",sans-serif; direction:rtl; unicode-bidi:isolate; }
  button{ font-family:inherit; }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px);
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    padding-block:12px 8px; margin-inline:-16px; padding-inline:16px;
    z-index:20;
  }
  .title-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .logo{
    width:44px; height:44px; border-radius:14px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:26px;
    background:linear-gradient(145deg,var(--accent),var(--violet));
    box-shadow:0 4px 0 var(--accent-dark); transform:rotate(-6deg);
  }
  h1{
    font-family:"Nunito",sans-serif; font-weight:900; font-size:clamp(20px,5vw,26px);
    margin:0; letter-spacing:-0.02em; line-height:1.05;
  }
  h1 em{ font-style:normal; color:var(--accent); }
  .sub{ color:var(--ink-soft); font-size:12.5px; margin:2px 0 0 0; font-weight:700; }
  .tools{ display:flex; gap:6px; align-items:center; flex:none; }
  .tool-btn, .accent-toggle{
    border:2px solid var(--border); border-bottom-width:4px; background:var(--surface); color:var(--ink);
    border-radius:12px; height:38px; min-width:38px; padding:0 10px; font-size:16px; font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:4px;
    transition:transform .1s ease, border-color .15s;
  }
  .accent-toggle{ font-size:13px; }
  .tool-btn:hover, .accent-toggle:hover{ border-color:var(--accent); }
  .tool-btn:active, .accent-toggle:active{ transform:translateY(2px); border-bottom-width:2px; }

  .controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .search{
    flex:1 1 220px; min-width:0;
    background:var(--surface); border:2px solid var(--border); border-radius:16px;
    padding:11px 16px; font-size:15px; color:var(--ink); font-weight:700;
    font-family:inherit;
  }
  .search::placeholder{ color:var(--ink-soft); opacity:.8; }
  .search:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }

  /* ---------- Category chip nav ---------- */
  .chipnav{
    display:flex; gap:8px; overflow-x:auto; padding:10px 2px 6px 2px;
    scrollbar-width:none;
  }
  .chipnav::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none; font-size:13px; font-weight:800; color:var(--ink);
    background:var(--surface); border:2px solid var(--border); border-bottom-width:4px; border-radius:999px;
    padding:6px 14px; cursor:pointer; white-space:nowrap;
    transition:transform .1s ease;
  }
  .chip[style*="--cc"]::before{ content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--cc); margin-right:7px; }
  .chip:hover{ border-color:var(--cc, var(--accent)); }
  .chip:active{ transform:translateY(2px); border-bottom-width:2px; }
  .chip.active, #chipnav.mode-cards .chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent-dark); }
  .chip.active::before{ background:var(--accent-ink) !important; }

  main{ padding-bottom:120px; }

  /* ---------- Hero stats ---------- */
  .hero{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0 6px; }
  .hstat{
    background:var(--surface); border:2px solid var(--border); border-bottom-width:5px; border-radius:20px;
    padding:10px 6px 9px; display:flex; flex-direction:column; align-items:center; gap:1px;
    cursor:pointer; color:var(--ink); min-width:0;
    transition:transform .1s ease, border-color .15s;
  }
  .hstat:hover{ border-color:var(--accent); }
  .hstat:active{ transform:translateY(3px); border-bottom-width:2px; }
  .hstat b{ font-weight:900; font-size:16px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .hstat small{ font-size:11px; color:var(--ink-soft); font-weight:800; }
  .hstat .hico{ font-size:30px; line-height:44px; height:44px; display:block; }
  .hstat.streak b{ font-size:20px; }
  .hstat.streak.on{ border-color:#FFB86B; }
  .hstat.streak.on .hico{ animation:flame 1.6s ease-in-out infinite; transform-origin:50% 90%; }
  .hstat.daily.done{ border-color:var(--accent-2); }
  .ring{ width:44px; height:44px; display:block; }
  .ring circle{ fill:none; stroke-width:5; }
  .ring .bg{ stroke:var(--surface-alt); }
  .ring .fg{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
  .ring.gold .fg{ stroke:var(--accent-2); }
  .ring.violet .fg{ stroke:var(--violet); }
  .ring text{ font-weight:900; font-size:14px; fill:var(--ink); font-family:"Nunito",sans-serif; }
  @keyframes flame{ 0%,100%{ transform:scale(1) rotate(-3deg);} 50%{ transform:scale(1.12) rotate(3deg);} }

  /* ---------- Section band ---------- */
  .band{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--cc); color:#fff;
    border-radius:18px; padding:11px 16px; margin:26px 0 12px 0;
    box-shadow:0 4px 0 color-mix(in srgb, var(--cc) 65%, #000);
    scroll-margin-top:170px;
  }
  .band .en{ font-weight:900; font-size:16px; display:flex; align-items:center; gap:8px; }
  .band .bico{ font-size:20px; }
  .band .fa{ color:rgba(255,255,255,.92); font-size:13px; font-weight:700; }

  /* ---------- Word of the day ---------- */
  .wotd{
    margin-top:14px; padding:16px 18px; border-radius:24px; position:relative; color:#fff; overflow:hidden;
    background:linear-gradient(140deg, color-mix(in srgb, var(--cc) 82%, #000), color-mix(in srgb, var(--cc) 48%, var(--violet)));
    box-shadow:0 5px 0 color-mix(in srgb, var(--cc) 55%, #000);
  }
  .wotd::after{ content:"✨"; position:absolute; right:68px; top:8px; font-size:22px; opacity:.55; animation:twinkle 2.4s ease-in-out infinite; }
  .wotd-tag{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:900; opacity:.9; }
  .wotd-term{ font-weight:900; font-size:clamp(22px,6vw,30px); margin:4px 0 2px; padding-right:48px; }
  .wotd-fa{ font-size:15px; font-weight:700; opacity:.95; }
  .wotd-ex{ margin-top:8px; font-size:13.5px; font-style:italic; opacity:.95; display:flex; gap:8px; align-items:flex-start; }
  .wotd-ex span{ flex:1; }
  .wotd .spk{ background:rgba(255,255,255,.22); color:#fff; border-color:rgba(255,255,255,.45); }
  .wotd .spk.big{ position:absolute; top:12px; right:12px; }
  @keyframes twinkle{ 0%,100%{ transform:scale(.8) rotate(0); opacity:.3;} 50%{ transform:scale(1.15) rotate(15deg); opacity:.8;} }

  /* ---------- Vocab cards ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;
  }
  .card{
    background:var(--surface); border:2px solid var(--border); border-bottom-width:5px; border-radius:20px;
    padding:13px 15px 14px; cursor:pointer;
    display:flex; flex-direction:column; gap:8px;
    position:relative; transition:transform .12s ease, border-color .15s;
  }
  .card::before{ content:""; position:absolute; left:14px; top:-2px; width:34px; height:5px; border-radius:0 0 6px 6px; background:var(--cc); }
  .card:hover{ transform:translateY(-2px); border-color:var(--cc); }
  .card:active{ transform:translateY(2px); border-bottom-width:3px; }
  .card.hide{ display:none; }
  .card.bump{ animation:bump .35s ease; }
  @keyframes bump{ 0%{transform:scale(1);} 40%{transform:scale(1.035) rotate(-.6deg);} 100%{transform:scale(1);} }
  .term-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
  .term{ font-weight:900; font-size:17px; color:var(--ink); line-height:1.25; }
  .meaning{
    color:var(--ink); font-size:14.5px; font-weight:700;
    background:color-mix(in srgb, var(--cc) 12%, var(--surface)); border-radius:12px; padding:7px 11px;
  }
  .example{ font-style:italic; color:var(--ink-soft); font-size:13px; line-height:1.5; display:flex; gap:6px; align-items:flex-start; font-weight:600; }
  .example .ex-text{ flex:1; }

  .spk{
    flex:none; width:34px; height:34px; border-radius:999px; border:2px solid var(--border); border-bottom-width:4px;
    background:var(--surface); color:var(--cc, var(--accent)); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:transform .1s ease, background .15s;
  }
  .spk:hover{ border-color:var(--cc, var(--accent)); }
  .spk:active{ transform:translateY(2px); border-bottom-width:2px; }
  .spk.small{ width:26px; height:26px; border-bottom-width:3px; }
  .spk.playing{ background:var(--cc, var(--accent)); color:#fff; animation:pulse 0.9s ease-in-out infinite; }
  .spk svg{ width:15px; height:15px; }
  .spk.small svg{ width:12px; height:12px; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--cc, var(--accent)) 50%, transparent);} 50%{ box-shadow:0 0 0 7px transparent;} }

  /* ---------- Phrase list ---------- */
  .phrase-box{
    background:var(--surface); border:2px solid var(--border); border-bottom-width:5px; border-radius:22px;
    padding:12px 14px 6px; margin-bottom:14px;
  }
  .phrase-box .band{ margin:0 0 6px 0; padding:9px 14px; }
  .phrase-box.hide{ display:none; }
  .phrase-row{
    display:flex; align-items:flex-start; gap:10px; padding:10px 0;
    border-bottom:2px dashed var(--border);
  }
  .phrase-row:last-child{ border-bottom:none; }
  .phrase-row .txt{ flex:1; font-size:15px; color:var(--ink); line-height:1.45; font-weight:800; }
  .phrase-fa{ font-size:13px; color:var(--ink-soft); margin-top:3px; font-weight:600; }

  .tabpanel{ display:none; }
  .tabpanel.active{ display:block; animation:rise .35s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }

  .empty{ color:var(--ink-soft); font-size:15px; padding:30px 4px; text-align:center; font-weight:700; line-height:1.6; }

  /* ---------- Buttons ---------- */
  .cbtn{
    border:2px solid var(--border); border-bottom-width:5px; background:var(--surface); color:var(--ink);
    font-weight:900; font-size:14.5px; padding:11px 20px; border-radius:16px; cursor:pointer;
    transition:transform .1s ease, filter .15s;
  }
  .cbtn:hover{ filter:brightness(1.04); }
  .cbtn:active{ transform:translateY(3px); border-bottom-width:2px; }
  .cbtn:disabled{ opacity:.5; cursor:default; }
  .cbtn.ghost{ background:transparent; border-color:transparent; border-bottom-width:2px; color:var(--ink-soft); padding:10px 14px; }
  .cbtn.ghost:hover{ color:var(--accent); }
  .cbtn.known{ background:var(--accent); border-color:var(--accent-dark); color:var(--accent-ink); }
  .cbtn.learning{ background:var(--coral); border-color:var(--coral-dark); color:#fff; }
  .cbtn.sun{ background:var(--accent-2); border-color:var(--accent-2-dark); color:#3a2700; }
  .cbtn.block{ width:100%; font-size:16px; padding:14px 20px; }
  .linklike{ border:none; background:none; color:var(--ink-soft); font-size:13px; font-weight:800; text-decoration:underline; cursor:pointer; padding:6px; }
  .linklike:hover{ color:var(--accent); }
  .xbtn{
    width:38px; height:38px; flex:none; border-radius:12px; border:2px solid var(--border); border-bottom-width:4px;
    background:var(--surface); color:var(--ink-soft); font-size:16px; font-weight:900; cursor:pointer;
  }
  .xbtn:hover{ color:var(--coral); border-color:var(--coral); }
  .xbtn:active{ transform:translateY(2px); border-bottom-width:2px; }

  /* ---------- Flashcards ---------- */
  .cards-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:12px 0 2px; flex-wrap:wrap; font-size:13px; color:var(--ink-soft); font-weight:800;
  }
  .toggles{ display:flex; gap:8px; flex-wrap:wrap; }
  .unlearned-toggle{
    display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none; font-weight:800; color:var(--ink);
    background:var(--surface); border:2px solid var(--border); border-bottom-width:4px; border-radius:999px; padding:5px 13px 5px 10px;
  }
  .unlearned-toggle:has(input:checked){ background:var(--accent); border-color:var(--accent-dark); color:var(--accent-ink); }
  .unlearned-toggle input{ accent-color:var(--accent-dark); width:16px; height:16px; margin:0; }
  .cards-stats{ font-variant-numeric:tabular-nums; }

  .stage{ display:flex; justify-content:center; padding:20px 0 6px; }
  .deck{ position:relative; width:100%; max-width:380px; height:clamp(240px, 38vh, 310px); }
  .deck::before, .deck::after{
    content:""; position:absolute; inset:0; border-radius:28px; background:var(--surface);
    border:2px solid var(--border); border-bottom-width:5px;
  }
  .deck::before{ transform:translateY(14px) scale(.9); opacity:.55; }
  .deck::after{ transform:translateY(7px) scale(.95); opacity:.85; }
  .flashcard{
    position:absolute; inset:0; z-index:2; perspective:1400px; cursor:grab; outline:none;
    touch-action:pan-y; user-select:none; -webkit-user-select:none; will-change:transform;
  }
  .flashcard.dragging{ cursor:grabbing; }
  .flashcard.fly{ transition:transform .28s cubic-bezier(.5,0,.8,.4), opacity .28s ease; opacity:.0; }
  .flashcard.spring{ transition:transform .35s cubic-bezier(.3,1.6,.5,1); }
  .flashcard.enter{ animation:cardIn .4s cubic-bezier(.3,1.4,.5,1) backwards; }
  @keyframes cardIn{ from{ transform:translateY(24px) scale(.9); opacity:0;} to{ transform:none; opacity:1;} }
  .flashcard:focus-visible .face{ outline:3px solid var(--accent-2); outline-offset:3px; }
  .fc-inner{
    position:absolute; inset:0; transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.3,1.25,.5,1);
  }
  .flashcard.flipped .fc-inner{ transform:rotateY(180deg); }
  .flashcard .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:28px; border:2px solid var(--border); border-bottom-width:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:28px 24px; text-align:center;
  }
  .flashcard .front{
    color:#fff; border-color:color-mix(in srgb, var(--cc) 60%, #000);
    background:linear-gradient(155deg, color-mix(in srgb, var(--cc) 84%, #000), color-mix(in srgb, var(--cc) 55%, var(--violet)));
  }
  .flashcard .back{ transform:rotateY(180deg); background:var(--surface); color:var(--ink); border-color:var(--cc); }
  .fc-cat{ font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:900; opacity:.9; }
  .flashcard.is-known .fc-cat::after{ content:"  ✓ known"; }
  .fc-term{ font-weight:900; font-size:clamp(24px,7vw,34px); line-height:1.2; }
  .fc-hint{ font-size:12px; opacity:.85; position:absolute; bottom:16px; font-weight:800; }
  .fc-meaning{ font-size:24px; font-weight:800; line-height:1.5; }
  .fc-example{
    font-style:italic; color:var(--ink-soft); font-size:14px; line-height:1.5;
    display:flex; align-items:flex-start; gap:8px; font-weight:600;
  }
  .flashcard .back .spk{ color:var(--cc); }
  .flashcard .spk.big{
    position:absolute; top:14px; right:14px; width:42px; height:42px;
    background:rgba(255,255,255,.22); color:#fff; border-color:rgba(255,255,255,.5);
  }
  .flashcard .spk.big svg{ width:18px; height:18px; }
  .swipe-label{
    position:absolute; top:22px; z-index:6; padding:5px 12px; border:3px solid; border-radius:12px;
    font-weight:900; font-size:15px; letter-spacing:.05em; background:var(--surface); opacity:0; pointer-events:none;
  }
  .swipe-label.yes{ left:18px; color:var(--good); border-color:var(--good); transform:rotate(-12deg); }
  .swipe-label.no{ right:18px; color:var(--coral); border-color:var(--coral); transform:rotate(12deg); }

  .cards-bar{ max-width:380px; margin:16px auto 0; }
  .cards-progress{
    text-align:center; font-size:13px; color:var(--ink-soft); margin-top:8px; font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .cards-controls{ display:flex; align-items:flex-start; justify-content:center; gap:22px; margin-top:12px; flex-wrap:wrap; }
  .rbtn{
    display:flex; flex-direction:column; align-items:center; gap:6px; border:none; background:none; cursor:pointer; color:var(--ink-soft);
    font-size:12px; font-weight:900;
  }
  .rbtn .ri{
    width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:900; border:2px solid; border-bottom-width:6px; background:var(--surface);
    transition:transform .1s ease, border-bottom-width .1s;
  }
  .rbtn:active .ri{ transform:translateY(4px); border-bottom-width:2px; }
  .rbtn.no .ri{ color:var(--coral); border-color:var(--coral); }
  .rbtn.yes .ri{ color:var(--good); border-color:var(--good); }
  .rbtn.flip .ri{ color:var(--sky); border-color:var(--sky); width:50px; height:50px; font-size:20px; margin-top:6px; }
  .rbtn:hover .ri{ background:color-mix(in srgb, currentColor 10%, var(--surface)); }
  .cards-nav{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:6px; }
  .cards-footer-row{ display:flex; justify-content:center; gap:18px; margin-top:6px; }
  .swipe-tip{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:12px; font-weight:700; }

  /* ---------- Bottom tab bar ---------- */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; justify-content:center; gap:4px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb, var(--surface) 94%, transparent);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-top:2px solid var(--border);
  }
  .bottombar button{
    flex:1 1 0; max-width:150px; border:2px solid transparent; background:transparent; color:var(--ink-soft);
    border-radius:18px; padding:6px 4px 5px; cursor:pointer; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:1px; font-weight:900;
    transition:background .2s, transform .12s;
  }
  .bottombar .ti{ font-size:24px; line-height:1.15; filter:grayscale(.85); opacity:.75; transition:transform .25s cubic-bezier(.3,1.8,.5,1), filter .2s; }
  .bottombar .tl{ font-size:11.5px; }
  .bottombar button:active{ transform:scale(.94); }
  .bottombar button.active{ color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .bottombar button.active .ti{ filter:none; opacity:1; transform:translateY(-2px) scale(1.18); }
  .tbadge{
    position:absolute; top:1px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px;
    background:var(--coral); color:#fff; font-size:11px; line-height:18px; font-weight:900; text-align:center;
  }
  .tbadge[hidden]{ display:none; }

  /* ---------- Practice ---------- */
  .mascot-row{ display:flex; align-items:flex-end; gap:12px; margin:16px 0 4px; }
  .mascot{ font-size:56px; line-height:1; flex:none; animation:hop 2.8s ease-in-out infinite; transform-origin:50% 100%; }
  @keyframes hop{ 0%,70%,100%{ transform:translateY(0) rotate(0);} 78%{ transform:translateY(-12px) rotate(-6deg);} 88%{ transform:translateY(0) rotate(4deg);} }
  .bubble{
    position:relative; background:var(--surface); border:2px solid var(--border); border-bottom-width:5px;
    border-radius:20px 20px 20px 6px; padding:11px 15px; font-weight:800; font-size:14.5px; line-height:1.45; flex:1;
  }
  .pr-hero{
    background:var(--surface); border:2px solid var(--border); border-bottom-width:5px; border-radius:24px;
    padding:16px 18px; margin-top:14px;
  }
  .pr-hero-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .pr-streak{ font-weight:900; font-size:19px; }
  .lvl-chip{ display:flex; align-items:center; gap:6px; font-weight:900; font-size:13px; background:color-mix(in srgb, var(--violet) 16%, var(--surface)); color:var(--violet); border-radius:999px; padding:5px 12px; border:2px solid color-mix(in srgb, var(--violet) 40%, transparent); }
  .pr-goal-text{ color:var(--ink-soft); font-size:13px; margin:2px 0 10px; font-variant-numeric:tabular-nums; font-weight:800; }
  .pbar{ height:14px; background:var(--surface-alt); border-radius:999px; overflow:hidden; position:relative; }
  .pbar-fill{
    height:100%; background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--sky)));
    border-radius:999px; transition:width .5s cubic-bezier(.2,.9,.3,1); position:relative; min-width:14px;
  }
  .pbar-fill::after{ content:""; position:absolute; left:8px; right:8px; top:3px; height:4px; border-radius:4px; background:rgba(255,255,255,.35); }
  .pbar.gold .pbar-fill{ background:linear-gradient(90deg, var(--accent-2), #FFD76A); }
  .mission{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:2px dashed var(--border); }
  .mission:first-child{ border-top:none; }
  .m-ico{
    width:42px; height:42px; border-radius:14px; flex:none; display:flex; align-items:center; justify-content:center; font-size:22px;
    background:var(--surface-alt);
  }
  .mission.done .m-ico{ background:var(--good); color:#fff; font-weight:900; }
  .m-body{ flex:1; min-width:0; }
  .m-title{ font-weight:900; font-size:14.5px; }
  .mission.done .m-title{ text-decoration:line-through; opacity:.6; }
  .m-sub{ font-size:12px; color:var(--ink-soft); font-weight:800; }
  .m-xp{ font-size:12px; font-weight:900; color:var(--accent-2-dark); background:color-mix(in srgb, var(--accent-2) 22%, var(--surface)); padding:3px 8px; border-radius:999px; flex:none; }
  .mission .cbtn{ padding:7px 14px; font-size:13px; border-bottom-width:4px; }
  .pr-due{ display:none; }
  .pr-sect{ margin:22px 2px 8px; font-weight:900; font-size:15px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; font-size:12.5px; }
  .pr-modes{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .pr-mode{
    background:var(--surface); border:2px solid var(--border); border-bottom-width:5px; border-radius:22px;
    padding:14px; display:flex; flex-direction:column; gap:8px; align-items:stretch; position:relative;
    transition:transform .12s ease, border-color .15s; cursor:pointer;
  }
  .pr-mode:hover{ transform:translateY(-2px); border-color:var(--cc, var(--accent)); }
  .pr-mode:active{ transform:translateY(2px); border-bottom-width:3px; }
  .pr-mode.primary{ border-color:var(--cc, var(--accent)); background:color-mix(in srgb, var(--cc, var(--accent)) 8%, var(--surface)); }
  .pr-mode-head{ display:flex; align-items:center; gap:12px; width:100%; }
  .pr-mode-ico{
    width:46px; height:46px; border-radius:15px; flex:none; display:flex; align-items:center; justify-content:center; font-size:24px;
    background:var(--cc, var(--accent)); box-shadow:0 3px 0 color-mix(in srgb, var(--cc, var(--accent)) 60%, #000);
  }
  .pr-mode-text{ flex:1; min-width:0; }
  .pr-mode-title{ font-weight:900; font-size:16px; display:block; }
  .pr-mode-time{ font-size:12px; color:var(--ink-soft); font-weight:800; }
  .pr-mode-desc{ font-size:13px; color:var(--ink-soft); line-height:1.5; flex:1; font-weight:600; }
  .pr-tip{ margin-top:18px; font-size:12.5px; color:var(--ink-soft); text-align:center; font-weight:700; }

  .pr-top{ display:flex; align-items:center; gap:12px; margin:14px 0 12px; }
  .pr-top .pbar{ flex:1; }
  .pr-top-title{ font-weight:900; font-size:15px; flex:1; }
  .pr-top-right{ font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; font-weight:900; }
  .combo{ font-weight:900; font-size:13px; color:#fff; background:linear-gradient(90deg,var(--coral),var(--accent-2)); padding:3px 10px; border-radius:999px; animation:pop .35s ease; }
  .combo[hidden]{ display:none; }
  @keyframes pop{ 0%{ transform:scale(.6);} 60%{ transform:scale(1.2);} 100%{ transform:scale(1);} }
  .pr-card{
    background:var(--surface); border:2px solid var(--border); border-bottom-width:5px; border-radius:24px;
    padding:20px; margin-top:12px; animation:rise .3s ease both;
  }
  .pr-card.center{ text-align:center; }
  .pr-tag{ font-size:12px; color:var(--violet); text-transform:uppercase; letter-spacing:.08em; margin:12px 0 6px; font-weight:900; }
  .pr-tag:first-child{ margin-top:0; }
  .pr-prompt{ font-size:19px; line-height:1.5; font-weight:800; margin-bottom:16px; }
  .pr-prompt.small{ font-size:14.5px; font-weight:700; color:var(--ink-soft); }
  .pr-opts{ display:grid; gap:10px; counter-reset:o; }
  .pr-opt{
    text-align:left; font-size:15.5px; font-weight:800; padding:12px 14px; border-radius:16px; cursor:pointer;
    background:var(--surface); color:var(--ink); border:2px solid var(--border); border-bottom-width:5px;
    display:flex; align-items:center; gap:12px; transition:transform .1s ease, border-color .15s, background .15s;
  }
  .pr-opt::before{
    counter-increment:o; content:counter(o, upper-alpha); flex:none; width:28px; height:28px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;
    border:2px solid var(--border); color:var(--ink-soft);
  }
  .pr-opt:hover:not(:disabled){ border-color:var(--sky); background:color-mix(in srgb, var(--sky) 8%, var(--surface)); }
  .pr-opt:active:not(:disabled){ transform:translateY(3px); border-bottom-width:2px; }
  .pr-opt:focus-visible{ outline:3px solid var(--accent-2); outline-offset:2px; }
  .pr-opt.right{ border-color:var(--good); background:color-mix(in srgb, var(--good) 16%, var(--surface)); animation:pop .4s ease; }
  .pr-opt.right::before{ content:"✓"; background:var(--good); border-color:var(--good); color:#fff; }
  .pr-opt.wrong{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface)); animation:shake .4s ease; }
  .pr-opt.wrong::before{ content:"✗"; background:var(--bad); border-color:var(--bad); color:#fff; }
  .pr-opt:disabled{ cursor:default; color:var(--ink); opacity:1; }
  .pr-opt:disabled:not(.right):not(.wrong){ opacity:.55; }
  @keyframes shake{ 0%,100%{ transform:translateX(0);} 20%{ transform:translateX(-7px);} 40%{ transform:translateX(7px);} 60%{ transform:translateX(-5px);} 80%{ transform:translateX(5px);} }
  .pr-feedback{
    margin-top:14px; padding:14px 16px; border-radius:20px; background:var(--surface-alt);
    border:2px solid var(--border); animation:rise .3s ease both;
  }
  .pr-feedback.good{ background:color-mix(in srgb, var(--good) 14%, var(--surface)); border-color:var(--good); }
  .pr-feedback.bad{ background:color-mix(in srgb, var(--bad) 12%, var(--surface)); border-color:var(--bad); }
  .pr-fb-head{ font-weight:900; font-size:16px; }
  .pr-fb-head.good{ color:var(--good); }
  .pr-fb-head.bad{ color:var(--bad); }
  .pr-fb-note{ font-size:13.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5; font-weight:700; }
  .pr-fb-sentence{ display:flex; align-items:flex-start; gap:8px; margin-top:8px; font-style:italic; font-size:14px; font-weight:700; }
  .pr-fb-sentence span{ flex:1; }
  .pr-play{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .spk.big-inline{ width:54px; height:54px; }
  .spk.big-inline svg{ width:24px; height:24px; }
  .pr-input{
    width:100%; font-size:16px; padding:13px 16px; border-radius:16px; font-weight:700; font-family:inherit;
    background:var(--surface); color:var(--ink); border:2px solid var(--border);
  }
  .pr-input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  .pr-diff{ margin-top:8px; font-size:16px; line-height:1.8; font-weight:700; }
  .w-ok{ color:var(--good); }
  .w-miss{ color:var(--bad); text-decoration:underline wavy; }
  .pr-score{ font-weight:900; font-size:56px; line-height:1.1; }
  .pr-xp{ display:inline-block; margin-top:8px; font-weight:900; font-size:16px; color:#3a2700; background:var(--accent-2); padding:5px 16px; border-radius:999px; box-shadow:0 3px 0 var(--accent-2-dark); animation:pop .5s ease .2s both; }
  .pr-topic{ font-size:18px; line-height:1.5; font-weight:800; }
  .pr-targets{ display:grid; gap:6px; }
  .pr-target{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:15px; font-weight:800; padding:8px 0; border-bottom:2px dashed var(--border); }
  .pr-target:last-child{ border-bottom:none; }
  .pr-phase{ margin-top:14px; font-size:14px; color:var(--ink-soft); text-align:center; font-weight:800; }
  .pr-clock{ font-weight:900; font-size:56px; text-align:center; font-variant-numeric:tabular-nums; line-height:1.2; }
  .pr-clock.speaking{ color:var(--coral); animation:beat 1s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }
  .pr-checks{ display:grid; gap:8px; margin-top:12px; }
  .pr-check{ display:flex; align-items:center; gap:10px; font-size:15px; cursor:pointer; font-weight:800; }
  .pr-check input{ accent-color:var(--accent); width:20px; height:20px; }

  /* ---------- Effects: toast, xp float, modal, confetti ---------- */
  #fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:300; }
  .toast-wrap{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:0; right:0; z-index:250; display:grid; justify-items:center; gap:8px; pointer-events:none; padding:0 12px; }
  .toast{
    display:flex; align-items:center; gap:12px; background:var(--ink); color:var(--bg); border-radius:20px; padding:10px 18px 10px 12px;
    box-shadow:0 8px 30px rgba(0,0,0,.28); max-width:420px; animation:toastIn .45s cubic-bezier(.3,1.5,.5,1) both;
  }
  .toast.out{ animation:toastOut .3s ease forwards; }
  .toast .t-ico{ font-size:30px; line-height:1; }
  .toast .t-title{ font-weight:900; font-size:14.5px; }
  .toast .t-sub{ font-weight:700; font-size:12.5px; opacity:.8; }
  @keyframes toastIn{ from{ transform:translateY(-40px) scale(.9); opacity:0;} to{ transform:none; opacity:1;} }
  @keyframes toastOut{ to{ transform:translateY(-30px); opacity:0;} }
  .xp-float{
    position:fixed; z-index:260; pointer-events:none; font-weight:900; font-size:20px; color:var(--accent-2);
    text-shadow:0 2px 0 rgba(0,0,0,.35); animation:floatUp 1.1s ease-out forwards; transform:translate(-50%,-50%);
  }
  @keyframes floatUp{ 0%{ opacity:0; transform:translate(-50%,-10%) scale(.7);} 15%{ opacity:1; transform:translate(-50%,-50%) scale(1.15);} 100%{ opacity:0; transform:translate(-50%,-190%) scale(1);} }
  .modal{
    position:fixed; inset:0; z-index:200; background:rgba(24,12,46,.55); display:flex; align-items:flex-end; justify-content:center;
    animation:fade .2s ease both; padding:0;
  }
  @keyframes fade{ from{ opacity:0;} to{ opacity:1;} }
  .sheet{
    background:var(--bg); width:100%; max-width:560px; max-height:88vh; overflow:auto; border-radius:28px 28px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px)); animation:sheetUp .35s cubic-bezier(.2,.9,.3,1) both;
    border:2px solid var(--border); border-bottom:none;
  }
  @keyframes sheetUp{ from{ transform:translateY(60px); opacity:0;} to{ transform:none; opacity:1;} }
  @media (min-width:640px){
    .modal{ align-items:center; }
    .sheet{ border-radius:28px; border-bottom:2px solid var(--border); }
  }
  .sheet-head{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .sheet-head .ring{ width:72px; height:72px; }
  .sheet-head .ring text{ font-size:15px; }
  .sheet-title{ font-weight:900; font-size:22px; line-height:1.15; }
  .sheet-sub{ color:var(--ink-soft); font-size:13px; font-weight:800; }
  .sheet h3{ margin:18px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-weight:900; }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-cell{ background:var(--surface); border:2px solid var(--border); border-bottom-width:4px; border-radius:16px; padding:10px 6px; text-align:center; }
  .stat-cell b{ display:block; font-size:20px; font-weight:900; }
  .stat-cell small{ color:var(--ink-soft); font-size:11px; font-weight:800; }
  .badge-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .badge{
    background:var(--surface); border:2px solid var(--border); border-bottom-width:5px; border-radius:18px; padding:12px 8px; text-align:center;
  }
  .badge .b-ico{ font-size:34px; display:block; line-height:1.2; }
  .badge .b-t{ font-weight:900; font-size:13px; margin-top:4px; }
  .badge .b-d{ font-weight:700; font-size:11.5px; color:var(--ink-soft); margin-top:2px; line-height:1.35; }
  .badge.locked{ opacity:.55; }
  .badge.locked .b-ico{ filter:grayscale(1); }
  .badge.got{ border-color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 12%, var(--surface)); }
  .celebrate{
    background:var(--surface); border:2px solid var(--border); border-bottom-width:6px; border-radius:30px;
    padding:28px 26px 22px; text-align:center; max-width:340px; margin:auto; animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;
  }
  .modal.center{ align-items:center; padding:20px; }
  .celebrate .c-emoji{ font-size:72px; line-height:1.1; animation:hop 2s ease-in-out infinite; display:block; }
  .celebrate .c-title{ font-weight:900; font-size:26px; margin:8px 0 4px; }
  .celebrate .c-sub{ color:var(--ink-soft); font-weight:700; font-size:14.5px; margin-bottom:16px; line-height:1.5; }

  footer{
    text-align:center; color:var(--ink-soft); font-size:12px; padding:18px 0 10px 0; font-weight:700;
  }
  a.credit{ color:var(--accent); text-decoration:none; }

  @media (max-width:480px){
    .sub{ display:none; }
    .hstat b{ font-size:14.5px; }
    .rbtn .ri{ width:58px; height:58px; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="title-row">
      <div class="brand">
        <div class="logo" aria-hidden="true">🦜</div>
        <div>
          <h1>Speak <em>&amp;</em> Learn</h1>
          <p class="sub">Tap anything to hear it. Learn a little every day.</p>
        </div>
      </div>
      <div class="tools">
        <button class="tool-btn" id="soundToggle" type="button" aria-label="Toggle sound effects" title="Sound effects">🔔</button>
        <button class="tool-btn" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Dark / light">🌙</button>
        <button class="accent-toggle" id="accentToggle" type="button" title="Toggle pronunciation accent">🇺🇸 US</button>
      </div>
    </div>
    <div class="controls">
      <input class="search" id="search" type="text" placeholder="Search a word, meaning, or phrase… / جستجو…" />
    </div>
    <div class="chipnav" id="chipnav"></div>
  </header>

  <section class="hero" id="hero" aria-label="Your progress"></section>

  <main>
    <div class="tabpanel active" id="panel-vocab"></div>
    <div class="tabpanel" id="panel-phrases"></div>
    <div class="tabpanel" id="panel-cards">
      <div class="cards-toolbar">
        <div class="toggles">
          <label class="unlearned-toggle">
            <input type="checkbox" id="dueOnly" />
            <span>Due today</span>
          </label>
          <label class="unlearned-toggle">
            <input type="checkbox" id="unlearnedOnly" />
            <span>Unlearned only</span>
          </label>
        </div>
        <span class="cards-stats" id="cardsStats"></span>
      </div>

      <div class="stage" id="cardStage">
        <div class="deck">
          <div class="flashcard" id="flashcard">
            <div class="swipe-label yes">GOT IT</div>
            <div class="swipe-label no">AGAIN</div>
            <div class="fc-inner">
              <div class="face front">
                <button class="spk big" id="cardSpkFront" type="button" aria-label="Play pronunciation"></button>
                <div class="fc-cat" id="fcCatFront"></div>
                <div class="fc-term" id="fcTerm"></div>
                <div class="fc-hint">Tap to flip · swipe to answer</div>
              </div>
              <div class="face back">
                <div class="fc-meaning fa" id="fcMeaning"></div>
                <div class="fc-example" id="fcExampleRow">
                  <span id="fcExampleText"></span>
                  <button class="spk small" id="cardSpkBack" type="button" aria-label="Play example"></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="cards-bar" id="cardsBar">
        <div class="pbar"><div class="pbar-fill" id="cardsBarFill" style="width:0%"></div></div>
        <div class="cards-progress" id="cardsProgress"></div>
      </div>

      <div class="cards-controls">
        <button class="rbtn no" id="markLearning" type="button" aria-label="Still learning (swipe left)"><span class="ri">✗</span><span>Still learning</span></button>
        <button class="rbtn flip" id="flipCard" type="button" aria-label="Flip card"><span class="ri">↻</span><span>Flip</span></button>
        <button class="rbtn yes" id="markKnown" type="button" aria-label="Got it (swipe right)"><span class="ri">✓</span><span>Got it</span></button>
      </div>
      <div class="cards-nav" id="cardsNav">
        <button class="cbtn ghost" id="prevCard" type="button" aria-label="Previous card">◀ Prev</button>
        <button class="cbtn ghost" id="nextCard" type="button" aria-label="Next card">Next ▶</button>
      </div>
      <div class="cards-footer-row">
        <button class="linklike" id="shuffleDeck" type="button">🔀 Shuffle deck</button>
        <button class="linklike" id="resetProgress" type="button">Reset progress</button>
      </div>
      <div class="swipe-tip">Tip: swipe right if you know it, left if you don't. On a computer use the arrow keys.</div>

      <div class="empty" id="cardsEmpty" style="display:none;"></div>
    </div>
    <div class="tabpanel" id="panel-practice"></div>
    <div class="empty" id="emptyMsg" style="display:none;">No matches found. / موردی پیدا نشد.</div>
  </main>

  <footer>
    Uses your device's built-in voice, so it works offline.

  var CAT_ICONS = ["🗣️", "🏙️", "🕊️", "⚠️", "🏛️", "🤝", "🧠", "💭", "❤️", "📜", "🧱", "🥊", "🎭"];
  var PHRASE_ICONS = ["🚀", "🤔", "👍", "🙅", "🎯", "🤝", "🔍", "🧩", "📖", "🔗", "🏁"];
  var currentAccent = "en-US";

  document.getElementById("accentToggle").addEventListener("click", function(){

  var activeBtn = null;
  function speak(text, btn, rate){
    try {
      if (!("speechSynthesis" in window)) {
        toast("🔇", "No voice available", "Your browser doesn't support spoken pronunciation.", 3500);
        return;
      }
      window.speechSynthesis.cancel();
      if (activeBtn) activeBtn.classList.remove("playing");
      var u = new SpeechSynthesisUtterance(text);
      u.lang = currentAccent;
      u.rate = rate || 0.92;
      if (btn) {
        btn.classList.add("playing");
        activeBtn = btn;
        u.onend = function(){ btn.classList.remove("playing"); };
        u.onerror = function(){ btn.classList.remove("playing"); };
      }
      window.speechSynthesis.speak(u);
    } catch (e) { /* no-op */ }
  }

  var SPK_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v8.06a4.5 4.5 0 0 0 2.5-4.03z"/></svg>';

  function makeSpkBtn(text, small){
    var b = document.createElement("button");
    b.className = "spk" + (small ? " small" : "");
    b.type = "button";
    b.setAttribute("aria-label", "Play pronunciation");

  VOCAB.forEach(function(cat, ci){

    var grid = document.createElement("div");

    grid.style.setProperty("--cc", CAT_COLORS[ci % CAT_COLORS.length]);
    panelVocab.appendChild(grid);

    rows.forEach(function(row){
      var term = row[0], meaning = row[1], example = row[2];
      var card = document.createElement("div");
      card.className = "card";

      var termRow = document.createElement("div");
      termRow.className = "term-row";

      card.appendChild(termRow);

      var meaningDiv = document.createElement("div");

      meaningDiv.textContent = meaning;
      card.appendChild(meaningDiv);

      var exDiv = document.createElement("div");
      exDiv.className = "example";
      var exText = document.createElement("span");
      exText.className = "ex-text";
      exText.textContent = example;
      exDiv.appendChild(exText);
      exDiv.appendChild(makeSpkBtn(example, true));

      card.addEventListener("click", function(){
        speak(term, null);
        card.classList.remove("bump"); void card.offsetWidth; card.classList.add("bump");
      });
      grid.appendChild(card);
      allCards.push({ el: card, term: term.toLowerCase(), meaning: meaning, example: example.toLowerCase() });
    });

    allSections.push({ el: grid, band: band });

    var chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = titleEn.replace(/^\d+\.\s*/, "");
    chip.style.setProperty("--cc", CAT_COLORS[ci % CAT_COLORS.length]);
    chip.addEventListener("click", function(){
      if (currentMode === "cards"){
        cardsCatFilter = ci;

  var panelPhrases = document.getElementById("panel-phrases");

  PHRASES.forEach(function(cat, pi){
    var titleEn = cat[0], titleFa = cat[1], items = cat[2];

    box.appendChild(head);

    var texts = [];
    items.forEach(function(pair){

      var row = document.createElement("div");

      txt.className = "txt";
      txt.textContent = phrase;
      var fa = document.createElement("div");
      fa.className = "phrase-fa fa";
      fa.textContent = meaningFa;
      txt.appendChild(fa);
      row.appendChild(txt);
      row.appendChild(makeSpkBtn(phrase.replace(/…/g, "..."), true));
      box.appendChild(row);
      texts.push(phrase.toLowerCase() + " " + meaningFa);

    panelPhrases.appendChild(box);
    allPhraseBoxes.push({ el: box, texts: texts });

  var tabButtons = document.querySelectorAll("#tabSeg button");

      window.scrollTo({ top: 0 });

  // ============================================================
  // SEARCH / FILTER

  var searchInput = document.getElementById("search");
  var emptyMsg = document.getElementById("emptyMsg");

  function applyFilter(){
    var q = searchInput.value.trim().toLowerCase();
    var activeTab = document.querySelector("#tabSeg button.active").getAttribute("data-tab");
    var wd = document.getElementById("wotd");
    if (wd) wd.style.display = q ? "none" : "";

    if (activeTab === "practice"){
      emptyMsg.style.display = "none";
      return;
    }
    if (activeTab === "cards"){
      emptyMsg.style.display = "none";
      rebuildDeck();
      return;
    }

    var anyVisible = false;

    if (activeTab === "vocab") {
      allSections.forEach(function(sec){ sec.band.style.display = ""; sec.el.style.display = ""; });
      allCards.forEach(function(c){
        var match = !q || c.term.indexOf(q) !== -1 || c.meaning.indexOf(q) !== -1 || c.example.indexOf(q) !== -1;
        c.el.classList.toggle("hide", !match);
        if (match) anyVisible = true;
      });
      // hide empty category sections
      allSections.forEach(function(sec){
        var visibleCount = 0;
        Array.prototype.forEach.call(sec.el.children, function(card){
          if (!card.classList.contains("hide")) visibleCount++;
        });
        var show = visibleCount > 0;
        sec.band.style.display = show ? "" : "none";
        sec.el.style.display = show ? "" : "none";
      });
    } else {
      allPhraseBoxes.forEach(function(pb){
        var match = !q || pb.texts.some(function(t){ return t.indexOf(q) !== -1; });
        pb.el.classList.toggle("hide", !match);
        if (match) anyVisible = true;
      });
    }
    emptyMsg.style.display = anyVisible ? "none" : "block";
  }

  searchInput.addEventListener("input", applyFilter);

  // ============================================================
  // FLASHCARDS
  // ============================================================
  var FLAT = [];
  VOCAB.forEach(function(cat, ci){
    var titleEn = cat[0], titleFa = cat[1], rows = cat[2];
    rows.forEach(function(row){
      FLAT.push({
        ci: ci,
        catEn: titleEn.replace(/^\d+\.\s*/, ""),
        term: row[0], meaning: row[1], example: row[2],
        key: ci + "::" + row[0]
      });
    });
  });

  (function buildWotd(){
    var it = FLAT[Math.floor(Date.now() / 86400000) % FLAT.length];
    var w = document.createElement("div");
    w.className = "wotd"; w.id = "wotd";
    w.style.setProperty("--cc", CAT_COLORS[it.ci % CAT_COLORS.length]);
    var tag = document.createElement("div"); tag.className = "wotd-tag"; tag.textContent = "Word of the day";
    var t = document.createElement("div"); t.className = "wotd-term"; t.textContent = it.term;
    var fa = document.createElement("div"); fa.className = "wotd-fa fa"; fa.textContent = it.meaning;
    var ex = document.createElement("div"); ex.className = "wotd-ex";
    var exs = document.createElement("span"); exs.textContent = it.example;
    ex.appendChild(exs); ex.appendChild(makeSpkBtn(it.example, true));
    var big = makeSpkBtn(it.term, false); big.classList.add("big");
    w.appendChild(tag); w.appendChild(t); w.appendChild(fa); w.appendChild(ex); w.appendChild(big);
    panelVocab.insertBefore(w, panelVocab.firstChild);
  })();

  var KNOWN_KEY = "speakLearnKnown";
  var knownSet = {};
  try {
    var savedKnown = JSON.parse(localStorage.getItem(KNOWN_KEY) || "{}");
    if (savedKnown && typeof savedKnown === "object") knownSet = savedKnown;
  } catch (e) {}
  function cardKey(item){ return item.key; }
  function saveKnown(){ try { localStorage.setItem(KNOWN_KEY, JSON.stringify(knownSet)); } catch(e) {} }

  // Spaced repetition (Leitner boxes): each card gets a box and a due date.
  var SRS_KEY = "speakLearnSRS";
  var INTERVALS = [0, 1, 3, 7, 14, 30, 60]; // days per box
  var srs = {};
  try {
    var savedSrs = JSON.parse(localStorage.getItem(SRS_KEY) || "{}");
    if (savedSrs && typeof savedSrs === "object") srs = savedSrs;
  } catch (e) {}
  function saveSrs(){ try { localStorage.setItem(SRS_KEY, JSON.stringify(srs)); } catch(e) {} }
  function dayStr(offsetDays){
    var d = new Date();
    d.setDate(d.getDate() + (offsetDays || 0));
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  function isDue(item){
    var rec = srs[item.key];
    return !rec || rec.d <= dayStr(0);
  }
  function countDue(){
    var n = 0;
    FLAT.forEach(function(item){ if (isDue(item)) n++; });
    return n;
  }

  var cardsCatFilter = "all";
  var cardsUnlearnedOnly = false;
  var cardsDueOnly = false;
  var cardsOrder = [];
  var cardsPos = 0;
  var curTermText = "", curExampleText = "";

  var flashcardEl = document.getElementById("flashcard");
  var fcTerm = document.getElementById("fcTerm");
  var fcCatFront = document.getElementById("fcCatFront");
  var fcMeaning = document.getElementById("fcMeaning");
  var fcExampleText = document.getElementById("fcExampleText");
  var cardsProgress = document.getElementById("cardsProgress");
  var cardsStats = document.getElementById("cardsStats");
  var cardsEmpty = document.getElementById("cardsEmpty");
  var cardStage = document.getElementById("cardStage");
  var cardsControlsEl = document.querySelector(".cards-controls");
  var cardsFooterRowEl = document.querySelector(".cards-footer-row");

  function buildCardsDeck(){
    var q = "";
    var idxs = [];
    FLAT.forEach(function(item, i){
      if (cardsCatFilter !== "all" && item.ci !== cardsCatFilter) return;
      if (cardsUnlearnedOnly && knownSet[cardKey(item)]) return;
      if (cardsDueOnly && !isDue(item)) return;
      if (q && item.term.toLowerCase().indexOf(q) === -1 &&
          item.meaning.indexOf(q) === -1 &&
          item.example.toLowerCase().indexOf(q) === -1) return;
      idxs.push(i);
    });
    return idxs;
  }

  function shuffleArray(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function refreshCardsStats(){
    var knownCount = Object.keys(knownSet).filter(function(k){ return knownSet[k]; }).length;
    cardsStats.textContent = FLAT.length + " cards · " + knownCount + " known · " + countDue() + " due";
  }

  function rebuildDeck(){
    cardsOrder = buildCardsDeck();
    cardsPos = 0;
    refreshCardsStats();
    showCard();
  }

  var cardsNavEl = document.getElementById("cardsNav");
  var cardsBarEl = document.getElementById("cardsBar");
  var cardsBarFill = document.getElementById("cardsBarFill");
  var swipeYes = flashcardEl.querySelector(".swipe-label.yes");
  var swipeNo = flashcardEl.querySelector(".swipe-label.no");
  var swipeTipEl = document.querySelector(".swipe-tip");
  var flying = false;
  var THRESH = 90;

  function setCardsVisible(v){
    cardStage.style.display = v ? "flex" : "none";
    cardsControlsEl.style.display = v ? "flex" : "none";
    cardsNavEl.style.display = v ? "flex" : "none";
    cardsFooterRowEl.style.display = v ? "flex" : "none";
    cardsBarEl.style.display = v ? "" : "none";
    swipeTipEl.style.display = v ? "" : "none";
  }

  function showCard(){
    flashcardEl.classList.remove("flipped", "fly", "spring", "dragging");
    flashcardEl.style.transform = "";
    flashcardEl.style.opacity = "";
    swipeYes.style.opacity = 0;
    swipeNo.style.opacity = 0;
    flying = false;
    if (cardsOrder.length === 0){
      setCardsVisible(false);
      cardsProgress.textContent = "";
      cardsEmpty.style.display = "block";
      cardsEmpty.textContent = cardsDueOnly
        ? "🎉 Nothing due right now. You're done for today! Come back tomorrow, or turn off \"Due today\" to keep practicing."
        : cardsUnlearnedOnly
        ? "🎉 All matching words are marked as known! Turn off \"Unlearned only\" to review them again."
        : "No cards match.";
      return;
    }
    setCardsVisible(true);
    cardsEmpty.style.display = "none";

    var item = FLAT[cardsOrder[cardsPos]];
    curTermText = item.term;
    curExampleText = item.example;
    flashcardEl.style.setProperty("--cc", CAT_COLORS[item.ci % CAT_COLORS.length]);
    fcTerm.textContent = item.term;
    fcCatFront.textContent = item.catEn;
    fcMeaning.textContent = item.meaning;
    fcExampleText.textContent = item.example;

    var known = !!knownSet[cardKey(item)];
    flashcardEl.classList.toggle("is-known", known);
    cardsProgress.textContent = "Card " + (cardsPos + 1) + " of " + cardsOrder.length + (known ? " · ✓ known" : "");
    cardsBarFill.style.width = ((cardsPos + 1) / cardsOrder.length * 100) + "%";

    flashcardEl.classList.remove("enter");
    void flashcardEl.offsetWidth;
    flashcardEl.classList.add("enter");
    setTimeout(function(){ flashcardEl.classList.remove("enter"); }, 450);
  }

  function flipCardNow(){
    flashcardEl.classList.toggle("flipped");
    sfx("flip");
  }

  // ---- drag / swipe ----
  var drag = null;
  flashcardEl.setAttribute("tabindex", "0");
  flashcardEl.setAttribute("role", "button");
  flashcardEl.setAttribute("aria-label", "Flashcard. Press Enter to flip, left arrow if still learning, right arrow if you got it.");
  flashcardEl.addEventListener("pointerdown", function(e){
    if (flying || (e.target.closest && e.target.closest(".spk"))) return;
    drag = { x: e.clientX, y: e.clientY, dx: 0, moved: false, id: e.pointerId };
    flashcardEl.classList.remove("spring");
    flashcardEl.classList.add("dragging");
    try { flashcardEl.setPointerCapture(e.pointerId); } catch (_) {}
  });
  flashcardEl.addEventListener("pointermove", function(e){
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x;
    var dy = e.clientY - drag.y;
    if (Math.abs(drag.dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
    if (!drag.moved) return;
    flashcardEl.style.transform = "translate(" + drag.dx + "px," + (dy * 0.25) + "px) rotate(" + (drag.dx * 0.06) + "deg)";
    var p = Math.min(1, Math.abs(drag.dx) / THRESH);
    swipeYes.style.opacity = drag.dx > 0 ? p : 0;
    swipeNo.style.opacity = drag.dx < 0 ? p : 0;
  });
  function endDrag(e, cancelled){
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var d = drag;
    drag = null;
    flashcardEl.classList.remove("dragging");
    if (!d.moved){
      if (!cancelled) flipCardNow();
      return;
    }
    if (!cancelled && Math.abs(d.dx) > THRESH){
      flyOut(d.dx > 0);
    } else {
      flashcardEl.classList.add("spring");
      flashcardEl.style.transform = "";
      swipeYes.style.opacity = 0;
      swipeNo.style.opacity = 0;
    }
  }
  flashcardEl.addEventListener("pointerup", function(e){ endDrag(e, false); });
  flashcardEl.addEventListener("pointercancel", function(e){ endDrag(e, true); });
  flashcardEl.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){
      e.preventDefault();
      flipCardNow();
    }
  });
  document.addEventListener("keydown", function(e){
    if (!document.getElementById("panel-cards").classList.contains("active")) return;
    var tg = e.target && e.target.tagName;
    if (tg === "INPUT" || tg === "TEXTAREA") return;

  var audioCtx = null;
  function tone(f, s, d, type, v){
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(v, s + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, s + d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(s); o.stop(s + d + 0.03);
  }
  function sfx(name){
    if (!soundOn) return;
    try {
      if (!audioCtx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      var t = audioCtx.currentTime;
      if (name === "correct"){ tone(660, t, 0.12, "triangle", 0.2); tone(990, t + 0.1, 0.2, "triangle", 0.2); }
      else if (name === "wrong"){ tone(230, t, 0.18, "sawtooth", 0.09); tone(170, t + 0.14, 0.28, "sawtooth", 0.09); }
      else if (name === "flip"){ tone(540, t, 0.06, "square", 0.05); tone(720, t + 0.05, 0.06, "square", 0.04); }
      else if (name === "yes"){ tone(520, t, 0.08, "triangle", 0.18); tone(780, t + 0.07, 0.14, "triangle", 0.18); }
      else if (name === "no"){ tone(320, t, 0.1, "triangle", 0.14); tone(250, t + 0.08, 0.14, "triangle", 0.14); }
      else if (name === "tap"){ tone(820, t, 0.04, "sine", 0.07); }
      else if (name === "goal" || name === "badge" || name === "level"){

  // ---------- confetti ----------
  var fxCanvas = null, fxCtx = null, parts = [], fxRaf = 0;
  var CONF_COLORS = ["#0E9E90", "#F5A300", "#F0584A", "#7C5CFF", "#2584E8", "#DB3F8F", "#FFD76A"];
  function fxResize(){
    var dpr = window.devicePixelRatio || 1;
    fxCanvas.width = window.innerWidth * dpr;
    fxCanvas.height = window.innerHeight * dpr;
    fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function confetti(x, y, n, spread){
    if (reduceMotion) return;
    try {
      if (!fxCanvas){
        fxCanvas = document.createElement("canvas");
        fxCanvas.id = "fx";
        document.body.appendChild(fxCanvas);
        fxCtx = fxCanvas.getContext("2d");
      }
      fxResize();
      n = n || 60;
      for (var i = 0; i < n; i++){
        var a = -Math.PI / 2 + (Math.random() - 0.5) * (spread || 2.4);
        var sp = 5 + Math.random() * 9;
        parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.28 + Math.random() * 0.12,
          r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
          c: CONF_COLORS[i % CONF_COLORS.length], life: 90 + Math.random() * 50 });
      }
      if (!fxRaf) fxRaf = requestAnimationFrame(fxStep);
    } catch (e) {}
  }
  function fxStep(){
    fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    parts = parts.filter(function(p){ return p.life > 0 && p.y < window.innerHeight + 30; });
    parts.forEach(function(p){
      p.vy += p.g; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      fxCtx.save();
      fxCtx.translate(p.x, p.y); fxCtx.rotate(p.r);
      fxCtx.globalAlpha = Math.min(1, p.life / 30);
      fxCtx.fillStyle = p.c;
      fxCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      fxCtx.restore();
    });
    if (parts.length) fxRaf = requestAnimationFrame(fxStep);
    else { fxRaf = 0; fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }

  function runTimer(seconds, onTick, onDone){
    clearTimer();
    var end = Date.now() + seconds * 1000;
    onTick(seconds);
    timerId = setInterval(function(){
      var left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      onTick(left);
      if (left <= 0){ clearTimer(); onDone(); }
    }, 250);
  }
  function fmt(t){

  // ---------- question content ----------
  var CURATED = [
    { q: "If I want to convince someone that my position is reasonable, I need to ______.", a: "make a compelling case", o: ["raise an objection", "take it out of context", "have a vested interest"], n: "To convince people you make a compelling case: put forward an argument and back it up with evidence." },

    { q: "If I accept part of someone's argument but still disagree overall, I can ______.", a: "acknowledge a valid point", o: ["take something out of context", "make a misleading claim", "exert influence"], n: "Acknowledging a valid point shows respect before you explain where you disagree." },
    { q: "If a journalist deliberately gives only one side of an issue, they are not ______.", a: "presenting a balanced argument", o: ["gaining credibility", "raising an objection", "drawing a distinction"], n: "A balanced argument covers more than one side of the issue." },

    { q: "If I publicly express my position on an issue, I ______.", a: "take a particular stance", o: ["take something out of context", "undermine an argument", "raise an objection"], n: "To take a stance (or adopt a position) is to state where you stand on an issue." },
    { q: "If I explain why my decision was reasonable, I ______.", a: "justify my decision", o: ["challenge an assumption", "sway public opinion", "take it out of context"], n: "To justify a decision is to give reasons that show it was reasonable." },
    { q: "If I explain the difference between two ideas that people often confuse, I ______.", a: "draw a distinction between them", o: ["win them over", "raise an objection", "appeal to emotions"], n: "Draw a distinction between X and Y = clearly explain how X and Y differ." },
    { q: "Advertisers often ______ rather than logic, hoping to influence what people buy.", a: "appeal to emotions", o: ["draw a distinction", "address a concern", "justify a decision"], n: "Appeal to emotions vs. appeal to reason: feelings versus logic." },
    { q: "The article quoted only the data that supported its view, which is a clear example of ______.", a: "selective use of evidence", o: ["a balanced presentation", "a valid point", "an appeal to reason"], n: "Selective use of evidence = choosing only the facts that help your side." },
    { q: "He repeated her sentence without the surrounding explanation, so he took it ______.", a: "out of context", o: ["into consideration", "for granted", "at face value"], n: "Take something out of context = remove the surrounding information so the meaning changes." },
    { q: "I'm not ______ that the evidence supports that conclusion.", a: "convinced", o: ["convincing", "convince", "convinces"], n: "\"I'm not convinced that…\" is a polite, academic alternative to \"That's wrong.\"" },
    { q: "I accept the premise of your argument, but I'm not sure the conclusion necessarily ______.", a: "follows", o: ["follow up", "followed", "following"], n: "A conclusion \"follows\" when it logically comes from the premise." },
    { q: "I don't think that argument holds ______ when we consider the long-term costs.", a: "up", o: ["out", "over", "off"], n: "An argument that \"holds up\" stays valid when it is tested." },
    { q: "The politician accused the media of ______ framing designed to mislead voters.", a: "deliberate", o: ["deliberately", "deliberation", "deliberated"], n: "An adjective is needed before the noun \"framing\": deliberate framing." }
  ];

  var CLOZE_POOL = FLAT.filter(function(item){
    return item.example.toLowerCase().indexOf(item.term.toLowerCase()) !== -1;
  });
  var COLLOC_POOL = FLAT.filter(function(item){
    return wordCount(item.term) >= 2 && !hasPlaceholder(item.term);
  });
  var TARGET_EXPR = [];
  FLAT.forEach(function(item){ if (item.ci >= 10 && wordCount(item.term) >= 2) TARGET_EXPR.push(item.term); });
  var OPENERS = [
    "I'd argue that…", "The way I see it…", "To some extent, I agree that…",
    "It could be argued that…", "On balance, I'd say…", "I'd question the assumption that…"
  ];
  var DEBATE_TOPICS = [
    "Universities should teach students how to use AI rather than prohibit it.",
    "Working from home should become the default option whenever a job can be done remotely.",
    "Social media companies should be legally responsible for harmful content published on their platforms.",
    "People should work fewer hours, even if this means earning less money.",
    "Governments should spend more money on public transport than on building new roads."
  ];
  var DRILL_STARTERS = [
    "One assumption about modern society that I would challenge is…",
    "I would make a compelling case for…",
    "One argument that I find difficult to counter is…",
    "I strongly believe that…, although…",
    "One distinction that people often fail to make is the distinction between…",
    "If society suddenly stopped using social media, I think…",
    "If I had to make a difficult decision tomorrow, I would…",
    "One decision I have made that I would still defend is…",
    "People often appeal to emotions when…",
    "One issue where I have a vested interest is…"
  ];

  function genCurated(used){
    for (var t = 0; t < 30; t++){
      var idx = rand(CURATED.length), c = CURATED[idx], id = "cur" + idx;
      if (used[id]) continue;
      used[id] = true;
      var opts = c.o.concat([c.a]);
      shuffleArray(opts);
      return { id: id, kind: "mcq", tag: "Complete the sentence", prompt: c.q, options: opts, answer: c.a, explain: c.n, speakText: c.q.replace("______", c.a), review: c.q.replace("______", "[" + c.a + "]") };
    }
    return null;
  }
  function genCloze(used){
    for (var t = 0; t < 40; t++){
      var item = pick(CLOZE_POOL), id = "cl" + item.key;
      if (used[id]) continue;
      used[id] = true;
      var re = new RegExp(escRe(item.term), "i");
      var shown = item.example.replace(re, "_____");
      var wc = wordCount(item.term);
      var others = FLAT.filter(function(o){
        return o.ci !== item.ci && o.term.toLowerCase() !== item.term.toLowerCase() && wordCount(o.term) === wc && !hasPlaceholder(o.term);
      });
      var seen = {}, dist = [];
      shuffleArray(others);
      others.forEach(function(o){ if (dist.length < 3 && !seen[o.term]) { seen[o.term] = true; dist.push(o.term); } });
      var opts = dist.concat([item.term]);
      shuffleArray(opts);
      return { id: id, kind: "mcq", tag: "Fill the blank", prompt: shown, options: opts, answer: item.term, explain: "", speakText: item.example, review: item.example.replace(re, "[" + item.term + "]") };
    }
    return null;
  }
  function genColloc(used){
    for (var t = 0; t < 40; t++){
      var item = pick(COLLOC_POOL), id = "co" + item.key;
      if (used[id]) continue;
      used[id] = true;
      var words = item.term.split(/\s+/);
      var last = words[words.length - 1];
      var lasts = {}, dist = [];
      var others = COLLOC_POOL.filter(function(o){ return o.ci !== item.ci; });
      shuffleArray(others);
      others.forEach(function(o){
        var w = o.term.split(/\s+/);
        var l = w[w.length - 1];
        if (dist.length < 3 && l.toLowerCase() !== last.toLowerCase() && !lasts[l]) { lasts[l] = true; dist.push(l); }
      });
      var opts = dist.concat([last]);
      shuffleArray(opts);
      var shown = words.slice(0, -1).join(" ") + " _____";
      return { id: id, kind: "mcq", tag: "Complete the collocation", prompt: shown, options: opts, answer: last, explain: "Example: " + item.example, speakText: item.term, review: item.term };
    }
    return null;
  }
  function genDictation(used){
    for (var t = 0; t < 40; t++){
      var text;
      if (Math.random() < 0.5){
        var pr = pick(PHRASES), pair = pick(pr[2]);
        text = pair[0];
      } else {
        text = pick(FLAT).example;
      }
      var id = "di" + text;
      if (used[id]) continue;
      var cleaned = text.replace(/…/g, " ").replace(/\s+/g, " ").trim();
      if (wordCount(cleaned) < 3) continue;
      used[id] = true;
      return { id: id, kind: "dictation", tag: "Listen and type", prompt: "", answer: cleaned, speakText: text.replace(/…/g, ","), review: cleaned };
    }
    return null;
  }
  function genMany(gen, n, used){
    var out = [];
    for (var i = 0; i < n; i++){ var q = gen(used); if (q) out.push(q); }
    return out;
  }
  var MODES = {
    daily: { title: "Daily 10", build: function(){
      var used = {};
      var qs = genMany(genCurated, 3, used).concat(genMany(genCloze, 3, used), genMany(genColloc, 2, used), genMany(genDictation, 2, used));
      shuffleArray(qs);
      return qs;
    } },
    cloze: { title: "Fill the blank", build: function(){
      var used = {};
      var qs = genMany(genCurated, 4, used).concat(genMany(genCloze, 6, used));
      shuffleArray(qs);
      return qs;
    } },
    colloc: { title: "Collocation builder", build: function(){ return genMany(genColloc, 10, {}); } },
    dict: { title: "Listen & type", build: function(){ return genMany(genDictation, 8, {}); } }
  };

  // ---------- dictation checking ----------
  function cleanForCompare(t){
    return t.replace(/[’‘]/g, "'").replace(/…/g, " ").replace(/-/g, " ");
  }
  function tokNorm(tok){ return tok.toLowerCase().replace(/[^a-z0-9']/g, ""); }
  function alignWords(a, b){
    var n = a.length, m = b.length, dp = [], i, j;
    for (i = 0; i <= n; i++){ var row = []; for (j = 0; j <= m; j++) row.push(0); dp.push(row); }
    for (i = n - 1; i >= 0; i--){
      for (j = m - 1; j >= 0; j--){
        dp[i][j] = (a[i] === b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var matched = []; for (i = 0; i < n; i++) matched.push(false);
    i = 0; j = 0;
    while (i < n && j < m){
      if (a[i] === b[j]){ matched[i] = true; i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    return { matched: matched, lcs: dp[0][0] };
  }

  // ---------- views ----------

  function startSession(mode){
    var m = MODES[mode];
    session = { mode: mode, title: m.title, qs: m.build(), i: 0, correct: 0, missed: [], combo: 0, xp: 0, lvl0: levelFor(game.xp) };

  function recordAnswer(q, ok, originEl){
    var gained;
    if (ok){
      session.correct++;
      session.combo++;
      gained = (q.kind === "mcq" ? 10 : 15) + Math.min(5, Math.max(0, session.combo - 2));
      game.stats.correct++;
      if (q.kind !== "mcq") game.stats.dict++;
      sfx("correct");
      buzz(15);
    } else {
      session.missed.push(q);
      session.combo = 0;
      gained = 3;
      sfx("wrong");
      buzz([30, 40, 30]);
    }
    session.xp += gained;
    noteActivity(1);
    award(gained, originEl);
  }
  function advance(){
    session.i++;
    if (session.i >= session.qs.length) renderResults(); else renderQuestion();
  }

  function renderQuestion(){
    clearPractice();

    practiceEl.appendChild(top);
    function afterAnswer(ok){
      bar.firstChild.style.width = ((session.i + 1) / session.qs.length * 100) + "%";
      comboEl.textContent = "🔥 ×" + session.combo;
      comboEl.hidden = session.combo < 2;
      if (session.combo >= 2){ comboEl.style.animation = "none"; void comboEl.offsetWidth; comboEl.style.animation = ""; }
      if (ok && session.combo >= 5 && session.combo % 5 === 0) confetti(window.innerWidth / 2, window.innerHeight * 0.5, 40, 2.6);
    }

    var card = el("div", "pr-card");
    card.appendChild(el("div", "pr-tag", q.tag));
    practiceEl.appendChild(card);

    var fb = el("div", "pr-feedback");
    fb.hidden = true;

    if (q.kind === "mcq"){
      card.appendChild(el("div", "pr-prompt", q.prompt));

          fb.hidden = false;
          nextB.hidden = false;

        });

        opts.appendChild(b);
      });

      var playRow = el("div", "pr-play");
      var playBtn = makeSpkBtn(q.speakText, false);
      playBtn.classList.add("big-inline");

      input.id = "dictInput" + session.i;

      input.setAttribute("autocapitalize", "off");

      card.appendChild(input);
      var checked = false;
      var checkB = btn("cbtn known block", "Check", function(){
        if (checked) { advance(); return; }
        checked = true;
        input.disabled = true;
        var tokens = cleanForCompare(q.answer).split(/\s+/).filter(function(t){ return tokNorm(t) !== ""; });
        var a = tokens.map(tokNorm);
        var b = cleanForCompare(input.value).split(/\s+/).map(tokNorm).filter(Boolean);

        var acc = res.lcs / Math.max(a.length, b.length, 1);

        fb.hidden = false;
        checkB.textContent = session.i + 1 >= session.qs.length ? "See results" : "Continue";
      });
      input.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); checkB.click(); } });
      var ctr = el("div", "cards-controls");
      ctr.style.marginTop = "14px";
      ctr.appendChild(checkB);
      checkB.style.width = "100%";
